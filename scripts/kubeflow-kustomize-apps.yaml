# Kubeflow apps that use Flux Kustomization (GitRepository + Kustomize).
# Excludes kubeflow-pipelines (has remote Kustomize refs that fail in Flux).
#
# Usage with mirror-kubeflow-images.sh:
#   ./scripts/mirror-kubeflow-images.sh --list-only
#   ./scripts/mirror-kubeflow-images.sh --push ghcr.io/deepak-muley
#   ./scripts/mirror-kubeflow-images.sh --push ghcr.io/deepak-muley --app kubeflow-central-dashboard
#   PATH_OVERRIDE=./custom/path ./scripts/mirror-kubeflow-images.sh --list-only --app kubeflow-central-dashboard

apps:
  kubeflow-central-dashboard:
    repo: https://github.com/kubeflow/manifests
    ref: master
    path: ./applications/centraldashboard/overlays/oauth2-proxy

  kubeflow-model-registry:
    repo: https://github.com/kubeflow/model-registry
    ref: v0.3.6
    path: ./manifests/kustomize/overlays/db

  katib:
    repo: https://github.com/kubeflow/manifests
    ref: master
    path: ./applications/katib/upstream/installs/katib-with-kubeflow

  tensorboard-controller:
    repo: https://github.com/kubeflow/manifests
    ref: master
    path: ./applications/tensorboard/tensorboard-controller/upstream/overlays/kubeflow

  training-operator:
    repo: https://github.com/kubeflow/manifests
    ref: master
    path: ./applications/training-operator/upstream/overlays/kubeflow

  spark-operator:
    repo: https://github.com/kubeflow/manifests
    ref: master
    path: ./applications/spark/spark-operator/overlays/kubeflow
