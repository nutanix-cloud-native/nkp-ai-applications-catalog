# Apps that lack a usable upstream chart: the bake tool renders each app's pinned
# Kustomize overlays into one air-gappable manifest and a configurable Helm chart.
# How baking works, when to use it, config schema, and usage: tools/bake/README.md
# Schema types: tools/bake/config.go. Run: `just bake <app> [version]`.
apps:
  kubeflow-pipelines:
    repo: https://github.com/kubeflow/manifests
    versions:
      - version: "2.15.0"
        ref: v1.11.0
        overlays:
          - applications/pipeline/upstream/cluster-scoped-resources
          - applications/pipeline/upstream/env/platform-agnostic
        airgapImages:
          - ghcr.io/containerd/busybox
          - ghcr.io/kubeflow/kfp-driver:2.15.0
          - ghcr.io/kubeflow/kfp-launcher:2.15.0
          - quay.io/argoproj/argoexec:v3.7.3
        chart:
          version: "2.15.0"
          appVersion: "2.15.0"
          # Core components worth tuning. The full app has 14 Deployments; expose
          # these for now and add more on demand (one line each).
          workloads:
            - name: ml-pipeline # API server; container name differs from workload
              kind: Deployment
              container: ml-pipeline-api-server
            - name: ml-pipeline-ui
              kind: Deployment
            - name: ml-pipeline-persistenceagent
              kind: Deployment
            - name: ml-pipeline-scheduledworkflow
              kind: Deployment
            - name: workflow-controller
              kind: Deployment
            - name: mysql
              kind: Deployment
            - name: seaweedfs
              kind: Deployment
          overlay:
            # Source lives outside charts/kubeflow-pipelines/ (bake RemoveAll that dir).
            templates:
              - overlays/kubeflow-pipelines/airgap-tutorials/kfp-airgap-tutorial-samples.yaml
            injections:
              # Keep PVCs across Helm uninstall, and size them from values so a later
              # expand is a configOverrides change instead of a live vs chart fight.
              # Quoted \n so `spec:` is not parsed as a sibling YAML key.
              # PVC size defaults live in these templates; bake regenerates
              # values.yaml from the workload list only.
              - find: "  name: mysql-pv-claim\n  namespace: kubeflow\nspec:\n  accessModes:\n    - ReadWriteOnce\n  resources:\n    requests:\n      storage: 20Gi"
                replace: "  name: mysql-pv-claim\n  namespace: kubeflow\n  annotations:\n    helm.sh/resource-policy: keep\nspec:\n  accessModes:\n    - ReadWriteOnce\n  resources:\n    requests:\n      storage: {{ (index ((index .Values \"storage\") | default (dict)) \"mysql\") | default \"20Gi\" }}"
              - find: "  name: seaweedfs-pvc\n  namespace: kubeflow\nspec:\n  accessModes:\n    - ReadWriteOnce\n  resources:\n    requests:\n      storage: 20Gi"
                replace: "  name: seaweedfs-pvc\n  namespace: kubeflow\n  annotations:\n    helm.sh/resource-policy: keep\nspec:\n  accessModes:\n    - ReadWriteOnce\n  resources:\n    requests:\n      storage: {{ (index ((index .Values \"storage\") | default (dict)) \"seaweedfs\") | default \"10Gi\" }}"
              # Mount airgap-ready tutorial samples + sample_config over api-server defaults (NCN-118204).
              - find: "          {{- with .Values.workloads.mlpipeline.resources }}\n          resources:\n            {{- toYaml . | nindent 12 }}\n          {{- end }}\n      securityContext:\n        seccompProfile:\n          type: RuntimeDefault\n      serviceAccountName: ml-pipeline"
                replace: "          volumeMounts:\n            - name: kfp-airgap-tutorial-samples\n              mountPath: /samples/tutorials/Data passing in python components/Data passing in python components - Files.py.yaml\n              subPath: data-passing.py.yaml\n              readOnly: true\n            - name: kfp-airgap-tutorial-samples\n              mountPath: /samples/tutorials/DSL - Control structures/DSL - Control structures.py.yaml\n              subPath: dsl-control.py.yaml\n              readOnly: true\n            - name: kfp-airgap-tutorial-samples\n              mountPath: /config/sample_config.json\n              subPath: sample_config.json\n              readOnly: true\n          {{- with .Values.workloads.mlpipeline.resources }}\n          resources:\n            {{- toYaml . | nindent 12 }}\n          {{- end }}\n      securityContext:\n        seccompProfile:\n          type: RuntimeDefault\n      serviceAccountName: ml-pipeline\n      volumes:\n        - name: kfp-airgap-tutorial-samples\n          configMap:\n            name: kfp-airgap-tutorial-samples"
