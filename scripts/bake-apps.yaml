# Apps that lack a usable upstream chart: the bake tool renders each app's pinned
# Kustomize overlays into one air-gappable manifest and a configurable Helm chart.
# How baking works, when to use it, config schema, and usage: tools/bake/README.md
# Schema types: tools/bake/config.go. Run: `just bake <app> [version]`.
apps:
  kubeflow-pipelines:
    repo: https://github.com/kubeflow/manifests
    versions:
      - version: "2.15.0"
        ref: v1.11.0
        overlays:
          - applications/pipeline/upstream/env/platform-agnostic-multi-user
        airgapImages:
          - ghcr.io/containerd/busybox
          - ghcr.io/kubeflow/kfp-driver:2.15.0
          - ghcr.io/kubeflow/kfp-frontend
          - ghcr.io/kubeflow/kfp-launcher:2.15.0
          - quay.io/argoproj/argoexec:v3.7.3
        patches:
          - applications/kubeflow-pipelines/2.15.0/patches/profile-controller-minio.yaml
          # CRDs live on kubeflow-platform(enabled first). Do not bake them into the Pipelines template or
          # DecoratorController can have race condition with CRD apply.
          - applications/kubeflow-pipelines/2.15.0/patches/remove-metacontroller-compositecontrollers-crd.yaml
          - applications/kubeflow-pipelines/2.15.0/patches/remove-metacontroller-controllerrevisions-crd.yaml
          - applications/kubeflow-pipelines/2.15.0/patches/remove-metacontroller-decoratorcontrollers-crd.yaml
        chart:
          version: "2.15.0"
          appVersion: "2.15.0"
          # Core components worth tuning. The full app has 14 Deployments; expose
          # these for now and add more on demand (one line each).
          workloads:
            - name: ml-pipeline # API server; container name differs from workload
              kind: Deployment
              container: ml-pipeline-api-server
            - name: ml-pipeline-ui
              kind: Deployment
            - name: ml-pipeline-persistenceagent
              kind: Deployment
            - name: ml-pipeline-scheduledworkflow
              kind: Deployment
            - name: workflow-controller
              kind: Deployment
            - name: mysql
              kind: Deployment
            - name: seaweedfs
              kind: Deployment
          # Keep auth path consistent: app VirtualServices route through oauth2-proxy,
          # which injects kubeflow-userid before forwarding to component backends.
          overlay:
            injections:
              - find: "host: metadata-envoy-service.kubeflow.svc.cluster.local"
                replace: "host: oauth2-proxy.kubeflow.svc.cluster.local"
              - find: |-
                  host: oauth2-proxy.kubeflow.svc.cluster.local
                              port:
                                number: 9090
                replace: |-
                  host: oauth2-proxy.kubeflow.svc.cluster.local
                              port:
                                number: 80
              - find: "host: ml-pipeline-ui.kubeflow.svc.cluster.local"
                replace: "host: oauth2-proxy.kubeflow.svc.cluster.local"
              - find: |-
                  host: oauth2-proxy.kubeflow.svc.cluster.local
                    trafficPolicy:
                replace: |-
                  host: ml-pipeline-ui.kubeflow.svc.cluster.local
                    trafficPolicy:
              - find: "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
                replace: "cluster.local/ns/kubeflow/sa/oauth2-proxy"
              # Pipelines APIs and backing services are accessed through oauth2-proxy,
              # so allow its service account identity in Istio auth policies.
              - find: "              - cluster.local/ns/kubeflow/sa/kubeflow-pipelines-cache"
                replace: "              - cluster.local/ns/kubeflow/sa/kubeflow-pipelines-cache\n              - cluster.local/ns/kubeflow/sa/oauth2-proxy"
              # Upstream renders an inverted userid predicate (notValues '*') that
              # denies authenticated requests. Flip it to values '*' in both policy
              # blocks (ml-pipeline and ml-pipeline-ui) during bake.
              - find: "        - key: request.headers[kubeflow-userid]\n          notValues:\n            - '*'"
                replace: "        - key: request.headers[kubeflow-userid]\n          values:\n            - '*'"
              # Cookie oauth2-proxy only sets kubeflow-userid. Drop the extra
              # Authorization check that official UI policy expects from ext_authz.
              - find: "        - key: request.headers[authorization]\n          values:\n            - '*'\n        - key: request.headers[kubeflow-userid]\n          values:\n            - '*'"
                replace: "        - key: request.headers[kubeflow-userid]\n          values:\n            - '*'"
              # V2 drivers turn sidecars off, so cache gRPC on :8887 has no
              # identity. Allow that port only; HTTP :8888 stays gated.
              - find: "        - key: request.headers[kubeflow-userid]\n          values:\n            - '*'\n  selector:\n    matchLabels:\n      app: ml-pipeline\n"
                replace: "        - key: request.headers[kubeflow-userid]\n          values:\n            - '*'\n    - to:\n        - operation:\n            ports:\n              - \"8887\"\n  selector:\n    matchLabels:\n      app: ml-pipeline\n"
              - find: "              - cluster.local/ns/kubeflow/sa/metadata-grpc-server"
                replace: "              - cluster.local/ns/kubeflow/sa/metadata-grpc-server\n              - cluster.local/ns/kubeflow/sa/oauth2-proxy"
              # Keep PVCs across Helm uninstall, and size them from values so a later
              # expand is a configOverrides change instead of a live vs chart fight.
              # Quoted \n so `spec:` is not parsed as a sibling YAML key.
              # After bake, re-add storage.mysql / storage.seaweedfs to values.yaml
              # (bake regenerates values from the workload list only).
              - find: "  name: mysql-pv-claim\n  namespace: kubeflow\nspec:\n  accessModes:\n    - ReadWriteOnce\n  resources:\n    requests:\n      storage: 20Gi"
                replace: "  name: mysql-pv-claim\n  namespace: kubeflow\n  annotations:\n    helm.sh/resource-policy: keep\nspec:\n  accessModes:\n    - ReadWriteOnce\n  resources:\n    requests:\n      storage: {{ (index ((index .Values \"storage\") | default (dict)) \"mysql\") | default \"20Gi\" }}"
              - find: "  name: seaweedfs-pvc\n  namespace: kubeflow\nspec:\n  accessModes:\n    - ReadWriteOnce\n  resources:\n    requests:\n      storage: 20Gi"
                replace: "  name: seaweedfs-pvc\n  namespace: kubeflow\n  annotations:\n    helm.sh/resource-policy: keep\nspec:\n  accessModes:\n    - ReadWriteOnce\n  resources:\n    requests:\n      storage: {{ (index ((index .Values \"storage\") | default (dict)) \"seaweedfs\") | default \"10Gi\" }}"

  kubeflow-central-dashboard:
    repo: https://github.com/kubeflow/manifests
    versions:
      - version: "1.10.0"
        ref: v1.11.0
        overlays:
          - applications/centraldashboard/overlays/oauth2-proxy
        # Deploy into its own namespace at bake time. The kustomize transformer also
        # repoints RBAC subjects, replacing the old runtime targetNamespace + patches.
        namespace: kubeflow-central-dashboard
        patches:
          - scripts/bake/patches/kubeflow-central-dashboard/1.10.0/centraldashboard-menu-links.yaml
        chart:
          version: "1.10.0"
          appVersion: v1.10.0
          workloads:
            - name: centraldashboard
              kind: Deployment
          # Layer the JupyterHub externalLink onto the baked dashboard: a helper that
          # renders the link when JupyterHub is installed, the menu-config slot it
          # fills, and a Reloader annotation so the link appears without a manual
          # restart. Kept as overlay (not hand-edits) so re-bake reproduces it.
          overlay:
            templates:
              - scripts/bake/overlays/kubeflow-central-dashboard/_helpers.tpl
            injections:
              - find: '"externalLinks":[]'
                replace: '"externalLinks":[{{ include "kubeflow-central-dashboard.jupyterhubExternalLink" . }}]'
              - find: |-
                  kind: Deployment
                  metadata:
                    labels:
                      app: centraldashboard
                replace: |-
                  kind: Deployment
                  metadata:
                    annotations:
                      # Links are read only at startup; Reloader rolls the pod when the ConfigMap gains
                      # the JupyterHub externalLink, so it shows without a manual restart.
                      configmap.reloader.stakater.com/reload: centraldashboard-config
                    labels:
                      app: centraldashboard
              - find: 'CD_REGISTRATION_FLOW: "false"'
                replace: 'CD_REGISTRATION_FLOW: "true"'
              - find: 'value: "false"'
                replace: 'value: "true"'
              # Keep dashboard path on unified auth entry point.
              - find: "host: centraldashboard.kubeflow.svc.cluster.local"
                replace: "host: oauth2-proxy.kubeflow.svc.cluster.local"
              - find: "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
                replace: "cluster.local/ns/kubeflow/sa/oauth2-proxy\n              - cluster.local/ns/istio-helm-gateway-ns/sa/istio-helm-ingressgateway\n              - cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
              - find: "    - kubeflow-gateway"
                replace: "    - kubeflow/kubeflow-gateway"
              - find: "sidecar.istio.io/inject: \"true\""
                replace: "sidecar.istio.io/inject: \"true\"\n        istio.io/rev: istio-helm"
