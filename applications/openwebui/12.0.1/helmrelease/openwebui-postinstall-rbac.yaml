# RBAC for post-install Job: patch openwebui-ui ConfigMap and read Traefik services.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${releaseName}-postinstall
  namespace: ${workspaceNamespace}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${releaseName}-postinstall
  namespace: ${workspaceNamespace}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch"]
    resourceNames: ["openwebui-ui"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${releaseName}-postinstall
  namespace: ${workspaceNamespace}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${releaseName}-postinstall
subjects:
  - kind: ServiceAccount
    name: ${releaseName}-postinstall
    namespace: ${workspaceNamespace}
---
# Role + RoleBinding in open-webui ns so Job can read open-webui LoadBalancer (external IP).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${releaseName}-postinstall-app-svc
  namespace: open-webui
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${releaseName}-postinstall-app-svc
  namespace: open-webui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${releaseName}-postinstall-app-svc
subjects:
  - kind: ServiceAccount
    name: ${releaseName}-postinstall
    namespace: ${workspaceNamespace}
---
