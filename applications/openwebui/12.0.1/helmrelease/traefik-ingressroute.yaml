# Exposes Open WebUI via Traefik with NKP's built-in forwardauth middleware (SSO).
# Launch URL: https://<traefik-lb>/open-webui/
#
# Open WebUI is a SvelteKit app that serves at / and references assets at
# /static/, /_app/, etc. Since we mount the app at /open-webui, we need:
#   1. Strip /open-webui prefix for the main route so the UI sees /
#   2. Proxy /static, /_app, and /api requests directly (assets and API calls
#      use absolute paths in the HTML/JS, bypassing the /open-webui prefix)
#
# SSO (forwardauth) is only on the /open-webui entry point. Once the user
# passes SSO and loads the page, subsequent API calls (/api/...) go directly
# to the backend — no additional SSO interception.
#
# Service naming: fullnameOverride "open-webui" makes the service name
# predictable as "open-webui" in the open-webui namespace.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ${releaseName}-stripprefix
  namespace: ${releaseNamespace}
spec:
  stripPrefix:
    prefixes:
      - /open-webui
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ${releaseName}-ui
  namespace: ${releaseNamespace}
spec:
  entryPoints:
    - websecure
  routes:
    # Main UI route — auth + strip /open-webui prefix
    - match: PathPrefix(`/open-webui`)
      kind: Rule
      middlewares:
        - name: forwardauth
        - name: ${releaseName}-stripprefix
      services:
        - name: open-webui
          port: 80
          namespace: open-webui
          kind: Service
    # SvelteKit runtime assets (JS/CSS) — no auth, no strip
    - match: PathPrefix(`/_app`)
      kind: Rule
      services:
        - name: open-webui
          port: 80
          namespace: open-webui
          kind: Service
    # Static assets (images, fonts) — no auth, no strip
    - match: PathPrefix(`/static`)
      kind: Rule
      services:
        - name: open-webui
          port: 80
          namespace: open-webui
          kind: Service
    # API routes used by the frontend — no auth (SSO enforced at /open-webui entry)
    - match: PathPrefix(`/api`)
      kind: Rule
      services:
        - name: open-webui
          port: 80
          namespace: open-webui
          kind: Service
---
