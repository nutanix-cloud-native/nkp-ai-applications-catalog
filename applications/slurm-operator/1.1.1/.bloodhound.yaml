# Bloodhound config for Slurm Operator 1.1.1
# The chart renders cert-manager resources that are not part of core K8s schemas.
k8s_versions:
  - 1.34.0

strict: true

skip_types:
  - cert-manager.io/v1/Certificate
  - cert-manager.io/v1/Issuer

additional_crds: []

substitution_vars:
  releaseNamespace: kommander
  releaseName: slurm-operator
  workspaceNamespace: workspace
