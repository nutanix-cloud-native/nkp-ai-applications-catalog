overview: |
  ## Overview

  Elasticsearch serves as a vector database with native support for dense vector search, combining full-text search, structured queries, and k-NN similarity search. Deployed via ECK (Elastic Cloud on Kubernetes), it provides a scalable, production-ready vector store for RAG, semantic search, and AI applications.

  ## What gets installed

  - **ECK Operator** — In `elastic-system` namespace; manages Elasticsearch and Kibana lifecycle
  - **Elasticsearch** — Vector-capable search engine in `elastic-vector-db` namespace
  - **Kibana** — Optional UI for management and visualization (can be disabled via values)

  | Endpoint | In-cluster URL |
  |----------|----------------|
  | Elasticsearch HTTP | `https://<release>-es-http.elastic-vector-db.svc.cluster.local:9200` |
  | Kibana (if enabled) | `http://<release>-kb-http.elastic-vector-db.svc.cluster.local:5601` |

  ## How to use it

  Create indices with `dense_vector` or `knn_vector` fields for vector search. Use the Elasticsearch API or Kibana to ingest and query vectors. Connect from in-cluster workloads via the URLs above. See [Elasticsearch vector search](https://www.elastic.co/guide/en/elasticsearch/reference/current/dense-vector.html) and [ECK docs](https://www.elastic.co/guide/en/cloud-on-k8s/current/index.html).

  ## Dependencies

  None.

  ## Prerequisites

  Kubernetes 1.21+. StorageClass for persistent volumes. For production, configure resource requests/limits and storage size in Helm values.

  ## Resources

  - [ECK Documentation](https://www.elastic.co/guide/en/cloud-on-k8s/current/index.html)
  - [Elasticsearch Vector Search](https://www.elastic.co/guide/en/elasticsearch/reference/current/dense-vector.html)
  - [ECK Stack Helm Chart](https://www.elastic.co/guide/en/cloud-on-k8s/current/k8s-stack-helm-chart.html)
