overview: |
  **What it is** — Kubeflow Pipelines runs end-to-end ML pipelines (train, tune, serve) with experiments and recurring runs. Kubernetes-native; deploys via Flux from kubeflow/manifests. Lets you build and run portable, scalable ML pipelines on Kubernetes with a full UI and API.

  **Highlights**
  - End-to-end pipelines (data → train → tune → serve)
  - Experiments, recurring runs, and artifact tracking
  - Part of the Kubeflow ecosystem; works with Katib, KServe, Training Operator

  **How to use**

  - **UI** — Access Pipelines via the [Kubeflow Central Dashboard](https://www.kubeflow.org/docs/components/central-dash/access/) (install that component for the main entry point). Or port-forward to the Pipelines UI: `kubectl port-forward svc/ml-pipeline-ui -n kubeflow 8080:80` then open `http://localhost:8080`.
  - **API/SDK** — For programmatic use, the Pipelines SDK connects to the API service. In-cluster: `http://ml-pipeline-api.kubeflow.svc.cluster.local:8888`. See [Connect the Pipelines SDK](https://www.kubeflow.org/docs/components/pipelines/v1/sdk/connect-api/).
  - **Namespace** — Deployed via kubeflow/manifests; components typically run in the `kubeflow` namespace. Verify with `kubectl get svc -n kubeflow | grep ml-pipeline`.

  **Documentation:** [Kubeflow Pipelines](https://www.kubeflow.org/docs/components/pipelines/) | **Project:** [kubeflow/manifests](https://github.com/kubeflow/manifests)
