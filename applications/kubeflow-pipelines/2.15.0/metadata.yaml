overview: |
  **What it is** — Kubeflow Pipelines runs end-to-end ML pipelines (train, tune, serve) with experiments and recurring runs. Kubernetes-native; deploys via Flux from kubeflow/manifests. Lets you build and run portable, scalable ML pipelines on Kubernetes with a full UI and API.

  **Highlights**
  - End-to-end pipelines (data → train → tune → serve)
  - Experiments, recurring runs, and artifact tracking
  - Part of the Kubeflow ecosystem; works with Katib, KServe, Training Operator

  **Prerequisites**
  - **Namespace** — Created automatically via `namespace.yaml`. This app deploys via Flux Kustomization (Kustomize from Git), not Helm.

  **How to use**

  - **UI** — Access Pipelines via the [Kubeflow Central Dashboard](https://www.kubeflow.org/docs/components/central-dash/access/) (install that component for the main entry point). Or port-forward to the Pipelines UI: `kubectl port-forward svc/ml-pipeline-ui -n kubeflow-pipelines 8080:80` then open `http://localhost:8080`.
  - **API/SDK** — For programmatic use, the Pipelines SDK connects to the API service. In-cluster: `http://ml-pipeline-api.kubeflow-pipelines.svc.cluster.local:8888`. See [Connect the Pipelines SDK](https://www.kubeflow.org/docs/components/pipelines/v1/sdk/connect-api/).

  **Documentation:** [Kubeflow Pipelines](https://www.kubeflow.org/docs/components/pipelines/) | **Project:** [kubeflow/manifests](https://github.com/kubeflow/manifests)
