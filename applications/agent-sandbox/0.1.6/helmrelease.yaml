# CRDs first. Helm does not upgrade CRDs in a chart's crds/ directory, so Flux
# applies them. prune is disabled: uninstall keeps the CRDs and every Sandbox.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${releaseName}-agent-sandbox-crds
  namespace: ${releaseNamespace}
spec:
  interval: 6h0m0s
  path: ./crds
  prune: false
  retryInterval: 1m0s
  sourceRef:
    kind: OCIRepository
    name: ${releaseName}-source
    namespace: ${releaseNamespace}
  timeout: 10m0s
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${releaseName}-helmrelease
  namespace: ${releaseNamespace}
spec:
  dependsOn:
    - name: ${releaseName}-agent-sandbox-crds
  interval: 6h0m0s
  path: ./helmrelease
  postBuild:
    substitute:
      appVersion: "0.1.6"
      releaseName: ${releaseName}
      releaseNamespace: ${releaseNamespace}
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: OCIRepository
    name: ${releaseName}-source
    namespace: ${releaseNamespace}
  timeout: 10m0s
  wait: true
---
