# Agent Sandbox CRDs. Applied by Flux on every reconcile, so schema changes land on
# upgrade (Helm never upgrades a chart's crds/ directory). The Kustomization that
# applies this folder has prune disabled, so uninstall keeps the CRDs and every
# Sandbox object stored under them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- agents.x-k8s.io_sandboxes.yaml
- extensions.agents.x-k8s.io_sandboxclaims.yaml
- extensions.agents.x-k8s.io_sandboxtemplates.yaml
- extensions.agents.x-k8s.io_sandboxwarmpools.yaml
---
