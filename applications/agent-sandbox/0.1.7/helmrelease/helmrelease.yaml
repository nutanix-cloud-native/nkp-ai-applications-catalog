apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${releaseName}-${appVersion}-chart
  namespace: ${releaseNamespace}
spec:
  interval: 24h
  ref:
    tag: 0.1.7
  url: oci://ghcr.io/nutanix-cloud-native/charts/agent-sandbox
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-sandbox
  namespace: ${releaseNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: ${releaseName}-${appVersion}-chart
    namespace: ${releaseNamespace}
  # The chart ships the CRDs in crds/. CreateReplace applies them on install and
  # on every upgrade, so schema changes land. Uninstall never removes crds/, so
  # stored Sandbox objects survive.
  install:
    crds: CreateReplace
    remediation:
      retries: 30
    timeout: 10m0s
  interval: 15s
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 30
    timeout: 10m0s
  valuesFrom:
    - kind: ConfigMap
      name: ${releaseName}-${appVersion}-defaults
---
