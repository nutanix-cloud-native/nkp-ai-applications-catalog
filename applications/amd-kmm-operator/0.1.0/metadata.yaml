overview: |-
  # Overview
  The AMD KMM Operator installs a shared Kernel Module Management (KMM) instance and manages private container registry integration for AMD GPU and Network operators.

  ## Key Features
  ### Shared KMM Instance
  Provides a single, pinned KMM deployment shared by both AMD GPU Operator and AMD Network Operator. Consumers disable their embedded KMM subchart.

  ### Private Registry Integration
  Automatically projects user-provided registry credentials into a docker-registry secret for KMM image push/pull and configures containerd on all nodes to trust the registry CA.

  ### Self-Healing Reconciliation
  A periodic reconciler keeps registry plumbing in sync with user-provided credentials, making install order irrelevant.

  ## Prerequisites
  If using a private registry, create the credentials secret before installing:
  ```
  kubectl create secret generic kmm-registry-credentials \
    --namespace=<workspace-namespace> \
    --from-literal=registry-url=registry.example.com:5000 \
    --from-literal=username=admin \
    --from-literal=password=<password> \
    --from-file=ca.crt=/path/to/ca.crt
  ```

  ## More Information
  - [AMD GPU Operator](https://github.com/ROCm/gpu-operator)
  - [AMD Network Operator](https://github.com/ROCm/network-operator)
  - [Kernel Module Management](https://github.com/rh-ecosystem-edge/kernel-module-management)
