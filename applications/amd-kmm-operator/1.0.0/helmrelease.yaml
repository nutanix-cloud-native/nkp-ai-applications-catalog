apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: amd-kmm-operator-helmrelease
  namespace: ${releaseNamespace}
spec:
  force: false
  prune: true
  wait: true
  interval: 6h
  retryInterval: 1m
  path: ./helmrelease
  sourceRef:
    kind: OCIRepository
    name: ${releaseName}-source
    namespace: ${releaseNamespace}
  timeout: 1m
  postBuild:
    substitute:
      appVersion: ${appVersion}
      releaseName: ${releaseName}
      releaseNamespace: ${releaseNamespace}
      credentialsSecretName: kmm-registry-credentials
      dockerconfigSecretName: kmm-registry-dockerconfig
      daemonsetName: amd-kmm-operator-registry-node-config
    substituteFrom:
      - kind: Secret
        name: kmm-registry-user-config
        optional: true
