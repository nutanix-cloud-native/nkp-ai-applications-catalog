apiVersion: batch/v1
kind: CronJob
metadata:
  name: kmm-registry-reconciler
  namespace: ${releaseNamespace}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: kmm-registry-reconciler
          restartPolicy: Never
          containers:
          - name: reconciler
            image: ${kubetoolsImageRepository:=docker.io/mesosphere/kubectl}:${kubetoolsImageTag:=v1.35.2-alpine}
            envFrom:
            - secretRef:
                name: kmm-registry-reconciler-config
            command: ["/bin/sh", "-e", "-c"]
            args:
            - |
              NAMESPACE="${releaseNamespace}"
              KUBETOOLS_IMAGE="${kubetoolsImageRepository:=docker.io/mesosphere/kubectl}:${kubetoolsImageTag:=v1.35.2-alpine}"

              # 1. Read credentials secret; exit gracefully if absent
              if ! kubectl get secret "$CREDENTIALS_SECRET" -n "$NAMESPACE" > /dev/null 2>&1; then
                echo "INFO: Secret $CREDENTIALS_SECRET not found in $NAMESPACE. Registry plumbing will not be created."
                exit 0
              fi

              REGISTRY_URL=$(kubectl get secret "$CREDENTIALS_SECRET" -n "$NAMESPACE" -o jsonpath='{.data.registry-url}' | base64 -d)
              REGISTRY_USER=$(kubectl get secret "$CREDENTIALS_SECRET" -n "$NAMESPACE" -o jsonpath='{.data.username}' | base64 -d)
              REGISTRY_PASS=$(kubectl get secret "$CREDENTIALS_SECRET" -n "$NAMESPACE" -o jsonpath='{.data.password}' | base64 -d)
              HAS_CA=$(kubectl get secret "$CREDENTIALS_SECRET" -n "$NAMESPACE" -o jsonpath='{.data.ca\.crt}' 2>/dev/null || true)

              if [ -z "$REGISTRY_URL" ] || [ -z "$REGISTRY_USER" ] || [ -z "$REGISTRY_PASS" ]; then
                echo "ERROR: registry-url, username, or password is empty in $CREDENTIALS_SECRET"
                exit 1
              fi

              # 2. Create/update dockerconfig secret
              kubectl create secret docker-registry "$DOCKERCONFIG_SECRET" \
                --docker-server="$REGISTRY_URL" \
                --docker-username="$REGISTRY_USER" \
                --docker-password="$REGISTRY_PASS" \
                --namespace="$NAMESPACE" \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "INFO: Secret $DOCKERCONFIG_SECRET reconciled."

              # 3. Build hosts.toml content and CA write command
              TOML_CA_LINE=""
              CA_WRITE="true"
              if [ -n "$HAS_CA" ]; then
                TOML_CA_LINE="  ca = \"/etc/containerd/certs.d/${REGISTRY_URL}/ca.crt\""
                CA_WRITE="echo \"\$CA_CERT\" | base64 -d > /host/etc/containerd/certs.d/${REGISTRY_URL}/ca.crt"
              fi

              # 4. Build init script — writes hosts.toml via printf, no heredoc needed
              INIT_SCRIPT="set -e; DIR=/host/etc/containerd/certs.d/${REGISTRY_URL}; mkdir -p \$DIR; printf '%s\n' 'server = \"https://${REGISTRY_URL}\"' '' '[host.\"https://${REGISTRY_URL}\"]' '  capabilities = [\"pull\", \"resolve\", \"push\"]' '${TOML_CA_LINE}' > \$DIR/hosts.toml; ${CA_WRITE}; echo INFO: containerd certs.d configured for ${REGISTRY_URL}; trap 'rm -rf \$DIR' TERM INT; while true; do sleep 3600 & wait; done"

              # 5. Write DaemonSet manifest to temp file using valid YAML
              DSFILE=$(mktemp /tmp/ds-XXXXXX.json)
              trap "rm -f $DSFILE" EXIT
              cat > "$DSFILE" <<'JSONEOF'
              {
                "apiVersion": "apps/v1",
                "kind": "DaemonSet",
                "metadata": {
                  "name": "__DS_NAME__",
                  "namespace": "__NS__"
                },
                "spec": {
                  "selector": { "matchLabels": { "app": "kmm-registry-node-config" } },
                  "template": {
                    "metadata": { "labels": { "app": "kmm-registry-node-config" } },
                    "spec": {
                      "hostPID": false,
                      "hostNetwork": false,
                      "containers": [{
                        "name": "configure",
                        "image": "__IMAGE__",
                        "command": ["/bin/sh", "-c"],
                        "args": ["__INIT_SCRIPT__"],
                        "env": [{
                          "name": "CA_CERT",
                          "valueFrom": { "secretKeyRef": { "name": "__CRED_SECRET__", "key": "ca.crt", "optional": true } }
                        }],
                        "volumeMounts": [{ "name": "containerd-certs", "mountPath": "/host/etc/containerd/certs.d" }],
                        "lifecycle": {
                          "preStop": {
                            "exec": { "command": ["/bin/sh", "-c", "rm -rf /host/etc/containerd/certs.d/__REGISTRY_URL__; echo 'INFO: cleaned up certs.d/__REGISTRY_URL__'"] }
                          }
                        }
                      }],
                      "volumes": [{ "name": "containerd-certs", "hostPath": { "path": "/etc/containerd/certs.d", "type": "DirectoryOrCreate" } }],
                      "tolerations": [{ "operator": "Exists" }]
                    }
                  }
                }
              }
              JSONEOF
              sed -i "s|__DS_NAME__|$DAEMONSET_NAME|g" "$DSFILE"
              sed -i "s|__NS__|$NAMESPACE|g" "$DSFILE"
              sed -i "s|__IMAGE__|$KUBETOOLS_IMAGE|g" "$DSFILE"
              sed -i "s|__CRED_SECRET__|$CREDENTIALS_SECRET|g" "$DSFILE"
              sed -i "s|__REGISTRY_URL__|$REGISTRY_URL|g" "$DSFILE"
              sed -i "s|__INIT_SCRIPT__|$INIT_SCRIPT|g" "$DSFILE"
              kubectl apply -f "$DSFILE"
              echo "INFO: DaemonSet $DAEMONSET_NAME reconciled."
