apiVersion: batch/v1
kind: Job
metadata:
  name: amd-kmm-operator-registry-reconciler-init
  namespace: ${releaseNamespace}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: amd-kmm-operator-registry-reconciler
      restartPolicy: OnFailure
      containers:
      - name: reconciler
        image: ${kubetoolsImageRepository:=docker.io/mesosphere/kubectl}:${kubetoolsImageTag:=v1.35.2-alpine}
        envFrom:
        - secretRef:
            name: amd-kmm-operator-registry-reconciler-config
        command: ["/bin/sh", "-e", "-c"]
        args:
        - |
          CRONJOB_READY=false
          for i in $(seq 1 30); do
            if kubectl get cronjob amd-kmm-operator-registry-reconciler -n "${releaseNamespace}" > /dev/null 2>&1; then
              CRONJOB_READY=true
              break
            fi
            echo "INFO: Waiting for CronJob to be created... ($i/30)"
            sleep 2
          done
          if [ "$CRONJOB_READY" = "false" ]; then
            echo "ERROR: CronJob amd-kmm-operator-registry-reconciler not found after 60s"
            exit 1
          fi
          echo "INFO: CronJob ready, running initial reconciliation..."
          exec kubectl create job -n "${releaseNamespace}" \
            amd-kmm-operator-registry-reconciler-initial \
            --from=cronjob/amd-kmm-operator-registry-reconciler
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: amd-kmm-operator-registry-reconciler
  namespace: ${releaseNamespace}
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: amd-kmm-operator-registry-reconciler
          restartPolicy: Never
          containers:
          - name: reconciler
            image: ${kubetoolsImageRepository:=docker.io/mesosphere/kubectl}:${kubetoolsImageTag:=v1.35.2-alpine}
            envFrom:
            - secretRef:
                name: amd-kmm-operator-registry-reconciler-config
            command: ["/bin/sh", "-e", "-c"]
            args:
            - |
              if ! command -v jq > /dev/null 2>&1; then
                echo "ERROR: jq is required but not found in the container image"
                exit 1
              fi

              NAMESPACE="${releaseNamespace}"
              KUBETOOLS_IMAGE="${kubetoolsImageRepository:=docker.io/mesosphere/kubectl}:${kubetoolsImageTag:=v1.35.2-alpine}"

              CRONJOB_NAME="amd-kmm-operator-registry-reconciler"
              CRONJOB_UID=$(kubectl get cronjob "$CRONJOB_NAME" -n "$NAMESPACE" -o jsonpath='{.metadata.uid}')

              # 1. Read credentials secret; exit gracefully if absent
              if ! kubectl get secret "$CREDENTIALS_SECRET" -n "$NAMESPACE" > /dev/null 2>&1; then
                echo "INFO: Secret $CREDENTIALS_SECRET not found in $NAMESPACE. Registry plumbing will not be created."
                exit 0
              fi

              REGISTRY_URL=$(kubectl get secret "$CREDENTIALS_SECRET" -n "$NAMESPACE" -o jsonpath='{.data.registry-url}' | base64 -d)
              REGISTRY_USER=$(kubectl get secret "$CREDENTIALS_SECRET" -n "$NAMESPACE" -o jsonpath='{.data.username}' | base64 -d)
              REGISTRY_PASS=$(kubectl get secret "$CREDENTIALS_SECRET" -n "$NAMESPACE" -o jsonpath='{.data.password}' | base64 -d)
              HAS_CA=$(kubectl get secret "$CREDENTIALS_SECRET" -n "$NAMESPACE" -o jsonpath='{.data.ca\.crt}' 2>/dev/null || true)

              if [ -z "$REGISTRY_URL" ] || [ -z "$REGISTRY_USER" ] || [ -z "$REGISTRY_PASS" ]; then
                echo "ERROR: registry-url, username, or password is empty in $CREDENTIALS_SECRET"
                exit 1
              fi

              # Normalize registry URL: extract host:port for containerd certs.d and dockerconfig
              REGISTRY_HOST=$(echo "$REGISTRY_URL" | sed 's|^https\?://||; s|/.*||')
              echo "INFO: Registry host: $REGISTRY_HOST (from registry-url: $REGISTRY_URL)"

              # 2. Create/update dockerconfig secret (owned by CronJob for GC)
              kubectl create secret docker-registry "$DOCKERCONFIG_SECRET" \
                --docker-server="$REGISTRY_HOST" \
                --docker-username="$REGISTRY_USER" \
                --docker-password="$REGISTRY_PASS" \
                --namespace="$NAMESPACE" \
                --dry-run=client -o json \
              | jq --arg crName "$CRONJOB_NAME" --arg crUid "$CRONJOB_UID" \
                '.metadata.ownerReferences = [{ apiVersion:"batch/v1", kind:"CronJob", name:$crName, uid:$crUid, blockOwnerDeletion:true }]' \
              | kubectl apply -f -
              echo "INFO: Secret $DOCKERCONFIG_SECRET reconciled."

              # 3. Build the container init script
              TOML_CA_LINE=""
              CA_CMD="true"
              if [ -n "$HAS_CA" ]; then
                TOML_CA_LINE="  ca = \"/etc/containerd/certs.d/$${REGISTRY_HOST}/ca.crt\""
                CA_CMD="printf '%s' \"\$CA_CERT\" > /host/etc/containerd/certs.d/$${REGISTRY_HOST}/ca.crt"
              fi

              INIT_SCRIPT="set -e
              CONFD=/host/etc/containerd/conf.d
              mkdir -p \$CONFD
              CONFD_FILE=\$CONFD/kmm-registry.toml
              if [ ! -f \$CONFD_FILE ]; then
                printf '%s\n' '[plugins.\"io.containerd.grpc.v1.cri\".registry]' '  config_path = \"/etc/containerd/certs.d\"' > \$CONFD_FILE
                echo INFO: wrote containerd config_path drop-in
              fi
              DIR=/host/etc/containerd/certs.d/$${REGISTRY_HOST}
              mkdir -p \$DIR
              printf '%s\n' 'server = \"https://$${REGISTRY_HOST}\"' '' '[host.\"https://$${REGISTRY_HOST}\"]' '  capabilities = [\"pull\", \"resolve\", \"push\"]' '$${TOML_CA_LINE}' > \$DIR/hosts.toml
              $${CA_CMD}
              echo INFO: containerd certs.d configured for $${REGISTRY_HOST}
              trap 'rm -rf \$DIR; rm -f \$CONFD_FILE' TERM INT
              while true; do sleep 3600 & wait; done"

              # 4. Build DaemonSet manifest via jq and apply (owned by CronJob for GC)
              jq -n \
                --arg name "$DAEMONSET_NAME" \
                --arg ns "$NAMESPACE" \
                --arg image "$KUBETOOLS_IMAGE" \
                --arg script "$INIT_SCRIPT" \
                --arg credSecret "$CREDENTIALS_SECRET" \
                --arg regUrl "$REGISTRY_HOST" \
                --arg cronjobName "$CRONJOB_NAME" \
                --arg cronjobUid "$CRONJOB_UID" \
              '{
                apiVersion: "apps/v1",
                kind: "DaemonSet",
                metadata: {
                  name: $name,
                  namespace: $ns,
                  ownerReferences: [{
                    apiVersion: "batch/v1",
                    kind: "CronJob",
                    name: $cronjobName,
                    uid: $cronjobUid,
                    blockOwnerDeletion: true
                  }]
                },
                spec: {
                  selector: { matchLabels: { app: "amd-kmm-operator-registry-node-config" } },
                  template: {
                    metadata: { labels: { app: "amd-kmm-operator-registry-node-config" } },
                    spec: {
                      hostPID: false,
                      hostNetwork: false,
                      containers: [{
                        name: "configure",
                        image: $image,
                        command: ["/bin/sh", "-c"],
                        args: [$script],
                        env: [{
                          name: "CA_CERT",
                          valueFrom: { secretKeyRef: { name: $credSecret, key: "ca.crt", optional: true } }
                        }],
                        volumeMounts: [
                          { name: "containerd-certs", mountPath: "/host/etc/containerd/certs.d" },
                          { name: "containerd-confd", mountPath: "/host/etc/containerd/conf.d" }
                        ],
                        lifecycle: {
                          preStop: {
                            exec: { command: ["/bin/sh", "-c", ("rm -rf /host/etc/containerd/certs.d/" + $regUrl + " /host/etc/containerd/conf.d/kmm-registry.toml; echo INFO: cleaned up certs.d/" + $regUrl)] }
                          }
                        }
                      }],
                      volumes: [
                        { name: "containerd-certs", hostPath: { path: "/etc/containerd/certs.d", type: "DirectoryOrCreate" } },
                        { name: "containerd-confd", hostPath: { path: "/etc/containerd/conf.d", type: "DirectoryOrCreate" } }
                      ],
                      tolerations: [{ operator: "Exists" }]
                    }
                  }
                }
              }' | kubectl apply -f -
              echo "INFO: DaemonSet $DAEMONSET_NAME reconciled."
