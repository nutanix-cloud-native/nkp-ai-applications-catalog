---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kmm-registry-reconciler
  namespace: ${releaseNamespace}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kmm-registry-reconciler
  namespace: ${releaseNamespace}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "delete"]
- apiGroups: ["apps"]
  resources: ["daemonsets"]
  verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kmm-registry-reconciler
  namespace: ${releaseNamespace}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kmm-registry-reconciler
subjects:
- kind: ServiceAccount
  name: kmm-registry-reconciler
  namespace: ${releaseNamespace}
