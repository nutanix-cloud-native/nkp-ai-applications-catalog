apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-${appVersion}-config-defaults
  namespace: ${releaseNamespace}
data:
  values.yaml: |
    # Default values for AMD KMM Operator (kernel-module-management).
    # See gpu-operator/helm-charts-k8s/charts/kmm/values.yaml for full options.
    #
    # Registry secret names for the reconciler are configured via the
    # kmm-registry-user-config Secret and injected via Flux postBuild.substituteFrom.
    controller:
      manager:
        image:
          repository: docker.io/rocm/kernel-module-management-operator
          tag: v1.0.0
        imagePullPolicy: IfNotPresent
        imagePullSecrets: "${dockerconfigSecretName}"
        env:
          relatedImageBuild: gcr.io/kaniko-project/executor:v1.23.2
          relatedImageSign: docker.io/rocm/kernel-module-management-signimage:v1.0.0
          relatedImageWorker: docker.io/rocm/kernel-module-management-worker:v1.0.0
          relatedImageBuildPullSecret: "${dockerconfigSecretName}"
          relatedImageSignPullSecret: "${dockerconfigSecretName}"
          relatedImageWorkerPullSecret: "${dockerconfigSecretName}"
        resources:
          limits:
            cpu: 500m
            memory: 384Mi
          requests:
            cpu: 10m
            memory: 64Mi
    webhookServer:
      webhookServer:
        image:
          repository: docker.io/rocm/kernel-module-management-webhook-server
          tag: v1.0.0
        imagePullPolicy: IfNotPresent
        imagePullSecrets: "${dockerconfigSecretName}"
        resources:
          limits:
            cpu: 500m
            memory: 384Mi
          requests:
            cpu: 10m
            memory: 64Mi
