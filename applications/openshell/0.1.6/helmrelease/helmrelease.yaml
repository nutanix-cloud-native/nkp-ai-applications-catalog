apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${releaseName}-chart
  namespace: ${releaseNamespace}
spec:
  interval: 24h
  ref:
    tag: 0.1.6
  url: oci://ghcr.io/nvidia/openshell/helm-chart
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openshell
  namespace: ${releaseNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: ${releaseName}-chart
    namespace: ${releaseNamespace}
  install:
    createNamespace: true
    remediation:
      retries: 30
    timeout: 10m0s
  interval: 15s
  # The chart has no Service label or ServiceMonitor values. This label opts the
  # gateway's "metrics" port into kube-prometheus-stack's built-in
  # dkp-service-monitor-metrics, so no ServiceMonitor CRD is required here.
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Service
              name: openshell
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: openshell
                labels:
                  servicemonitor.kommander.mesosphere.io/path: metrics
  # Without an explicit releaseName, Flux names the release
  # <targetNamespace>-<name> ("openshell-openshell"), and the chart derives the
  # gateway Service, gateway ID, and gRPC endpoint from it.
  releaseName: openshell
  targetNamespace: openshell
  upgrade:
    remediation:
      retries: 30
    timeout: 10m0s
  valuesFrom:
  - kind: ConfigMap
    name: ${releaseName}-${appVersion}-defaults
---
