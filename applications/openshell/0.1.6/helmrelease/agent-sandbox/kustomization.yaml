# Agent Sandbox v1.0.9 (controller, namespace agent-sandbox-system, and the
# cluster-wide sandboxes.agents.x-k8s.io CRD)
#
# Applies the vendored upstream manifest directly. Its Flux Kustomization
# (<release>-agent-sandbox in ../../helmrelease.yaml) has prune disabled, so
# uninstalling OpenShell never deletes the CRD or the Sandboxes stored under it.
# The OpenShell HelmRelease Kustomization depends on it, so the chart's Agent
# Sandbox preflight passes on first install.
#
# The vendored file is not edited. The patch below adds the production defaults
# the upstream Deployment does not set: resources, a restricted security context
# (the image runs as uid 65532), and liveness/readiness probes on the controller's
# healthz port (8081, /healthz and /readyz).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- agent-sandbox.yaml
patches:
- target:
    kind: Deployment
    name: agent-sandbox-controller
    namespace: agent-sandbox-system
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: agent-sandbox-controller
      namespace: agent-sandbox-system
    spec:
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: agent-sandbox-controller
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
            livenessProbe:
              httpGet:
                path: /healthz
                port: healthz
              initialDelaySeconds: 15
              periodSeconds: 20
            readinessProbe:
              httpGet:
                path: /readyz
                port: healthz
              initialDelaySeconds: 5
              periodSeconds: 10
---
