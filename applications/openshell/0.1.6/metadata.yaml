overview: |
  **Overview**

  NVIDIA OpenShell runs autonomous AI agents (coding assistants, tool-using agents, and similar workloads) inside isolated sandboxes on Kubernetes. Each sandbox is supervised by OpenShell, which enforces declarative policy over filesystem access, network egress, and provider credentials so agents only reach what they are allowed to.

  This application deploys the OpenShell gateway (a StatefulSet backed by SQLite on a PVC) into the dedicated `openshell` namespace. Sandboxes are created as Agent Sandbox `Sandbox` resources in the same namespace.

  **Key capabilities**

  - **Policy-enforced sandboxes** - Per-sandbox filesystem, network, and process policy enforced by a trusted supervisor.
  - **Credential brokering** - Provider API keys are stored encrypted by the gateway and injected into sandboxes without exposing them to the agent.
  - **Built-in PKI** - A pre-install hook generates the gateway mTLS certificates and sandbox JWT signing keys; no manual secret setup is required.
  - **Kubernetes-native** - Sandboxes are provisioned through the Kubernetes SIG Agent Sandbox API.

  **Prerequisites**

  - **Agent Sandbox** is a separate application (`agent-sandbox` 0.1.5). It must be enabled first, and OpenShell declares it as a required dependency. It installs the `sandboxes.agents.x-k8s.io` CRD and the controller.
  - A CNI that **enforces ingress and egress NetworkPolicy** (for example Cilium, the NKP default). Without enforcement, sandboxes can bypass OpenShell network policy.
  - A default StorageClass, or set `server.dataStorageClass` and `server.workspaceStorageClass` in config overrides.

  **How to use**

  - **Install order:** enable **Agent Sandbox** first, then OpenShell. OpenShell declares Agent Sandbox as a required dependency, and its install fails without the Agent Sandbox API.
  - **In-cluster address:** `openshell.openshell.svc.cluster.local:8080` (gRPC over mTLS).
  - **From your workstation:**
    1. Start a port-forward and keep it running: `kubectl -n openshell port-forward svc/openshell 8080:8080`.
    2. Install the `openshell` CLI v0.1.6 from the [NVIDIA OpenShell release](https://github.com/NVIDIA/OpenShell/releases/tag/v0.1.6).
    3. Copy the client bundle from the `openshell-client-tls` Secret (`ca.crt`, `tls.crt`, `tls.key`) into `~/.config/openshell/gateways/k8s/mtls/`.
    4. Register the gateway: `openshell gateway add https://127.0.0.1:8080 --name k8s --local`.
    5. Check it: `openshell -g k8s status`, then create a sandbox: `openshell -g k8s sandbox create --name demo -- echo hello`.
  - **Interactive terminal UI:** `openshell -g k8s term`.
  - **Sandbox images:** sandboxes use the gateway's default workload image, Ubuntu 24.04 (`nvcr.io/nvidia/base/ubuntu:24.04`), when you do not pass `--from`. Passing `--from nvcr.io/nvidia/base/ubuntu:24.04` gives the same image. To use a fuller image such as `ghcr.io/nvidia/openshell-community/sandboxes/base:latest` (Python, git, curl), pass `--from` **and** `--policy <file>`. Without a policy, that image stays in `ConfigurationInvalid` and never becomes Ready.

  **Notes**

  - The upstream Kubernetes deployment path is marked experimental by NVIDIA; values and defaults may change between releases.
  - The gateway is exposed as a ClusterIP Service. Connect locally with `kubectl -n openshell port-forward svc/openshell 8080:8080`.
  - Gateway metrics (`openshell_server_*`) are scraped automatically by the NKP Prometheus (kube-prometheus-stack) when it is enabled in the workspace.

  **Resources**

  [Documentation](https://docs.nvidia.com/openshell/kubernetes/setup) · [Project](https://github.com/NVIDIA/OpenShell) · [Helm chart](https://github.com/NVIDIA/OpenShell/tree/v0.1.6/deploy/helm/openshell)
