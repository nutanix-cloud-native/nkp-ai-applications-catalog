overview: |
  **Overview**

  Weaviate is an open-source, AI-native vector database that stores both objects and vectors, enabling combining vector search with structured filtering for next-generation AI applications. Supports hybrid (vector + keyword) search, GraphQL and REST APIs, and scales to billions of objects on Kubernetes. Use it for RAG, semantic search, and AI application backends.

  **Key capabilities**

  - **Vector + keyword** — Hybrid search with optional built-in vectorization (text2vec-transformers, contextionary, etc.).
  - **APIs** — GraphQL and REST for data access; gRPC for high-performance clients.
  - **Scale** — Horizontal scaling with Raft-based consensus; multi-tenancy support.
  - **Backup** — Backup and restore to S3, GCS, Azure, or filesystem.
  - **Production** — Persistent storage and optional GPU for vectorization modules.

  **In-cluster usage**

  Weaviate uses ClusterIP services. From another app in the cluster, connect via Kubernetes DNS:

  | Endpoint | In-cluster URL |
  |----------|----------------|
  | REST/GraphQL | `http://weaviate.weaviate.svc.cluster.local:80` |
  | gRPC | `weaviate.weaviate.svc.cluster.local:50051` |

  Same namespace: `http://weaviate:80`. To resolve the URL dynamically: `kubectl get svc weaviate -n weaviate -o jsonpath='http://{.metadata.name}.{.metadata.namespace}.svc.cluster.local:{.spec.ports[0].port}'`

  **Prerequisites**

  - **Storage** — For production, configure a suitable StorageClass in Helm values (default 32Gi).
  - **GPU (optional)** — For GPU-accelerated vectorization, enable the desired modules and ensure GPU device plugins are installed.

  **Resources**

  [Documentation](https://docs.weaviate.io/) · [Project](https://github.com/weaviate/weaviate) · [Helm chart](https://github.com/weaviate/weaviate-helm)
