overview: |
  **Overview**

  This is a **sample application** for demonstrating NKP catalog composability. It depends on Weaviate, indexes sample documents on first run, and provides a minimal RAG query UI. Enable Weaviate in the workspace first, then enable this app. Use the **Launch** button in the NKP UI to open the app.

  **Source**

  [github.com/deepak-muley/nkp-demo-rag](https://github.com/deepak-muley/nkp-demo-rag)

  **Dependencies**

  - **Weaviate** (required) — Vector database for document storage. Must be enabled in the same workspace first.

  **Sample documents**

  The app indexes NKP, Weaviate, and RAG overview docs. Try queries like "NKP", "Weaviate", or "RAG".
