overview: |
  **What it is** — Katib is Kubernetes-native hyperparameter tuning and neural architecture search. Supports multiple ML frameworks and search algorithms to automate model optimization and architecture search for Kubeflow and other Kubernetes ML workloads. Optimize model training without manual trial-and-error.

  **Highlights**
  - Distributed hyperparameter tuning with multiple search algorithms (e.g. Bayesian, grid, random)
  - Neural architecture search; supports PyTorch, TensorFlow, XGBoost, and more
  - Kubernetes CRDs (Experiment, Trial) for GitOps and integration with ML pipelines
  - Part of the Kubeflow ecosystem; works with KServe and training operators

  **Prerequisites**
  - **Namespace** — Created automatically via `namespace.yaml`. This app deploys via Flux Kustomization (Kustomize from Git), not Helm.

  **Access** — Create and monitor Experiments via the [Kubeflow Central Dashboard](https://www.kubeflow.org/docs/components/central-dash/) (Katib section), or use `kubectl` with Experiment and Trial CRDs.

  **Documentation:** [Katib docs](https://www.kubeflow.org/docs/components/hyperparameter-tuning/overview/) | **Project:** [GitHub](https://github.com/kubeflow/katib)
