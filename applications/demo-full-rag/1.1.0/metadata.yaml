overview: |
  **Overview**

  A **complete RAG application** for the NKP AI catalog. Uses **Weaviate** (vector DB) and **Ollama** (embeddings + LLM) for chunking, semantic search, and answer generation. Enable Weaviate and Ollama in the workspace first, then enable this app. Use the **Launch** button in the NKP UI to open the app.

  **Source**

  [github.com/deepak-muley/nkp-demo-full-rag](https://github.com/deepak-muley/nkp-demo-full-rag)

  **Dependencies**

  - **Weaviate** (required) — Vector database for document storage. Must be enabled in the same workspace first.
  - **Ollama** (required) — Embeddings (nomic-embed-text) and LLM (llama3.2). Must be enabled and models pulled before use.

  **Required Ollama models**

  Before using the app, pull in Ollama: `nomic-embed-text` (embeddings), `llama3.2` (LLM).
