overview: |
  **Overview**

  vLLM is a high-throughput, memory-efficient inference and serving engine for large language models, offering an OpenAI-compatible API for chat completions, embeddings, and more. Designed for production on Kubernetes. Use it as a backend for Open WebUI, custom apps, or any OpenAI-compatible client.

  **Key capabilities**

  - **OpenAI-compatible** — Chat completions, embeddings, and function calling; drop-in for existing clients.
  - **Performance** — PagedAttention and continuous batching for high throughput and low latency.
  - **Models** — Support for Llama, Mistral, Qwen, and others; GPU and multi-GPU support.
  - **Production-ready** — Deploy at scale on Kubernetes; tune via Helm values.

  **Resources**

  [Documentation](https://docs.vllm.ai/) · [Project](https://github.com/vllm-project/vllm)
