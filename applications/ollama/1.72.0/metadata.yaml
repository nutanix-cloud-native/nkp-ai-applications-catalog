overview: |
  **Overview**

  Ollama is a lightweight runtime for running large language models locally. It provides an OpenAI-compatible API and supports a wide range of open-source models including Llama, Mistral, Gemma, and more. Runs on Kubernetes; exposes API on port 11434. Use it as the backend for Open WebUI, kagent, or any OpenAI-compatible client.

  **Key capabilities**

  - **OpenAI-compatible API** — Drop-in backend for kagent, Open WebUI, and other AI frameworks.
  - **GPU support** — NVIDIA and AMD GPU acceleration for production inference; enable in Helm values.
  - **On-demand models** — Pull and serve models at runtime (e.g. `ollama pull llama3.2`).
  - **Persistence** — Optional persistent volume for model storage across restarts.
  - **Lightweight** — Runs on CPU-only clusters for development and testing.

  **In-cluster usage**

  Ollama exposes an OpenAI-compatible API on port 11434. From another app (Open WebUI, kagent, custom), connect via Kubernetes DNS:

  | Endpoint | In-cluster URL |
  |----------|----------------|
  | API | `http://ollama-ollama.ollama.svc.cluster.local:11434` |

  Same namespace: `http://ollama-ollama:11434`. Configure your client with this URL (e.g. Open WebUI, kagent `providers.default=ollama`).

  **Prerequisites**

  - **GPU (optional)** — For GPU acceleration, install NVIDIA or AMD device plugins and set `ollama.gpu.enabled=true` in Helm values.
  - **Storage (optional)** — For persistent model storage, enable `persistentVolume.enabled=true`. After deploy, pull models via `kubectl exec -n <namespace> <ollama-pod> -- ollama pull <model>`.

  **Resources**

  [Documentation](https://ollama.com) · [Project](https://github.com/ollama/ollama) · [Helm chart](https://github.com/otwld/ollama-helm)
