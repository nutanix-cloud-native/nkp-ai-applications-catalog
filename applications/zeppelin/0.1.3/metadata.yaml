overview: |
  ## Overview

  Apache Zeppelin is a web-based notebook that enables interactive data analytics and collaborative documents. It supports multiple interpreters including Spark, SQL, Python, Scala, and more. Use it for data exploration, visualization, and building data pipelines.

  ## What gets installed

  - Zeppelin server deployment in the `zeppelin` namespace
  - Web UI on port 80 (mapped from container port 8080)
  - Configurable Spark on Kubernetes integration

  ## How to use it

  - Use the **Launch** button from the NKP Application Dashboards tab to open the Zeppelin UI
  - Or connect in-cluster via `http://zeppelin.zeppelin.svc.cluster.local:80`

  ## Dependencies

  None.

  ## Prerequisites

  Kubernetes 1.26+. For Spark workloads, configure interpreters with adequate resources (minimum 4 CPUs, 6GB memory recommended).

  ## Resources

  - [Apache Zeppelin Documentation](https://zeppelin.apache.org/docs/latest/)
  - [Zeppelin on Kubernetes](https://zeppelin.apache.org/docs/latest/quickstart/kubernetes.html)
  - [Helm chart source](https://github.com/duyet/charts/tree/master/zeppelin)
