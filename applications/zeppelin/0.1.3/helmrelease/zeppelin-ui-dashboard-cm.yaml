apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-ui
  namespace: ${workspaceNamespace}
  labels:
    "kommander.d2iq.io/application": ${releaseName}
  annotations:
    "kustomize.toolkit.fluxcd.io/ssa": "Merge"
data:
  name: "Apache Zeppelin"
  # Job patches dashboardLink with LoadBalancer URL; omit here so Flux does not overwrite
  docsLink: "https://zeppelin.apache.org/docs/latest/"
  version: "0.1.3"
---
