apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${releaseName}-${appVersion}-chart
  namespace: ${releaseNamespace}
spec:
  interval: 6h0m0s
  ref:
    tag: 1.11.4
  url: oci://ghcr.io/nutanix-cloud-native/charts/mlflow
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mlflow
  namespace: ${releaseNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: ${releaseName}-${appVersion}-chart
    namespace: ${releaseNamespace}
  install:
    createNamespace: true
    remediation:
      retries: 30
    timeout: 10m
  interval: 15s
  targetNamespace: mlflow
  upgrade:
    remediation:
      retries: 30
    timeout: 10m
  valuesFrom:
    - kind: ConfigMap
      name: ${releaseName}-${appVersion}-defaults
  # Chart 1.11.4 hardcodes liveness/readiness to /health and exposes only probe
  # timings in values. extraArgs.staticPrefix remounts every route, including
  # /health, under /nkp/mlflow (mlflow/mlflow#19691). Keep this path in sync
  # with extraArgs.staticPrefix and ingress.hosts[].paths[].path in cm.yaml.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: mlflow
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: mlflow
              spec:
                template:
                  spec:
                    containers:
                      - name: mlflow
                        livenessProbe:
                          httpGet:
                            path: /nkp/mlflow/health
                        readinessProbe:
                          httpGet:
                            path: /nkp/mlflow/health
---
