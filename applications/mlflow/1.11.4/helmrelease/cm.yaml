apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-${appVersion}-defaults
  namespace: ${releaseNamespace}
data:
  values.yaml: |
    ---
    fullnameOverride: mlflow

    strategy:
      type: Recreate

    # Baseline resource defaults so the tracking server cannot exhaust node capacity.
    # Override via Workspace or Cluster Config Overrides for heavier artifact traffic.
    # Chart path: top-level resources (community-charts/mlflow).
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

    extraVolumes:
      - name: mlflow-data
        persistentVolumeClaim:
          claimName: mlflow-data

    extraVolumeMounts:
      - name: mlflow-data
        mountPath: /mlflow/data

    backendStore:
      defaultSqlitePath: /mlflow/data/mlflow.db

    artifactRoot:
      proxiedArtifactStorage: true
      defaultArtifactsDestination: /mlflow/data/mlartifacts

    # Fully qualified so airgap rewriting matches extra-images.txt.
    # These init containers are off by default; they appear with external
    # Postgres (dbchecker) or chart basic auth (ini-file-initializer).
    initImages:
      dbchecker:
        repository: docker.io/library/busybox
        tag: "1.38.0"
      iniFileInitializer:
        repository: docker.io/library/busybox
        tag: "1.38.0"

    extraArgs:
      staticPrefix: /nkp/mlflow

    ingress:
      enabled: true
      className: kommander-traefik
      annotations:
        traefik.ingress.kubernetes.io/router.tls: "true"
      hosts:
        - host: ""
          paths:
            - path: /nkp/mlflow
              pathType: ImplementationSpecific

    postgresql:
      enabled: false

    mysql:
      enabled: false

    minio:
      enabled: false
---
