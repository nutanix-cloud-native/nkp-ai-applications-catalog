k8s_versions:
  - 1.34.0
  - 1.35.0
  - 1.36.0

strict: false

# These CRDs are owned by dependencies (istio-helm), NKP core (Dex/cert-manager),
# or Kubeflow Profile CRDs — not by this app's baked manifests.
skip_types:
  - dex.mesosphere.io/v1alpha1
  - networking.istio.io/v1alpha3
  - networking.istio.io/v1beta1
  - security.istio.io/v1beta1
  - kyverno.io/v1
  - cert-manager.io/v1/Certificate
  - cert-manager.io/v1/Issuer
  - kubeflow.org/v1

additional_crds: []

substitution_vars:
  releaseNamespace: kommander
  workspaceNamespace: workspace
---
