overview: |
  **Overview**

  KAI Scheduler is a Kubernetes-native scheduler designed for AI and ML workloads at scale. It supports queue-based scheduling, fairness policies, gang-style scheduling patterns, and topology-aware placement for modern accelerator-heavy environments.

  KAI runs alongside the default Kubernetes scheduler and acts only on workloads that explicitly target `schedulerName: kai-scheduler`.

  **Key capabilities**

  - **Queue-based scheduling** - Organize workloads using queue objects and hierarchy.
  - **AI workload policies** - Fair-share and resource management controls for multi-tenant clusters.
  - **Advanced placement** - Supports topology-aware and batch-oriented scheduling workflows.
  - **Kubernetes-native operation** - Deploys as standard controller/scheduler components via Helm.

  **Prerequisites**

  - Kubernetes cluster.
  - For GPU workloads, vendor-specific accelerator resources (for example, `nvidia.com/gpu` or `amd.com/gpu`) must be available on cluster nodes.

  **Resources**

  [Documentation](https://github.com/kai-scheduler/KAI-Scheduler) · [Project](https://github.com/kai-scheduler/KAI-Scheduler)
