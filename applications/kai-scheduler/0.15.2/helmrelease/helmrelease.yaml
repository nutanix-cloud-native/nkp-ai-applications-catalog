apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${releaseName}-chart
  namespace: ${releaseNamespace}
spec:
  interval: 6h0m0s
  ref:
    tag: v0.15.2
  url: oci://ghcr.io/kai-scheduler/kai-scheduler/kai-scheduler
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kai-scheduler
  namespace: ${releaseNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: ${releaseName}-chart
    namespace: ${releaseNamespace}
  install:
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 30
    timeout: 10m0s
  interval: 15s
  targetNamespace: kai-scheduler
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 30
    timeout: 10m0s
  valuesFrom:
  - kind: ConfigMap
    name: ${releaseName}-${appVersion}-defaults
---
