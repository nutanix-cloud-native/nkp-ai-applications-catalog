overview: |
  **What it is** — Kubeflow Central Dashboard is the single UI for Pipelines, Notebooks, Katib, and other Kubeflow components. This overlay uses oauth2-proxy for auth; deploys via Flux from kubeflow/manifests. The main entry point for the Kubeflow UI.

  **Highlights**
  - Single UI for discovering and using Kubeflow components
  - OAuth2-proxy overlay for authentication
  - GitOps deployment via Flux

  **Prerequisites**
  - **Istio** (required) — Uses VirtualService CRD for routing. Declare `istio` as requiredDependencies; NKP installs it first.
  - **Namespace** — Created automatically via `namespace.yaml`. This app deploys via Flux Kustomization (Kustomize from Git), not Helm.

  **Access** — The Central Dashboard is the main entry point for Kubeflow. Access via Istio VirtualService/Ingress (after Istio setup), or port-forward: `kubectl port-forward svc/centraldashboard -n kubeflow-central-dashboard 8080:80` then open `http://localhost:8080`. From here you can navigate to Pipelines, Notebooks, Katib, Model Registry, and other components.

  **Documentation:** [Kubeflow Central Dashboard](https://www.kubeflow.org/docs/components/central-dash/) | **Project:** [kubeflow/manifests](https://github.com/kubeflow/manifests)
