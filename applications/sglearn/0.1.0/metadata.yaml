overview: |
  **Overview**

  SGLang is a fast serving framework for LLMs with RadixAttention and other optimizations. Deploy models with OpenAI-compatible API for inference workloads.

  **Key capabilities**

  - **High performance** — RadixAttention, continuous batching
  - **OpenAI-compatible API** — Drop-in for existing clients
  - **Multi-model** — Llama, Qwen, Mistral, and more
  - **GPU support** — NVIDIA and AMD GPU acceleration

  **Prerequisites**

  - GPU nodes with NVIDIA or AMD device plugins
  - Hugging Face token for gated models (optional)
  - Chart must be pushed to OCI: `helm pull` from source, then `helm push` to `oci://ghcr.io/nutanix-cloud-native/charts/sglang`

  **Resources**

  [Documentation](https://docs.sglang.io) · [Project](https://github.com/sgl-project/sglang)
