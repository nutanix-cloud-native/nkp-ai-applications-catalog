overview: |
  **Overview**

  SGLang is a high-performance inference server for LLM and multimodal workloads. This catalog
  entry deploys SGLang on Kubernetes through Flux and Helm, exposing an OpenAI-compatible endpoint
  that can be consumed by clients and automation in the workspace.

  **Key capabilities**

  - OpenAI-compatible HTTP API for chat/completions style workloads
  - Optimized scheduling and batching for inference serving
  - Configurable model source and runtime flags through Helm values
  - Namespace-isolated deployment into `sglang`

  **Model wiring**

  The server loads the model directly at startup. No default model is set in catalog defaults;
  set `model.id` in App Config Overrides (for example, `Qwen/Qwen2.5-0.5B-Instruct`).
  If your model requires authentication, provide a Hugging Face token (for example via a
  Kubernetes secret referenced in Helm values).

  **Prerequisites**

  - Sufficient worker capacity for your chosen runtime profile and model size
  - Container image pull access for the configured SGLang image
  - For CPU-only clusters, set CPU-specific runtime, probe, and resource overrides in App Config
    Overrides. Without these overrides, startup can be slow and health checks may fail before the
    model is ready.

  **Resources**

  [Documentation](https://docs.sglang.ai/) · [Project](https://github.com/sgl-project/sglang)
