apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sglang-strip-prefix
  namespace: sglang
spec:
  stripPrefix:
    prefixes:
      - /sglang
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sglang
  namespace: sglang
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: sglang-sglang-strip-prefix@kubernetescrd
spec:
  ingressClassName: kommander-traefik
  rules:
    - http:
        paths:
          - path: /sglang
            pathType: Prefix
            backend:
              service:
                name: sglang-${releaseName}
                port:
                  number: 30000
---
