overview: |
  **Overview**

  Flowise is an open-source, low-code builder for LLM applications. It provides a visual canvas to compose prompts, chains, agents, memory, tools, and model providers, then deploy those flows as chat or API endpoints.

  **Key capabilities**

  - **Visual builder** — Compose LangChain/LangGraph-style flows with a drag-and-drop UI.
  - **Model flexibility** — Connect to providers such as OpenAI-compatible APIs and self-hosted backends.
  - **Agent workflows** — Build multi-step tool-using agents with memory and retrieval components.
  - **API ready** — Expose completed flows for application integration.

  **Resources**

  [Documentation](https://docs.flowiseai.com/) · [Project](https://github.com/FlowiseAI/Flowise)
