apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${releaseName}-postinstall
  namespace: ${workspaceNamespace}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${releaseName}-postinstall-role
  namespace: ${workspaceNamespace}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${releaseName}-postinstall-binding
  namespace: ${workspaceNamespace}
subjects:
- kind: ServiceAccount
  name: ${releaseName}-postinstall
roleRef:
  kind: Role
  name: ${releaseName}-postinstall-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ${releaseName}-postinstall-cluster-role
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${releaseName}-postinstall-cluster-binding
subjects:
- kind: ServiceAccount
  name: ${releaseName}-postinstall
  namespace: ${workspaceNamespace} # This bridges the gap to your workspace
roleRef:
  kind: ClusterRole
  name: ${releaseName}-postinstall-cluster-role
  apiGroup: rbac.authorization.k8s.io
