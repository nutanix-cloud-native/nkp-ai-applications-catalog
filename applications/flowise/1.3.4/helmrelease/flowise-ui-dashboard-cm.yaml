# ConfigMap for NKP Launch button.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-ui
  namespace: ${releaseNamespace}
  labels:
    kommander.d2iq.io/application: ${releaseName}
  annotations:
    "kustomize.toolkit.fluxcd.io/ssa": "Merge"
data:
  name: ${releaseName}
  dashboardLink: "/nkp/flowise/"
  docsLink: "https://docs.flowiseai.com/"
  version: "1.3.4"
---
