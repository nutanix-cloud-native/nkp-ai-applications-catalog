overview: |
  **Overview**

  NVIDIA Run:ai is a GPU orchestration and workload management platform for AI.
  This application installs the Run:ai **cluster** components (operator,
  scheduler, and workload controllers) into the `runai` namespace and connects
  the cluster to a Run:ai control plane. The control plane can run on the same
  cluster (install **NVIDIA Run:ai Control Plane** first) or remotely.

  **Key capabilities**

  - GPU-aware scheduling with quotas, fair share, and over-quota borrowing
  - Fractional GPU and dynamic GPU memory sharing
  - Training, distributed training, inference, and interactive workspaces
  - Cluster metrics and workload telemetry reported to the control plane

  **Dependencies**

  Requires the NKP `nvidia-gpu-operator` (GPU Operator 25.10 to 26.3),
  `kube-prometheus-stack`, and `traefik` platform apps. Install `knative`
  (Serving 1.19 to 1.21) to enable standard inference workloads.

  This app bundles its own KAI Scheduler and installs the same CRDs as the
  **KAI Scheduler** catalog app. Do not deploy both on the same cluster.

  **Prerequisites**

  1. In the Run:ai UI, create the cluster (Resources > Clusters > New Cluster).
     The wizard shows the `controlPlane.url`, `controlPlane.bootstrapToken` (or
     `controlPlane.clientSecret`), `cluster.uid`, and `cluster.url` values for
     this cluster.
  2. FQDNs for the control plane and for this cluster that resolve from the
     cluster (cluster FQDN to the `kommander-traefik` load balancer). For a
     remote control plane, also create the TLS certificate:

     ```
     kubectl create namespace runai
     kubectl create secret tls runai-cluster-domain-tls-secret -n runai \
       --cert=/path/to/fullchain.pem --key=/path/to/private.pem
     ```

  3. If the control plane certificate is signed by a private CA (the default
     for the **NVIDIA Run:ai Control Plane** app), create the CA secret. CA trust
     is already enabled:

     ```
     kubectl create secret generic runai-ca-cert -n runai \
       --from-file=runai-ca.pem=/path/to/ca.pem
     ```

  4. If images are mirrored to a private registry, create the
     `runai-reg-creds` pull secret in the `runai` namespace and set
     `global.image.registry` to the mirror.
  5. For fractional GPU, GPU nodes need NVIDIA driver r615 or newer, the GPU
     Operator device plugin enabled, and container toolkit v1.20.1 or newer.

  **Configuration**

  Paste the wizard values into App Config Overrides:

  ```yaml
  controlPlane:
    url: runai.mycorp.local
    bootstrapToken: <bootstrap-token>
  cluster:
    uid: <cluster-uid>
    url: https://runai-cluster.mycorp.local
  ```

  The ingress class, OpenShift mode, and CA trust are defaults. The bootstrap
  token expires after about 2 hours and is reused by upgrades, so upgrade with
  a fresh token, or use `controlPlane.clientSecret` instead. To keep the secret
  out of the overrides, store it in a secret in the `runai` namespace and set
  `controlPlane.existingSecret` (key `client-secret`).

  **Resources**

  [Documentation](https://run-ai-docs.nvidia.com/self-hosted/getting-started/installation/install-using-helm/helm-install) · [System requirements](https://run-ai-docs.nvidia.com/self-hosted/getting-started/installation/install-using-helm/system-requirements)
