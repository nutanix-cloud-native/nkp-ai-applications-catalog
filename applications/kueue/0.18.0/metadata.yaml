overview: |
  **Overview**

  Kueue is a Kubernetes-native job queueing system. It does not replace the scheduler; it decides *whether and when* a job is admitted to run, based on quotas, fair sharing, and all-or-nothing (gang) admission. This prevents resource deadlock and starvation on shared clusters — especially expensive GPU clusters used for AI/ML training and batch jobs.

  **Key capabilities**

  - **Quota-based admission** — `ClusterQueue` / `LocalQueue` / `ResourceFlavor` CRDs manage cluster quotas.
  - **Gang scheduling** — multi-pod workloads are admitted all-or-nothing.
  - **Fair sharing** — borrowing across cohorts and preemption.
  - **Integrations** — `batch/Job`, `JobSet`, Ray, and Kubeflow training jobs are enabled by default; plain Pods, Deployments, and StatefulSets are supported when their integration is enabled (each non-core integration also needs its CRD/controller present).

  **Getting started**

  Kueue installs the controller and CRDs but ships **no queues** by default — quotas are cluster-specific. To start admitting work, create a `ResourceFlavor`, a `ClusterQueue` with a quota, and a `LocalQueue` in your namespace, then submit a Job carrying the `kueue.x-k8s.io/queue-name` label. See the catalog `README.md` for a copy-paste starter.

  **Dependencies — Cluster Autoscaler / ProvisioningRequest (optional)**

  Core Kueue queueing works on its own. The `ProvisioningRequest` `AdmissionCheck` — which lets Kueue ask the Kubernetes Cluster Autoscaler to provision capacity on demand before admitting a workload — has prerequisites that live **outside this catalog** and must be enabled at the platform/cluster level:

  - **CRD** — `provisioningrequests.autoscaling.x-k8s.io` must be installed on the cluster (owned by the Cluster Autoscaler, not by Kueue).
  - **Cluster Autoscaler flags** — the autoscaler must run with both `--enable-provisioning-requests=true` and `--kube-api-content-type=application/json`.

  **Resources**

  [Documentation](https://kueue.sigs.k8s.io/docs/) · [Project](https://github.com/kubernetes-sigs/kueue)
