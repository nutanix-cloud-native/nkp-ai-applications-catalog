overview: |-
  # Overview
  The AMD Network Operator automates NIC discovery and driver management for AMD AI NICs (e.g. AMD Pensando Pollara), with RDMA/RoCE support, Prometheus metrics, and dynamic resource allocation. It can be installed alongside the AMD GPU Operator on the same cluster. For a detailed overview of the operator's architecture and components, see the [Network Operator Overview](https://instinct.docs.amd.com/projects/network-operator/en/main/overview.html).

  ## Key Features
  ### Driver Lifecycle
  Builds and loads the out-of-tree AMD NIC modules (ionic, ionic_rdma, pds_core, and tawk_ipc) with KMM and Kaniko. Driver images are built for the target kernel, pushed to the configured registry, and loaded by KMM workers.

  ### NIC Discovery and Scheduling
  Uses Node Feature Discovery labels to select AMD physical NICs (PFs) or SR-IOV virtual functions (VFs), then deploys a device plugin that advertises `amd.com/nic` or `amd.com/vnic` to Kubernetes.

  ### Metrics and Health
  Deploys the NIC metrics exporter for Prometheus scraping and device health reporting. The exporter uses port `5001` so it can run beside the GPU Operator exporter on port `5000`.

  ### RDMA/RoCE and CNI Integration
  Enables RDMA/RoCE networking for AI/ML and HPC workloads and deploys the `amd-host-device` CNI plugin for Multus network attachments.

  ## Configuration
  After enabling this operator, follow the workflow below to create a `NetworkConfig` CR, build the driver, verify NIC resources, and deploy workloads. The chart **does not** auto-create a `NetworkConfig` (unlike the GPU Operator's `DeviceConfig`). Choose a CR name other than `default` to avoid conflicts with the GPU Operator.

  For physical NICs (PF), use the selector `feature.node.kubernetes.io/amd-nic: "true"`. For SR-IOV virtual function (VF) environments, use `feature.node.kubernetes.io/amd-vnic: "true"` instead.

  ### User Workflow
  1. **Enable prerequisites.** Enable `amd-kmm-operator` first. NKP supplies Node Feature Discovery, and NKP v2.18+ supplies Multus. Ensure NFD can run on the target nodes if they are tainted.
  2. **Enable this application.** Enable `amd-network-operator` in the workspace. Registry settings are provided in the `NetworkConfig` in step 4.
  3. **Check firmware and labels.** Confirm the NIC firmware with `nicctl show version firmware` or `dmesg`, and verify that target nodes have the selected NFD label:
     ```
     kubectl get nodes -l feature.node.kubernetes.io/amd-nic=true
     ```
     The driver version and the device-plugin's bundled `nicctl` must match. See the [AMD Network Device Plugin compatibility matrix](https://github.com/ROCm/k8s-network-device-plugin#compatibility-matrix).
  4. **Apply the `NetworkConfig`.** Use the example below, replacing the namespace and registry placeholders. Keep the CR name `network`; do not use `default`.
  5. **Wait for the driver and operator resources.** Verify the generated KMM `Module`, driver image, loaded modules, device plugin, and exporter:
     ```
     kubectl -n <workspace-namespace> get networkconfig network
     kubectl -n <workspace-namespace> get module network
     kubectl -n <workspace-namespace> get daemonsets
     kubectl get nodes -l feature.node.kubernetes.io/amd-nic=true
     ```
  6. **Deploy a workload.** Create a `NetworkAttachmentDefinition`, then request `amd.com/nic` or `amd.com/vnic` as shown in [Deploying Workloads with Network Devices](#deploying-workloads-with-network-devices).

  ### NetworkConfig CR
  The chart does **not** auto-create this CR. Use the name `network`; do **not** use `default`, because it conflicts with the GPU Operator's `DeviceConfig/default` and causes both operators to manage the same child resources. Align registry fields with the `kmm-registry-dockerconfig` secret created by the AMD KMM Operator.

  This example uses the latest supported v1.2.0 pairing: firmware **`1.117.5-a-77`** with `docker.io/rocm/k8s-network-device-plugin:v1.2.0`. Do not use that plugin with another firmware drop unless you have a compatible plugin image.
  ```
  kubectl apply -f - <<EOF
  apiVersion: amd.com/v1alpha1
  kind: NetworkConfig
  metadata:
    name: network
    namespace: <workspace-namespace>
  spec:
    selector:
      feature.node.kubernetes.io/amd-nic: "true"
    driver:
      enable: true
      blacklist: true
      version: "1.117.5-a-77"
      image: "<registry-host>:<port>/<project>/amdainic_kmods"
      upgradePolicy:
        enable: true
        maxParallelUpgrades: 1
        maxUnavailableNodes: 1
        rebootRequired: true
        nodeDrainPolicy:
          force: true
          timeoutSeconds: 600
          gracePeriodSeconds: -1
      imageBuild:
        baseImageRegistry: "<registry-host>:<port>"
        baseImageRegistryTLS:
          insecure: false
          insecureSkipTLSVerify: false
      imageRegistrySecret:
        name: "kmm-registry-dockerconfig"
      imageRegistryTLS:
        insecure: false
        insecureSkipTLSVerify: false
    devicePlugin:
      enableNodeLabeller: true
      devicePluginImage: docker.io/rocm/k8s-network-device-plugin:v1.2.0
      devicePluginImagePullPolicy: IfNotPresent
      nodeLabellerImage: docker.io/rocm/k8s-network-node-labeller:v1.2.0
      nodeLabellerImagePullPolicy: IfNotPresent
      imageRegistrySecret:
        name: "kmm-registry-dockerconfig"
    metricsExporter:
      enable: true
      image: docker.io/rocm/device-metrics-exporter:nic-v1.2.0
      imagePullPolicy: IfNotPresent
      hostNetwork: false
      port: 5001
      prometheus:
        serviceMonitor:
          enable: true
          honorLabels: true
          honorTimestamps: false
          interval: 30s
          labels:
            prometheus.kommander.d2iq.io/select: "true"
    secondaryNetwork:
      cniPlugins:
        enable: true
        image: docker.io/rocm/k8s-cni-plugins:v1.2.0
  EOF
  ```
  - `blacklist` — required on Ubuntu 24.04 to prevent the inbox `ionic` module from conflicting with the KMM-built driver. It requires `devicePlugin.enableNodeLabeller: true` and a reboot to apply the initramfs blacklist.
  - `version` — AINIC driver package from https://repo.radeon.com/amdainic. **Must match NIC firmware**; verify with `dmesg` or `nicctl show version firmware`.
  - `upgradePolicy` — drain and reboot one node at a time when `driver.version` changes. `rebootRequired: true` is required on Ubuntu when blacklist/initramfs must take effect.
  - `image` — the registry path where built NIC driver images are pushed/pulled. Do not include a tag; the operator manages tags automatically.
  - `imageRegistrySecret.name` — must be `kmm-registry-dockerconfig`, which is auto-created by the AMD KMM Operator reconciler.
  - `imageBuild.baseImageRegistry` — the private mirror hosting OS base images (e.g. `ubuntu:24.04`) used during Kaniko builds. This avoids Docker Hub rate limits.
  - Set `insecure`/`insecureSkipTLSVerify` to `true` only for registries using self-signed certificates or plain HTTP.
  - `devicePlugin.devicePluginImage` — the plugin image bundles `nicctl`; the host does not need nicctl installed. Bundled nicctl **must match firmware** (same drop as `driver.version`). The Docker Hub image `v1.2.0` supports firmware `1.117.5-a-56` / `1.117.5-a-77` ([compatibility matrix](https://github.com/ROCm/k8s-network-device-plugin#compatibility-matrix)).
  - `metricsExporter` — NIC exporter listens on **:5001** (`hostNetwork: false`) so it coexists with the GPU Operator exporter on **:5000**. The ServiceMonitor `prometheus.kommander.d2iq.io/select: "true"` label is required for NKP Prometheus to scrape it.
  - `secondaryNetwork.cniPlugins.enable` — must be `true` to deploy the `amd-host-device` CNI plugin binary to `/opt/cni/bin` on each node. Without this, Multus cannot attach NICs to pods (`failed to find plugin "amd-host-device"`).

  ### Config Overrides (Helm)
  The Helm chart exposes controller-level settings (image, resources, tolerations, etc.) via config overrides. The `NetworkConfig` CR above is **not** managed by Helm and must be created separately. For the full list of Helm overrides, see [values.yaml](https://github.com/ROCm/network-operator/blob/v1.2.0/helm-charts-k8s/values.yaml).

  ## Deploying Workloads with Network Devices
  Once the operator is installed and NIC drivers are loaded, workloads can request AMD NIC/vNIC devices. This requires Multus CNI and a `NetworkAttachmentDefinition`.

  ### 1. Create a NetworkAttachmentDefinition
  ```
  apiVersion: k8s.cni.cncf.io/v1
  kind: NetworkAttachmentDefinition
  metadata:
    name: amd-host-device-nad
    annotations:
      k8s.v1.cni.cncf.io/resourceName: amd.com/vnic
  spec:
    config: '{
      "name": "amd-host-device-nad",
      "cniVersion": "0.3.1",
      "type": "amd-host-device"
    }'
  ```

  ### 2. Request NIC Resources in the Workload
  Annotate pods with `k8s.v1.cni.cncf.io/networks: amd-host-device-nad` and request `amd.com/nic` or `amd.com/vnic` in resource limits:
  ```
  spec:
    template:
      metadata:
        annotations:
          k8s.v1.cni.cncf.io/networks: amd-host-device-nad
      spec:
        containers:
        - name: app
          resources:
            requests:
              amd.com/nic: 1
            limits:
              amd.com/nic: 1
          securityContext:
            capabilities:
              add: [IPC_LOCK, NET_ADMIN, NET_RAW]
  ```
  For full details including IB and RCCL test examples, see [Deploy a Workload with a Network Device](https://instinct.docs.amd.com/projects/network-operator/en/main/installation/workload.html).

  ## Troubleshooting: In-Tree Module Conflict
  The `driver.blacklist: true` setting in the NetworkConfig prevents the in-tree `ionic` kernel module from loading on reboot. However, if the module was already loaded before the operator was installed, the blacklist has no effect until the next reboot. A node reboot is required for the blacklist to take effect in this case.

  ## Dependencies
  - **AMD KMM Operator** — provides the shared KMM instance. Strongly recommended to enable first; without it, driver builds will not function. To use the chart's embedded KMM subchart instead of the shared catalog app, set `kmm.enabled: true` in your config overrides and skip enabling `amd-kmm-operator`. You must also manually create the `kmm-registry-dockerconfig` secret (normally auto-created by the KMM Operator reconciler) with your registry credentials — see [Registry Secret Configuration](https://instinct.docs.amd.com/projects/gpu-operator/en/latest/drivers/installation.html#registry-secret-configuration).
  - **Node Feature Discovery** — provided by the NKP platform layer (disabled in this chart).
  - **Multus CNI** — required for `NetworkAttachmentDefinition` support. Provided by NKP v2.18+ (disabled in this chart). For NKP v2.17.x and earlier, add `multus.enabled: true` to the Helm config overrides.

