apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-${appVersion}-config-defaults
  namespace: ${releaseNamespace}
data:
  values.yaml: |
    # Default values for AMD Network Operator (rocm-network/network-operator-charts).
    # See https://github.com/ROCm/network-operator for full options.
    # KMM is provided by the shared amd-kmm-operator component.
    kmm:
      enabled: false
    # NFD is provided by the Kommander platform layer.
    # IMPORTANT: Kommander's NFD worker must have the following toleration
    # to discover AMD NICs on tainted nodes:
    #   - key: "amd-dcm"
    #     operator: "Equal"
    #     value: "up"
    #     effect: "NoExecute"
    node-feature-discovery:
      enabled: false
    # Multus CNI — disabled; will be provided by NKP v2.18.
    multus:
      enabled: false
      image:
        repository: ghcr.io/k8snetworkplumbingwg/multus-cni
        tag: v4.2.2
        pullPolicy: IfNotPresent
    # Network operator controller manager
    controllerManager:
      manager:
        image:
          repository: docker.io/rocm/network-operator
          tag: v1.2.0
        imagePullPolicy: IfNotPresent
        imagePullSecrets: ""
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
    #
    # ---------------------------------------------------------------------------
    # NetworkConfig CR — create separately; these Helm values do not install it.
    # Unlike the GPU Operator's deviceConfig, this chart does not auto-create a
    # NetworkConfig. After enabling the app, apply a NetworkConfig named anything
    # other than "default" (that name conflicts with the GPU Operator DeviceConfig).
    # Copy the spec below into that CR. Users must update spec.driver.image to
    # their actual registry path.
    #
    # apiVersion: amd.com/v1alpha1
    # kind: NetworkConfig
    # metadata:
    #   name: network
    #   namespace: <workspace-namespace>
    # spec:
    #   selector:
    #     feature.node.kubernetes.io/amd-nic: "true"
    #   driver:
    #     enable: true
    #     # NOTE: Setting `spec.driver.blacklist: false` leaves the inbox/in-tree
    #     # `ionic` (and `pds_core`) kernel modules loaded. On Ubuntu 24.04
    #     # (kernel 6.8+) that inbox `ionic` does not export `ionic_api_*`
    #     # symbols. KMM then inserts out-of-tree `ionic_rdma` against the inbox
    #     # driver, `modprobe` fails with "Unknown symbol in module", and the
    #     # kmm-worker pods CrashLoopBackOff. Use `false` only when:
    #     #   - `driver.enable` is also `false` (inbox Ethernet only, no OOT RoCE), or
    #     #   - the node OS has no in-tree `ionic` (the AMD Ubuntu assumption).
    #     # `blacklist: true` writes a host modprobe blacklist so OOT DKMS modules
    #     # can load. It requires `devicePlugin.enableNodeLabeller: true` (the
    #     # labeller DaemonSet writes `/etc/modprobe.d/`) and a node reboot after
    #     # `update-initramfs -u`. A blacklist file does not unload a module that
    #     # is already loaded. Not supported on OpenShift (use MachineConfig).
    #     blacklist: true
    #     # Driver package version from https://repo.radeon.com/amdainic
    #     # (example: 1.117.1-a-42). Omit the image tag; the operator manages it.
    #     version: "1.117.1-a-42"
    #     image: "registry.example.com:5000/drivers/amdnetwork_kmod"
    #     imageBuild:
    #       baseImageRegistry: "docker.io"
    #       baseImageRegistryTLS:
    #         insecure: false
    #         insecureSkipTLSVerify: false
    #     imageRegistrySecret:
    #       name: "kmm-registry-dockerconfig"
    #     imageRegistryTLS:
    #       insecure: false
    #       insecureSkipTLSVerify: false
    #   devicePlugin:
    #     # Required for `driver.blacklist: true` to take effect on Ubuntu.
    #     # Nested CRD defaults do not apply when this object is omitted.
    #     enableNodeLabeller: true
    #     devicePluginImage: docker.io/rocm/k8s-network-device-plugin:v1.2.0
    #     devicePluginImagePullPolicy: IfNotPresent
    #     nodeLabellerImage: docker.io/rocm/k8s-network-node-labeller:v1.2.0
    #     nodeLabellerImagePullPolicy: IfNotPresent
    #   metricsExporter:
    #     enable: true
    #     image: docker.io/rocm/device-metrics-exporter:nic-v1.2.0
    #     imagePullPolicy: IfNotPresent
    #   secondaryNetwork:
    #     cniPlugins:
    #       enable: true
    #       image: docker.io/rocm/k8s-cni-plugins:v1.2.0
    # ---------------------------------------------------------------------------
