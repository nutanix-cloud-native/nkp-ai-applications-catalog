overview: |
  ## Overview

  [CrewAI](https://github.com/crewAIInc/crewAI) is an open-source framework for orchestrating role-playing, autonomous AI agents. By fostering collaborative intelligence, CrewAI empowers agents to work together seamlessly, tackling complex tasks.

  ## What gets installed

  - CrewAI runtime Deployment in the `crewai` namespace
  - Service for in-cluster DNS (`crewai.crewai.svc.cluster.local`)
  - Optional persistent volume for crew projects and output

  The deployment uses the community [sageil/crewai](https://hub.docker.com/r/sageil/crewai) Docker image (multi-arch: amd64, arm64) with CrewAI CLI and dependencies pre-installed.

  ## How to use it

  The pod runs a long-lived process. Use `kubectl exec` to run CrewAI commands:

  ```bash
  kubectl exec -it deployment/crewai -n crewai -- bash
  # Inside the container:
  crewai create crew my_crew
  crewai run
  ```

  Configure your LLM provider (e.g. Ollama, OpenAI) via environment variables or a `.env` file. Connect to in-cluster Ollama at `http://ollama.ollama.svc.cluster.local:11434` if Ollama is deployed in the same cluster.

  ## Dependencies

  None required. For LLM inference, deploy Ollama or configure an external API (OpenAI, etc.).

  ## Prerequisites

  Kubernetes 1.26+. Recommended: 2 CPU, 4Gi memory per replica.

  ## Resources

  - [CrewAI Documentation](https://docs.crewai.com)
  - [CrewAI GitHub](https://github.com/crewAIInc/crewAI)
  - [CrewAI Quickstart](https://docs.crewai.com/en/quickstart)
