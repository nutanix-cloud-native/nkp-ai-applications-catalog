overview: |
  **What it is** — The TensorBoard Controller exposes TensorBoard for training run visualization on Kubernetes. Part of Kubeflow; deploys via Flux from kubeflow/manifests. Manages TensorBoard instances for visualizing ML training runs (metrics, graphs, histograms).

  **Highlights**
  - Kubernetes CRD for TensorBoard; pairs with Training Operator and Pipelines
  - Part of the Kubeflow ecosystem
  - GitOps deployment via Flux

  **Prerequisites**
  - **Namespace** — Created automatically via `namespace.yaml`. This app deploys via Flux Kustomization (Kustomize from Git), not Helm.

  **Access** — Create TensorBoard CRs to visualize training runs. Access TensorBoard instances via the [Kubeflow Central Dashboard](https://www.kubeflow.org/docs/components/central-dash/) (TensorBoard section), or port-forward to individual TensorBoard pods.

  **Documentation:** [Kubeflow TensorBoard](https://www.kubeflow.org/docs/components/tensorboard/) | **Project:** [kubeflow/manifests](https://github.com/kubeflow/manifests)
