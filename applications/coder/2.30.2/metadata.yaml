overview: |
  **Overview**

  Coder is an AI-enabled remote development platform that provides cloud-based development environments on your infrastructure. Deploy on Kubernetes for secure, scalable dev environments with AI coding assistants. Teams can run VS Code, JetBrains, and other IDEs in the cloud with GPU support for AI workloads.

  **Key capabilities**

  - **Remote dev environments** — VS Code, JetBrains, Jupyter on Kubernetes
  - **AI coding assistants** — Integrate AI agents into development workflows
  - **Self-hosted** — Full control over your infrastructure and data
  - **PostgreSQL required** — Coder needs an external PostgreSQL database

  **Prerequisites**

  - PostgreSQL database (managed or in-cluster)
  - Configure `CODER_PG_CONNECTION_URL` and `CODER_ACCESS_URL` in Helm values

  **Resources**

  [Documentation](https://coder.com/docs) · [Helm chart](https://helm.coder.com/v2)
