overview: |
  **Overview**

  Coder provides secure, self-hosted cloud development environments on Kubernetes. Developers use browser or local IDE clients while workspaces run in the cluster, enabling centralized governance and scalable dev infrastructure.

  **Key capabilities**

  - Remote development environments managed on Kubernetes
  - Browser and local IDE workflows with centralized policy controls
  - Workspace lifecycle automation and RBAC-backed access
  - Flexible deployment through Helm and Flux in NKP

  **Prerequisites**

  - Kubernetes cluster resources sized for developer workspaces
  - External access plan for Coder (either dedicated LoadBalancer IP or ingress + DNS)

  **Access configuration (UI overrides)**

  - Dedicated LoadBalancer IP (direct service exposure):

    ```yaml
    coder:
      service:
        type: LoadBalancer
        loadBalancerIP: 1.2.3.4
      ingress:
        enable: false
      env:
        - name: CODER_ACCESS_URL
          value: http://1.2.3.4
    ```

  - Host-based ingress (domain routed through Traefik):

    ```yaml
    coder:
      service:
        type: ClusterIP
      ingress:
        enable: true
        className: kommander-traefik
        host: coder.apps.example.com
        tls:
          enable: true
          secretName: coder-domain-tls
      env:
        - name: CODER_ACCESS_URL
          value: https://coder.apps.example.com
    ```

  **Resources**

  [Documentation](https://coder.com/docs) · [Project](https://github.com/coder/coder) · [Helm Chart](https://helm.coder.com/v2)
