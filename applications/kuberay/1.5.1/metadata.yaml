overview: |-
  ## Overview
  KubeRay Operator is the Kubernetes operator for [Ray](https://docs.ray.io/), an open source framework for building and scaling distributed Python applications. It manages RayCluster, RayJob, and RayService custom resources on Kubernetes.

  ## Key capabilities

  - **RayCluster** — Deploy Ray clusters with head and worker nodes; supports autoscaling.
  - **RayJob** — Run batch Ray jobs that complete and exit.
  - **RayService** — Deploy long-running Ray Serve applications with zero-downtime upgrades.
  - **Ray Data, Ray Train, Ray Tune, Ray Serve** — Use Ray libraries for data processing, ML training, hyperparameter tuning, and model serving.

  ## Dependencies
  None. KubeRay Operator installs its own CRDs and manages Ray workloads.

  ## Prerequisites
  A Kubernetes cluster (1.26+ recommended). GPU support available for Ray workloads.

