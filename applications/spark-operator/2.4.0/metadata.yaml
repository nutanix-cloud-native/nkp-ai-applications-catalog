overview: |
  **What it is** — The Kubernetes operator for Apache Spark runs Spark applications as native Kubernetes resources. Manages driver and executor pods, submission, and lifecycle. Part of the Kubeflow ecosystem for data and ML workloads. Lets you run Apache Spark jobs as Kubernetes-native workloads.

  **Highlights**
  - Submit Spark applications via custom resources (SparkApplication); no need to manage pods manually
  - Supports batch and streaming; integrates with Hive, S3, and other data sources
  - Used by Kubeflow Pipelines and other ML/data workflows on Kubernetes
  - Community-driven; part of the Kubeflow manifests and ecosystem

  **Prerequisites**
  - **Namespace** — This app deploys via Flux Kustomization (Kustomize from Git), not Helm. Flux Kustomization's targetNamespace only rewrites the namespace in manifests; it does not create the namespace. The namespace `spark-operator` must exist before deployment. Create it with `kubectl create namespace spark-operator`, or use a ClusterResourceSet if your NKP setup provisions namespaces that way.

  **Documentation:** [Spark on K8s](https://spark.apache.org/docs/latest/running-on-kubernetes.html) | **Project:** [Kubeflow Spark](https://github.com/kubeflow/manifests/tree/master/applications/spark/spark-operator)
