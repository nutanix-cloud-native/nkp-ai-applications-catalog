overview: |
  **What it is** — Jupyter Notebook Controller runs Jupyter notebooks on Kubernetes. Standard for data scientists and ML devs; part of Kubeflow, deploys via Flux from kubeflow/manifests. Lets you spawn and manage Jupyter notebooks as Kubernetes resources (Notebook CRD).

  **Highlights**
  - Run notebooks on the cluster with configurable CPU/memory/GPU
  - Part of Kubeflow; integrates with Central Dashboard and Pipelines
  - GitOps-friendly via Flux Kustomization

  **Documentation:** [Kubeflow Jupyter](https://www.kubeflow.org/docs/components/notebooks/) | **Project:** [kubeflow/manifests](https://github.com/kubeflow/manifests)
