overview: |
  **What it is** — Jupyter Notebook Controller runs Jupyter notebooks on Kubernetes. Standard for data scientists and ML devs; part of Kubeflow, deploys via Flux from kubeflow/manifests. Lets you spawn and manage Jupyter notebooks as Kubernetes resources (Notebook CRD).

  **Highlights**
  - Run notebooks on the cluster with configurable CPU/memory/GPU
  - Part of Kubeflow; integrates with Central Dashboard and Pipelines
  - GitOps-friendly via Flux Kustomization

  **Prerequisites**
  - **Istio** (required) — Uses VirtualService CRD for notebook routing. Declare `istio` as requiredDependencies; NKP installs it first. Do not disable USE_ISTIO or the app is unusable.
  - **Namespace** — This app deploys via Flux Kustomization (Kustomize from Git), not Helm. Flux Kustomization's targetNamespace only rewrites the namespace in manifests; it does not create the namespace. The namespace `jupyter-notebook-controller` must exist before deployment. Create it with `kubectl create namespace jupyter-notebook-controller`, or use a ClusterResourceSet if your NKP setup provisions namespaces that way.

  **Documentation:** [Kubeflow Jupyter](https://www.kubeflow.org/docs/components/notebooks/) | **Project:** [kubeflow/manifests](https://github.com/kubeflow/manifests)
