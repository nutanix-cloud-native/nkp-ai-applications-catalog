apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${releaseName}-kustomize
  namespace: ${releaseNamespace}
spec:
  interval: 10m
  path: ./applications/jupyter/notebook-controller/upstream/overlays/kubeflow
  prune: true
  sourceRef:
    kind: GitRepository
    name: ${releaseName}-manifests
    namespace: ${releaseNamespace}
  targetNamespace: jupyter-notebook-controller
  timeout: 5m
  wait: true
---
