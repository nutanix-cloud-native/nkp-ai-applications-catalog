overview: |
  **Overview**

  kagent is a Kubernetes-native AI agent framework for building, deploying, and
  managing AI agents directly on Kubernetes. In this version, kagent uses the
  Go ADK runtime and reconciles declarative resources via a controller.

  **Key capabilities**

  - **CRD-driven** — Declarative lifecycle via kagent resources such as Agent, ModelConfig, and RemoteMCPServer.
  - **Go ADK runtime** — Modern runtime architecture for multi-agent workflows.
  - **Tools and MCP** — Integrates Kubernetes/Grafana/Prometheus tooling and MCP servers.
  - **Web UI** — UI access is supported via in-cluster service + port-forward.

  **Access**

  Use port-forward to access the UI:
  `kubectl port-forward -n kagent svc/kagent-ui 8080:8080`
  then open `http://localhost:8080`.

  This catalog version intentionally does not provide an NKP dashboard launch link.

  **Dependencies (this catalog)**

  This entry declares a soft dependency on **Ollama** and defaults to
  `providers.default=ollama` with an in-cluster host override. Ensure Ollama (or
  another configured provider) is reachable; otherwise kagent installs but cannot
  answer model requests.

  **Database**

  kagent 0.8+ uses PostgreSQL as the only backend. The bundled PostgreSQL in the
  chart is intended for development/evaluation only. For production, configure an
  external database with `database.postgres.url`.

  **Resources**

  [Documentation](https://kagent.dev) · [Project](https://github.com/kagent-dev/kagent)
