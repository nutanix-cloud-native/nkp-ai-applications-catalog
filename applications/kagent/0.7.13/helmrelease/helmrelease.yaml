apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${releaseName}-chart
  namespace: ${releaseNamespace}
spec:
  interval: 6h0m0s
  ref:
    tag: 0.7.13
  url: oci://ghcr.io/kagent-dev/kagent/helm/kagent
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: ${releaseNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: ${releaseName}-chart
    namespace: ${releaseNamespace}
  dependsOn:
  - name: ${releaseName}-crds
    namespace: ${releaseNamespace}
  install:
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 30
  interval: 15s
  targetNamespace: kagent
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 30
  postRenderers:
  - kustomize:
      patches:
      - target:
          labelSelector: app.kubernetes.io/version
        patch: |
          - op: replace
            path: /metadata/labels/app.kubernetes.io~1version
            value: "0.7.13"
  valuesFrom:
  - kind: ConfigMap
    name: ${releaseName}-${appVersion}-defaults
  values:
    fullnameOverride: "kagent"
---
