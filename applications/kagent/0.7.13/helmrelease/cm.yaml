apiVersion: v1
data:
  values.yaml: |
    # Keep release names stable (kagent-*) so Agent/RemoteMCPServer references resolve.
    fullnameOverride: "kagent"
    # The chart defaults images to cr.kagent.dev, which no longer serves the 0.7.13
    # controller/ui/app images; pin the registry to ghcr.io where they are published.
    registry: "ghcr.io"
    # Expose UI through Traefik + ForwardAuth at /nkp/kagent/.
    ui:
      service:
        type: ClusterIP
      ingress:
        enabled: true
        ingressClassName: kommander-traefik
        path: /nkp/kagent/
        pathType: Prefix
        annotations:
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.middlewares: "${releaseNamespace}-forwardauth@kubernetescrd"
    # Ensure observability-agent is deployed (uses Prometheus/Grafana tools).
    # For it to show "available" in the UI, Grafana (and optionally Prometheus)
    # should be reachable; see grafana-mcp.grafana.url (default: grafana.kagent:3000/api).
    agents:
      observability-agent:
        enabled: true
    grafana-mcp:
      fullnameOverride: "kagent-grafana-mcp"
    providers:
      default: ollama
      ollama:
        config:
          host: "ollama-ollama.ollama.svc.cluster.local:11434"
        model: "llama3.2"
        provider: "Ollama"
kind: ConfigMap
metadata:
  name: ${releaseName}-${appVersion}-defaults
  namespace: ${releaseNamespace}
---
