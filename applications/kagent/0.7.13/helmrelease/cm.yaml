apiVersion: v1
data:
  values.yaml: |
    # Keep release names stable (kagent-*) so Agent/RemoteMCPServer references resolve.
    fullnameOverride: "kagent"
    # Avoid OCI digest-style versions (e.g. 0.7.13+<digest>) in image tags.
    tag: "0.7.13"
    # Expose UI via LoadBalancer so postinstall job can set dashboardLink to its external IP.
    ui:
      service:
        type: LoadBalancer
    # Ensure observability-agent is deployed (uses Prometheus/Grafana tools).
    # For it to show "available" in the UI, Grafana (and optionally Prometheus)
    # should be reachable; see grafana-mcp.grafana.url (default: grafana.kagent:3000/api).
    agents:
      observability-agent:
        enabled: true
    grafana-mcp:
      fullnameOverride: "kagent-grafana-mcp"
    providers:
      default: ollama
      ollama:
        config:
          host: "ollama-ollama.ollama.svc.cluster.local:11434"
        model: "llama3.2"
        provider: "Ollama"
kind: ConfigMap
metadata:
  name: ${releaseName}-${appVersion}-defaults
  namespace: ${releaseNamespace}
---
