# Post-install Job: discovers Traefik LoadBalancer URL and patches kagent-ui
# ConfigMap with dashboardLink so the NKP Launch button opens kagent UI via
# Traefik (with forward-auth SSO). Requires Traefik + traefik-forward-auth in cluster.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${releaseName}-postinstall-0.7.13
  namespace: ${workspaceNamespace}
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: ${releaseName}-postinstall
      restartPolicy: OnFailure
      containers:
        - name: patch-dashboard-link
          image: mesosphere/kubectl:v1.34.1-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: WORKSPACE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Traefik in NKP/Kommander is usually kommander-traefik in workspace ns
            - name: TRAEFIK_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TRAEFIK_SERVICE_NAME
              value: "kommander-traefik"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Starting post-install (ns=$WORKSPACE_NAMESPACE, traefik=$TRAEFIK_SERVICE_NAME in $TRAEFIK_NAMESPACE)"
              sleep 15
              echo "Waiting for kagent-ui ConfigMap..."
              for i in $(seq 1 60); do
                if kubectl get configmap kagent-ui -n "$WORKSPACE_NAMESPACE" 2>/dev/null; then
                  echo "ConfigMap kagent-ui found."
                  break
                fi
                echo "Waiting for ConfigMap... ($i/60)"; sleep 5
              done
              if ! kubectl get configmap kagent-ui -n "$WORKSPACE_NAMESPACE" 2>/dev/null; then
                echo "ERROR: kagent-ui ConfigMap not found after 5min"; exit 1
              fi

              echo "Waiting for Traefik LoadBalancer..."
              IP=""; HOSTNAME=""
              for i in $(seq 1 60); do
                IP=$(kubectl get svc -n "$TRAEFIK_NAMESPACE" "$TRAEFIK_SERVICE_NAME" -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
                HOSTNAME=$(kubectl get svc -n "$TRAEFIK_NAMESPACE" "$TRAEFIK_SERVICE_NAME" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
                if [ -n "$IP" ] || [ -n "$HOSTNAME" ]; then
                  break
                fi
                echo "Waiting... ($i/60)"; sleep 5
              done

              if [ -z "$IP" ] && [ -z "$HOSTNAME" ]; then
                echo "ERROR: Traefik LoadBalancer not found"; kubectl get svc -n "$TRAEFIK_NAMESPACE" "$TRAEFIK_SERVICE_NAME" -o yaml 2>/dev/null || true; exit 1
              fi

              if [ -n "$IP" ]; then
                ENDPOINT="https://$IP/kagent/"
              else
                ENDPOINT="https://$HOSTNAME/kagent/"
              fi

              PAYLOAD=$(printf '{"data": {"dashboardLink": "%s"}}' "$ENDPOINT")
              kubectl patch configmap kagent-ui -n "$WORKSPACE_NAMESPACE" --type=merge -p "$PAYLOAD"
              echo "Dashboard link updated: $ENDPOINT"
---
