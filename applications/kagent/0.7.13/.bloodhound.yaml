# Kubernetes versions (match https://github.com/yannh/kubernetes-json-schema)
k8s_versions:
  - 1.34.0

# Use non-strict validation for kagent: the chart may emit resources with fields
# that the standalone-strict schema disallows. Non-strict allows these.
strict: false

skip_types:
  - kagent.dev/v1alpha2/Agent
  - kagent.dev/v1alpha2/ModelConfig
  - kagent.dev/v1alpha2/RemoteMCPServer
  # Traefik CRDs (not in k8s schema; skip so bundle validates)
  - traefik.io/v1alpha1/Middleware
  - traefik.io/v1alpha1/IngressRoute

additional_crds: []

substitution_vars:
  releaseNamespace: kommander
  workspaceNamespace: workspace
