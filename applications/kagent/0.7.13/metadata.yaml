overview: |
  **Overview**

  kagent is a Kubernetes-native AI agent framework that enables building, deploying, and managing AI agents directly on Kubernetes. Leverages the AutoGen framework and provides CRDs for declarative agent lifecycle management with built-in tool integrations. CRDs (Agent, Tool, ModelConfig, Team) define agents; a controller reconciles desired state. Deploy from this catalog and use the Launch button to open the web UI via Traefik with optional SSO.

  **Key capabilities**

  - **CRD-driven** — Declarative agent lifecycle via Agent, Tool, ModelConfig, and Team resources.
  - **AutoGen** — Built on Microsoft AutoGen for multi-agent orchestration.
  - **Tools** — Integrated ecosystem: Kubernetes operations, Grafana/Prometheus, kgateway, and more.
  - **MCP** — Model Context Protocol server support via kmcp sidecar.
  - **Web UI** — Interact with agents and monitor conversations; exposed via Traefik in this catalog.

  **Dependencies (this catalog)**

  This entry declares a soft dependency on **Ollama**. By default it is configured to use Ollama as the LLM provider (`providers.default=ollama`) at the in-cluster service. Install Ollama in the same workspace or override the provider in Helm values.

  **In-cluster usage**

  To connect kagent to Ollama: `http://ollama.ollama.svc.cluster.local:11434`. For vLLM: `http://vllm.vllm.svc.cluster.local:8000/v1`. Override in Helm values or ModelConfig if your LLM backend uses a different namespace.

  **Prerequisites**

  - **LLM provider** — Ensure an Ollama instance (or another provider) is reachable. For OpenAI, Anthropic, Gemini, or Azure OpenAI, create the API key secret and set `providers.default` in the app configuration.
  - **CRDs** — The kagent-crds chart is installed automatically with this catalog entry.

  **Resources**

  [Documentation](https://kagent.dev) · [Project](https://github.com/kagent-dev/kagent)
