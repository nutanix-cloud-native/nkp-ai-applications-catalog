  - ref: ${image_tag}
    url: https://github.com/jupyterhub/configurable-http-proxy.git
- container_image: quay.io/jupyterhub/k8s-hub:4.3.2
  sources:
  - ref: ${image_tag}
    url: https://github.com/jupyterhub/zero-to-jupyterhub-k8s.git
- container_image: quay.io/jupyterhub/k8s-image-awaiter:4.3.2
  sources:
  - ref: ${image_tag}
    url: https://github.com/jupyterhub/zero-to-jupyterhub-k8s.git
- container_image: quay.io/jupyterhub/k8s-singleuser-sample:4.3.2
  sources:
  - ref: ${image_tag}
    url: https://github.com/jupyterhub/zero-to-jupyterhub-k8s.git
- container_image: registry.k8s.io/kube-scheduler:v1.30.14
