apiVersion: v1
data:
  values.yaml: |
    ---
    fullnameOverride: jupyterhub
    hub:
      baseUrl: /jupyter
      config:
        Authenticator:
          admin_users:
            - admin
          allowed_users:
            - user
        JupyterHub:
          authenticator_class: dummy
      networkPolicy:
        egress:
          - ports:
              - port: 6443
    # The default block-cloud-metadata init container runs legacy iptables, which fails
    # on nftables-only nodes (e.g. Rocky 9): "can't initialize iptables table filter".
    # Disable it so single-user servers can spawn; metadata can be blocked via NetworkPolicy.
    singleuser:
      cloudMetadata:
        blockWithIptables: false
    # Use ClusterIP when Ingress is enabled so Helm does not wait for LoadBalancer IP
    # (LoadBalancer can stay Pending on bare-metal; Ingress provides external access)
    proxy:
      service:
        type: ClusterIP
    ingress:
      enabled: true
      annotations:
        # Do NOT use stripprefixes: JupyterHub expects full path (hub.baseUrl: /jupyter)
        traefik.ingress.kubernetes.io/router.tls: "true"
      ingressClassName: kommander-traefik
      pathType: ImplementationSpecific
kind: ConfigMap
metadata:
  name: ${releaseName}-${appVersion}-defaults
  namespace: ${releaseNamespace}
---
