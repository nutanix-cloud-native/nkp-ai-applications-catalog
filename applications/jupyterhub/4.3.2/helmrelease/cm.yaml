apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-${appVersion}-defaults
  namespace: ${releaseNamespace}
data:
  values.yaml: |
    ---
    fullnameOverride: jupyterhub
    hub:
      baseUrl: /nkp/jupyter
      config:
        JupyterHub:
          authenticator_class: generic-oauth
        Authenticator:
          auto_login: true
          # Intentionally empty by default. Set concrete users through Workspace Configuration.
          admin_users:
            []
        GenericOAuthenticator:
          # Register a dedicated Dex OIDC client and set these through Workspace Configuration.
          # Do not commit real credentials in this repository.
          client_id: ""
          client_secret: ""
          oauth_callback_url: ""
          authorize_url: ""
          token_url: ""
          userdata_url: ""
          login_service: "Dex"
          username_claim: preferred_username
          userdata_params:
            state: state
          # Allow any authenticated Dex user by default; tighten with allow_existing_users
          # or additional authenticator policy in Workspace Configuration if required.
          allow_all: true
      networkPolicy:
        egress:
          - ports:
              - port: 6443
    singleuser:
      # Block cloud-metadata egress via NetworkPolicy instead of the chart's default iptables
      # init container, which uses legacy iptables and crashes on nftables-only nodes
      # (e.g. Rocky 9: "can't initialize iptables table filter"), blocking user server spawn.
      # The NetworkPolicy denies egress to 169.254.169.254 at the CNI layer; set explicitly so
      # the security posture is reviewable and cannot regress if chart defaults change.
      cloudMetadata:
        blockWithIptables: false
      networkPolicy:
        enabled: true
        egressAllowRules:
          cloudMetadataServer: false
    # Use ClusterIP when Ingress is enabled so Helm does not wait for LoadBalancer IP
    # (LoadBalancer can stay Pending on bare-metal; Ingress provides external access)
    proxy:
      service:
        type: ClusterIP
    ingress:
      enabled: true
      annotations:
        # Do NOT use stripprefixes: JupyterHub expects full path (hub.baseUrl: /nkp/jupyter)
        traefik.ingress.kubernetes.io/router.tls: "true"
      ingressClassName: kommander-traefik
      pathType: ImplementationSpecific
---
