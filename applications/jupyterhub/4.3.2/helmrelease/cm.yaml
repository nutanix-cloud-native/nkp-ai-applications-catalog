apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-${appVersion}-defaults
  namespace: ${releaseNamespace}
data:
  values.yaml: |
    ---
    fullnameOverride: jupyterhub
    hub:
      baseUrl: /nkp/jupyter
      config:
        Authenticator:
          auto_login: true
      extraConfig:
        # Group-aware RemoteUserAuthenticator:
        # - reads identity from X-Forwarded-User (set by Traefik ForwardAuth)
        # - reads groups from Impersonate-Group headers
        # - marks Hub admins from oidc:nkp-admins
        # - exposes admin/dev profile choices by group
        remoteuser_groups_profiles.py: |
          from jupyterhub.handlers import BaseHandler
          from jupyterhub.auth import Authenticator
          from tornado import web
          from traitlets import Unicode

          ADMIN_GROUP = "oidc:nkp-admins"
          DEV_GROUP = "oidc:nkp-users"


          def parse_groups(values):
              groups = []
              for raw in values:
                  for token in raw.split(","):
                      group = token.strip()
                      if group:
                          groups.append(group)
              return sorted(set(groups))


          class RemoteUserLoginHandler(BaseHandler):
              async def get(self):
                  auth = self.authenticator
                  remote_user = self.request.headers.get(auth.header_name, "").strip()
                  if not remote_user:
                      raise web.HTTPError(401)

                  group_headers = self.request.headers.get_list(auth.groups_header_name)
                  groups = parse_groups(group_headers)

                  auth_model = {
                      "name": remote_user,
                      "groups": groups,
                      "auth_state": {"upstream_groups": groups},
                      "admin": auth.admin_group in groups,
                  }
                  user = await self.login_user(auth_model)
                  self.redirect(self.get_next_url(user))


          class RemoteUserAuthenticator(Authenticator):
              header_name = Unicode(
                  default_value='X-Forwarded-User',
                  config=True,
                  help="HTTP header to inspect for the authenticated username.")
              groups_header_name = Unicode(
                  default_value='Impersonate-Group',
                  config=True,
                  help="HTTP header containing authenticated group values.")
              admin_group = Unicode(
                  default_value=ADMIN_GROUP,
                  config=True,
                  help="Group that should be granted JupyterHub admin access.")

              def get_handlers(self, app):
                  return [(r'/login', RemoteUserLoginHandler)]

              async def authenticate(self, *args):
                  raise NotImplementedError()

          DEV_PROFILE = {
              "display_name": "Dev Environment",
              "description": "Standard notebook profile for development users.",
              "slug": "dev",
              "default": True,
              "kubespawner_override": {
                  "cpu_limit": 1,
                  "mem_limit": "2G",
                  "environment": {"JUPYTER_PROFILE": "dev"},
              },
          }

          ADMIN_PROFILE = {
              "display_name": "Admin Environment",
              "description": "Higher-resource profile for platform administrators.",
              "slug": "admin",
              "kubespawner_override": {
                  "cpu_limit": 4,
                  "mem_limit": "8G",
                  "environment": {"JUPYTER_PROFILE": "admin"},
              },
          }


          def profile_by_groups(spawner):
              group_names = {group.name for group in spawner.user.groups}
              if ADMIN_GROUP in group_names:
                  return [DEV_PROFILE, ADMIN_PROFILE]
              if DEV_GROUP in group_names:
                  return [DEV_PROFILE]
              return [DEV_PROFILE]

          c.Authenticator.manage_groups = True
          c.JupyterHub.authenticator_class = RemoteUserAuthenticator
          c.KubeSpawner.profile_list = profile_by_groups
      networkPolicy:
        egress:
          - ports:
              - port: 6443
    singleuser:
      # Block cloud-metadata egress via NetworkPolicy instead of the chart's default iptables
      # init container, which uses legacy iptables and crashes on nftables-only nodes
      # (e.g. Rocky 9: "can't initialize iptables table filter"), blocking user server spawn.
      # The NetworkPolicy denies egress to 169.254.169.254 at the CNI layer; set explicitly so
      # the security posture is reviewable and cannot regress if chart defaults change.
      cloudMetadata:
        blockWithIptables: false
      networkPolicy:
        enabled: true
        egressAllowRules:
          cloudMetadataServer: false
    # Use ClusterIP when Ingress is enabled so Helm does not wait for LoadBalancer IP
    # (LoadBalancer can stay Pending on bare-metal; Ingress provides external access)
    proxy:
      service:
        type: ClusterIP
    ingress:
      enabled: true
      annotations:
        # Do NOT use stripprefixes: JupyterHub expects full path (hub.baseUrl: /jupyter)
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.middlewares: "${releaseNamespace}-forwardauth@kubernetescrd"
      ingressClassName: kommander-traefik
      pathType: ImplementationSpecific
---
