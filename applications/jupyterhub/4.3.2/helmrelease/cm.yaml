apiVersion: v1
data:
  values.yaml: |
    ---
    fullnameOverride: jupyterhub
    hub:
      baseUrl: /jupyter
      config:
        Authenticator:
          admin_users:
            - admin
          allowed_users:
            - user
        DummyAuthenticator:
          password: nutanix/4u
        JupyterHub:
          authenticator_class: dummy
      networkPolicy:
        egress:
          - ports:
              - port: 6443
    ingress:
      enabled: true
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: kommander-stripprefixes@kubernetescrd
        traefik.ingress.kubernetes.io/router.tls: "true"
      ingressClassName: kommander-traefik
      pathType: ImplementationSpecific
kind: ConfigMap
metadata:
  name: ${releaseName}-config-defaults
  namespace: ${releaseNamespace}
---
