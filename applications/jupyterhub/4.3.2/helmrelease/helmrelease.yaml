apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${releaseName}-${appVersion}-chart
  namespace: ${releaseNamespace}
spec:
  interval: 24h
  ref:
    tag: 4.3.2
  url: oci://ghcr.io/nutanix-cloud-native/charts/jupyterhub
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jupyterhub
  namespace: ${releaseNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: ${releaseName}-${appVersion}-chart
    namespace: ${releaseNamespace}
  install:
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 30
    timeout: 10m
  interval: 15s
  targetNamespace: jupyterhub
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 30
    timeout: 10m
  valuesFrom:
    - kind: ConfigMap
      name: ${releaseName}-${appVersion}-defaults
---
