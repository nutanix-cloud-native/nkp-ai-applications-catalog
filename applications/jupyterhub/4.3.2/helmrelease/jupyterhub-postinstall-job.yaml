# Post-install Job: discovers jupyterhub Ingress or LoadBalancer in jupyterhub namespace
# and patches jupyterhub-ui ConfigMap with dashboardLink so the NKP Launch button opens JupyterHub UI.
# Prefers Ingress (Traefik) when LoadBalancer is pending (e.g. bare-metal clusters).
apiVersion: batch/v1
kind: Job
metadata:
  name: ${releaseName}-postinstall-${appVersion}
  namespace: ${workspaceNamespace}
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: ${releaseName}-postinstall
      restartPolicy: OnFailure
      containers:
        - name: patch-dashboard-link
          image: mesosphere/kubectl:v1.34.1-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: WORKSPACE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APP_NAMESPACE
              value: "jupyterhub"
            - name: APP_SERVICE
              value: "jupyterhub-proxy-public"
            - name: APP_PORT
              value: "80"
            - name: APP_PATH
              value: "/jupyter"
            - name: APP_INGRESS
              value: "jupyterhub"
            - name: CONFIGMAP_NAME
              value: "${releaseName}-ui"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Starting post-install (ns=$WORKSPACE_NAMESPACE, app=$APP_SERVICE in $APP_NAMESPACE)"
              sleep 15
              echo "Waiting for $CONFIGMAP_NAME ConfigMap..."
              for i in $(seq 1 60); do
                if kubectl get configmap "$CONFIGMAP_NAME" -n "$WORKSPACE_NAMESPACE" 2>/dev/null; then
                  echo "ConfigMap $CONFIGMAP_NAME found."
                  break
                fi
                echo "Waiting for ConfigMap... ($i/60)"; sleep 5
              done
              if ! kubectl get configmap "$CONFIGMAP_NAME" -n "$WORKSPACE_NAMESPACE" 2>/dev/null; then
                echo "ERROR: $CONFIGMAP_NAME ConfigMap not found after 5min"; exit 1
              fi

              echo "Trying Ingress $APP_INGRESS first (Traefik), then LoadBalancer $APP_SERVICE..."
              IP=""; HOSTNAME=""
              for i in $(seq 1 60); do
                IP=$(kubectl get ingress -n "$APP_NAMESPACE" "$APP_INGRESS" -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
                HOSTNAME=$(kubectl get ingress -n "$APP_NAMESPACE" "$APP_INGRESS" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
                if [ -n "$IP" ] || [ -n "$HOSTNAME" ]; then
                  echo "Found Ingress endpoint."
                  break
                fi
                IP=$(kubectl get svc -n "$APP_NAMESPACE" "$APP_SERVICE" -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
                HOSTNAME=$(kubectl get svc -n "$APP_NAMESPACE" "$APP_SERVICE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
                if [ -n "$IP" ] || [ -n "$HOSTNAME" ]; then
                  echo "Found LoadBalancer endpoint."
                  break
                fi
                echo "Waiting... ($i/60)"; sleep 5
              done

              if [ -z "$IP" ] && [ -z "$HOSTNAME" ]; then
                echo "ERROR: Neither Ingress nor LoadBalancer found"; kubectl get ingress,svc -n "$APP_NAMESPACE" 2>/dev/null || true; exit 1
              fi

              if [ -n "$IP" ]; then
                ENDPOINT="http://$IP:$APP_PORT$APP_PATH/"
              else
                ENDPOINT="http://$HOSTNAME:$APP_PORT$APP_PATH/"
              fi

              PAYLOAD=$(printf '{"data": {"dashboardLink": "%s"}}' "$ENDPOINT")
              kubectl patch configmap "$CONFIGMAP_NAME" -n "$WORKSPACE_NAMESPACE" --type=merge -p "$PAYLOAD"
              echo "Dashboard link updated: $ENDPOINT"
---
