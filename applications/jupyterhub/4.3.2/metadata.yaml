overview: |-
  ## Overview

  JupyterHub brings the power of notebooks to groups of users. It gives users access to computational environments and resources without burdening the users with installation and maintenance tasks.

  ## Access

  - You can access JupyterHub using the application dashboard available on the cluster **Application Dashboards** tab
  - Also accessible by using your NKP Dashboard URL with the path `/jupyter/`

  **In-cluster usage**

  JupyterHub exposes its web UI via the proxy-public service. From another app or notebook, connect via Kubernetes DNS:

  | Endpoint | In-cluster URL |
  |----------|----------------|
  | Web UI | `http://jupyterhub-proxy-public.jupyterhub.svc.cluster.local:80/jupyter` |

  Same namespace: `http://jupyterhub-proxy-public:80/jupyter`.

  ### Credentials

  Configure credentials when enabling the application via **Workspace Configuration**:

  ```yaml
  hub:
    config:
      Authenticator:
        admin_users:
          - admin
        allowed_users:
          - user
      DummyAuthenticator:
        password: <your-secure-password>
      JupyterHub:
        authenticator_class: dummy
  ```

  Replace `<your-secure-password>` with a secure password. The default uses DummyAuthenticator (shared password for all users); for production, consider OAuth2 (GitHub, Google, CILogon) per [JupyterHub authentication docs](https://z2jh.jupyter.org/en/stable/administrator/authentication.html).

  ## More Information

  - [jupyter.org](https://jupyter.org/hub)
  - [Jupyter Documentation](https://docs.jupyter.org/en/latest/)
  - [JupyterHub for Kubernetes](https://z2jh.jupyter.org/en/stable/)
  - [List of Helm values](https://github.com/jupyterhub/zero-to-jupyterhub-k8s/blob/main/jupyterhub/values.yaml)
