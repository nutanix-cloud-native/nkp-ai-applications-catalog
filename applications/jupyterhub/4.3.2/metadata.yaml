overview: |
  **Overview**

  JupyterHub brings the power of notebooks to groups of users. It gives users access to computational environments and resources without burdening them with installation and maintenance tasks — ideal for teams doing scientific computing and collaborative data analysis on a shared cluster.

  **Key capabilities**

  - **Multi-user notebooks** — a central hub spawns and manages a per-user Jupyter notebook server on demand.
  - **NKP SSO integration** — authenticates users via Traefik Forward Auth and the NKP identity provider (Dex). Users log in with their NKP credentials.
  - **Kubernetes-native spawning** — each user server runs as its own pod with its own resources and persistent storage.

  **Access**

  - Open JupyterHub from the cluster **Application Dashboards** tab, or via your NKP Dashboard URL at the path `/nkp/jupyter/`.
  - In-cluster: `http://jupyterhub-proxy-public.jupyterhub.svc.cluster.local:80/nkp/jupyter` (same namespace: `http://jupyterhub-proxy-public:80/nkp/jupyter`).

  **Authentication**

  JupyterHub uses NKP SSO by default. Users are authenticated via Traefik Forward Auth before reaching JupyterHub. The authenticated username is passed via the `X-Forwarded-User` header.

  To grant admin privileges, add usernames to the `admin_users` list via **Workspace Configuration**:

  ```yaml
  hub:
    config:
      Authenticator:
        admin_users:
          - admin@example.com
  ```

  **Resources**

  [Documentation](https://docs.jupyter.org/en/latest/) · [JupyterHub for Kubernetes](https://z2jh.jupyter.org/en/stable/) · [Project](https://jupyter.org/hub) · [Helm values](https://github.com/jupyterhub/zero-to-jupyterhub-k8s/blob/main/jupyterhub/values.yaml)
