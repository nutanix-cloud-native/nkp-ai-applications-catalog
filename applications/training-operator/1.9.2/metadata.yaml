overview: |
  **What it is** — The Kubeflow Training Operator provides Kubernetes CRDs and controllers for distributed training jobs (PyTorchJob, TFJob, XGBoostJob, etc.).

  **Highlights**
  - Native K8s APIs for training; works with Katib and Pipelines
  - Multi-framework support; GPU and multi-node training
  - Part of the Kubeflow ecosystem

