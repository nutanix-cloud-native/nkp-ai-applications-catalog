overview: |
  **What it is** — The Kubeflow Training Operator runs distributed ML training (PyTorch, TensorFlow, XGBoost, etc.) on Kubernetes via custom resources. Part of Kubeflow; deploys via Flux from kubeflow/manifests. Provides Kubernetes CRDs and controllers for distributed training jobs (PyTorchJob, TFJob, XGBoostJob, etc.).

  **Highlights**
  - Native K8s APIs for training; works with Katib and Pipelines
  - Multi-framework support; GPU and multi-node training
  - Part of the Kubeflow ecosystem

  **Prerequisites**
  - **Namespace** — Created automatically via `namespace.yaml`. This app deploys via Flux Kustomization (Kustomize from Git), not Helm.

  **Access** — No UI. Submit training jobs via `kubectl` using PyTorchJob, TFJob, XGBoostJob, or MPIJob CRDs. Integrates with Katib and Pipelines for orchestration.

  **Documentation:** [Kubeflow Training Operator](https://github.com/kubeflow/training-operator) | **Project:** [kubeflow/manifests](https://github.com/kubeflow/manifests)
