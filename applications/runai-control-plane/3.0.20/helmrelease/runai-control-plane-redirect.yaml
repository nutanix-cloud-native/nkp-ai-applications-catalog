# Run:ai must be served at the root of its own domain, so the NKP path only
# redirects to it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ${releaseName}-redirect
  namespace: ${releaseNamespace}
spec:
  redirectRegex:
    regex: ^.*$
    replacement: https://${runaiDomain:=localhost}/
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ${releaseName}-redirect
  namespace: ${releaseNamespace}
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Path(`/nkp/runai`) || PathPrefix(`/nkp/runai/`)
    middlewares:
    - name: ${releaseName}-redirect
    services:
    - kind: TraefikService
      name: noop@internal
  tls: {}
---
