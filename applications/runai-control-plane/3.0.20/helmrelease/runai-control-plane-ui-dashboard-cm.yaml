# ConfigMap for the NKP Launch button. Points at the Run:ai domain directly
# (Run:ai cannot be served under an NKP path).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-ui
  namespace: ${releaseNamespace}
  labels:
    kommander.d2iq.io/application: ${releaseName}
data:
  name: NVIDIA Run:ai
  dashboardLink: "https://${runaiDomain:=localhost}/"
  docsLink: "https://run-ai-docs.nvidia.com/self-hosted"
  version: "3.0.20"
---
