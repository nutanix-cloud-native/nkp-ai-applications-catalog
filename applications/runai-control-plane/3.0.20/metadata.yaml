overview: |
  **Overview**

  NVIDIA Run:ai is a GPU orchestration and workload management platform for AI.
  This application installs the self-hosted Run:ai **control plane** (UI, API,
  authentication, PostgreSQL, Keycloak, Thanos, and NATS) into the
  `runai-backend` namespace. Register one or more clusters with it by installing
  the **NVIDIA Run:ai Cluster** application on each GPU cluster.

  **Key capabilities**

  - Central UI and API for projects, departments, quotas, and access control
  - Multi-cluster management of training, inference, and workspace workloads
  - Fractional GPU, fair-share, and quota-based GPU allocation policies
  - Built-in identity provider with SSO (SAML / OIDC) support

  **Dependencies**

  Uses the NKP `traefik` platform app for ingress (`kommander-traefik` ingress
  class is set by default) and cert-manager (a platform component) to issue the
  TLS certificate.

  **Prerequisites**

  - A fully qualified domain name (for example `runai.mycorp.local`) that
    resolves to the `kommander-traefik` load balancer. For a name that is not
    in DNS, add it to CoreDNS on each cluster that talks to the control plane.
  - A default StorageClass for PostgreSQL and Thanos volumes.
  - If images are mirrored to a private registry, a `runai-reg-creds` pull
    secret in `runai-backend` and `global.image.registry` set to the mirror.

  **Configuration**

  Set the domain in the workspace namespace before deploying. It configures
  the control plane, the TLS certificate, and the **Application Dashboards**
  launch link (`https://<domain>/`; Run:ai cannot be served under a path):

  ```
  kubectl create configmap runai-control-plane-config -n <workspace-namespace> \
    --from-literal=runaiDomain=runai.mycorp.local
  ```

  No App Config Overrides are required. The `runai-backend` namespace, the
  `runai-backend-tls` certificate (issued by the `kommander-ca` ClusterIssuer;
  set `runaiTlsIssuerName` and `runaiTlsIssuerKind` in the same ConfigMap to
  use another issuer), trust of that CA, and resource sizing for small clusters
  are all defaults. Do not set `global.domain` in App Config Overrides, or the
  launch link will not match. Optionally set the admin user:

  ```yaml
  tenantsManager:
    config:
      adminUsername: admin@mycorp.local
  ```

  If no admin password is supplied, one is generated and stored in the
  `runai-backend-gen-tenants-manager` secret (key `ADMIN_PASSWORD`) in
  `runai-backend`. Run:ai clusters on other clusters need the CA that signed the
  certificate (`ca.crt` in the `runai-backend-tls` secret) unless a public CA
  is used.

  **Resources**

  [Documentation](https://run-ai-docs.nvidia.com/self-hosted/getting-started/installation/install-using-helm/install-control-plane) · [System requirements](https://run-ai-docs.nvidia.com/self-hosted/getting-started/installation/install-using-helm/system-requirements)
