overview: |
  **What it is** — Kubeflow Model Registry provides central model versioning and lineage. Ties into Pipelines and KServe; deploys via Flux from kubeflow/manifests. Stores and versions ML models with lineage, linking pipeline runs and serving.

  **Highlights**
  - Model versioning and metadata; integrates with Pipelines and KServe
  - Part of the Kubeflow ecosystem
  - GitOps deployment via Flux

