apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-${appVersion}-config-defaults
  namespace: ${releaseNamespace}
data:
  values.yaml: |
    # Default values for AMD GPU Operator (rocm/gpu-operator-charts).
    # See https://github.com/ROCm/gpu-operator for full options.
    # KMM is provided by the shared amd-kmm-operator component.
    kmm:
      enabled: false
      watch: true
    # NFD is provided by the Kommander platform layer.
    # IMPORTANT: Kommander's NFD worker must have the following toleration
    # to discover AMD GPUs on tainted nodes:
    #   - key: "amd-dcm"
    #     operator: "Equal"
    #     value: "up"
    #     effect: "NoExecute"
    # NFD is enabled via the NKP platform layer (Kommander).
    node-feature-discovery:
      enabled: false
    # Auto Node Remediation requires Argo Workflows; disabled by default.
    remediation:
      enabled: false
      installCRDs: false
    crds:
      defaultCR:
        install: true
        # Reconcile the default DeviceConfig during chart upgrades.
        upgrade: true
    # GPU operator controller manager
    controllerManager:
      manager:
        image:
          repository: docker.io/rocm/gpu-operator
          tag: v1.5.1-beta.0
        imagePullPolicy: IfNotPresent
        imagePullSecrets: ""
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
    # Override deviceConfig to point at the private registry.
    # Users must update spec.driver.image to their actual registry path.
    deviceConfig:
      spec:
        driver:
          enable: true
          blacklist: true
          version: "31.30"
          image: "registry.example.com:5000/drivers/amdgpu_kmod"
          # Keep the KMM module loader schedulable on AMD DCM-tainted nodes.
          tolerations:
            - key: "amd-dcm"
              operator: "Equal"
              value: "up"
              effect: "NoExecute"
          # Automatic driver upgrades are opt-in while NKP develops a safe
          # way to coordinate GPU services with required node reboots.
          upgradePolicy:
            enable: false
            maxParallelUpgrades: 1
            maxUnavailableNodes: 1
            rebootRequired: true
            nodeDrainPolicy:
              force: false
              timeoutSeconds: 600
              gracePeriodSeconds: -1
              ignoreDaemonSets: true
          imageBuild:
            baseImageRegistry: "docker.io"
            baseImageRegistryTLS:
              insecure: false
              insecureSkipTLSVerify: false
          imageRegistrySecret:
            name: "kmm-registry-dockerconfig"
          imageRegistryTLS:
            insecure: false
            insecureSkipTLSVerify: false
        commonConfig:
          initContainerImage: busybox:1.36
          utilsContainer:
            image: docker.io/rocm/gpu-operator-utils:v1.5.1-beta.0
            imagePullPolicy: IfNotPresent
        # Keep GPU resource-allocation agents disabled during initial driver
        # installation. Enable either the Device Plugin or DRA after the
        # required reboot and driver-provenance verification.
        devicePlugin:
          enableDevicePlugin: false
          devicePluginImage: rocm/k8s-device-plugin:1.31.0.10
          devicePluginImagePullPolicy: IfNotPresent
          enableNodeLabeller: true
          nodeLabellerImage: rocm/k8s-device-plugin:labeller-1.31.0.10
          nodeLabellerImagePullPolicy: IfNotPresent
          nodeLabellerTolerations:
            - key: "amd-dcm"
              operator: "Equal"
              value: "up"
              effect: "NoExecute"
        metricsExporter:
          enable: true
          image: rocm/device-metrics-exporter:v1.5.1-beta.0
          imagePullPolicy: IfNotPresent
          tolerations:
            - key: "amd-dcm"
              operator: "Equal"
              value: "up"
              effect: "NoExecute"
        # DRA is disabled out of the box. To opt in, set draDriver.enable=true
        # and devicePlugin.enableDevicePlugin=false in the same ConfigOverride.
        draDriver:
          enable: false
          image: "docker.io/rocm/k8s-gpu-dra-driver:v1.0.0"
          imagePullPolicy: IfNotPresent
          tolerations:
            - key: "amd-dcm"
              operator: "Equal"
              value: "up"
              effect: "NoExecute"
