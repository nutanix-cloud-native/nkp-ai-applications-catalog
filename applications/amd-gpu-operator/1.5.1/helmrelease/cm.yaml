apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-${appVersion}-config-defaults
  namespace: ${releaseNamespace}
data:
  values.yaml: |
    # Default values for AMD GPU Operator (rocm/gpu-operator-charts).
    # See https://github.com/ROCm/gpu-operator for full options.
    # KMM is provided by the shared amd-kmm-operator component.
    kmm:
      enabled: false
      watch: true
    # Node Feature Discoery is enabled via NKP and doesn't need to be enabled here.
    node-feature-discovery:
      enabled: false
    # Auto Node Remediation requires Argo Workflows; disabled by default.
    remediation:
      enabled: false
      installCRDs: false
    crds:
      defaultCR:
        install: true
        upgrade: true
    # GPU operator controller manager
    controllerManager:
      manager:
        image:
          repository: docker.io/rocm/gpu-operator
          tag: v1.5.1
        imagePullPolicy: IfNotPresent
        imagePullSecrets: ""
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
    # Override deviceConfig to point at the private registry.
    # Users must update spec.driver.image to their actual registry path.
    deviceConfig:
      spec:
        driver:
          enable: true
          blacklist: true
          # For driver versions consult the AMD ROCm compatibility matrix: https://rocm.docs.amd.com/en/latest/compatibility/compatibility-matrix.html
          # See documentation around staged upgrades of gpu-operator and driver
          # upgrade gpu-operator first while maintaining the driver version and then update the driver below.
          version: "31.40"
          image: "registry.example.com:5000/drivers/amdgpu_kmod"
          upgradePolicy:
            # NOTE: Setting `upgradePolicy.enable: false` removes the managed upgrade safeguards
            # without removing the requested driver change: KMM can still reconcile the
            # desired module/image, but without the normal node taint, drain, serial execution,
            # reboot, and completion checks. This can leave GPU workloads running during a driver
            # change or leave the requested and loaded driver versions out of sync.
            enable: true
            maxParallelUpgrades: 1
            maxUnavailableNodes: 1
            # Driver upgrades deliberately reboot one node at a time. The operator drains
            # the node and its workloads return after the upgraded kernel module loads.
            rebootRequired: true
            nodeDrainPolicy:
              force: true
              timeoutSeconds: 600
              gracePeriodSeconds: -1
              # NOTE: This value is hardcoded to `true` in this version of the Operator, changing this here
              # doesn't alter the Operator's behavior.
              ignoreDaemonSets: true
          imageBuild:
            baseImageRegistry: "docker.io"
            baseImageRegistryTLS:
              insecure: false
              insecureSkipTLSVerify: false
          imageRegistrySecret:
            name: "kmm-registry-dockerconfig"
          imageRegistryTLS:
            insecure: false
            insecureSkipTLSVerify: false
        commonConfig:
          initContainerImage: busybox:1.36
          utilsContainer:
            image: docker.io/rocm/gpu-operator-utils:v1.5.1
            imagePullPolicy: IfNotPresent
        # Device Plugin is disabled in favor of DRA (see draDriver below).
        # To revert to the traditional Device Plugin, set enableDevicePlugin: true
        # and draDriver.enable: false (they are mutually exclusive).
        devicePlugin:
          enableDevicePlugin: false
          devicePluginImage: rocm/k8s-device-plugin:1.31.0.10
          devicePluginImagePullPolicy: IfNotPresent
          enableNodeLabeller: false
          nodeLabellerImage: rocm/k8s-device-plugin:labeller-1.31.0.10
          nodeLabellerImagePullPolicy: IfNotPresent
        metricsExporter:
          enable: true
          image: rocm/device-metrics-exporter:v1.5.1
          imagePullPolicy: IfNotPresent
          config:
            name: ${releaseName}-${appVersion}-metrics-exporter-config
          prometheus:
            serviceMonitor:
              enable: true
              labels:
                prometheus.kommander.d2iq.io/select: "true"
        # DRA replaces Device Plugin for GPU resource allocation.
        # Mutually exclusive with devicePlugin — only one can be enabled per DeviceConfig.
        # Supported on NKP v2.18.0+ (K8s 1.35+, containerd 2.1+, DRA GA).
        draDriver:
          enable: true
          image: "docker.io/rocm/k8s-gpu-dra-driver:v1.0.1"
          imagePullPolicy: IfNotPresent
