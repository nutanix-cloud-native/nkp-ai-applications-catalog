---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: amd-gpu-operator-sa-reconciler
  namespace: ${releaseNamespace}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: amd-gpu-operator-sa-reconciler
  namespace: ${releaseNamespace}
rules:
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: amd-gpu-operator-sa-reconciler
  namespace: ${releaseNamespace}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: amd-gpu-operator-sa-reconciler
subjects:
- kind: ServiceAccount
  name: amd-gpu-operator-sa-reconciler
  namespace: ${releaseNamespace}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: amd-gpu-operator-sa-reconciler
  namespace: ${releaseNamespace}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: amd-gpu-operator-sa-reconciler
          restartPolicy: Never
          containers:
          - name: reconciler
            image: bitnami/kubectl:latest
            command: ["/bin/sh", "-e", "-c"]
            args:
            - |
              TARGET_SA="amd-gpu-operator-kmm-module-loader"
              PULL_SECRET="kmm-registry-dockerconfig"
              NAMESPACE="${releaseNamespace}"

              # Wait for SA to exist; exit gracefully if not yet created
              if ! kubectl get sa "$TARGET_SA" -n "$NAMESPACE" > /dev/null 2>&1; then
                echo "INFO: ServiceAccount $TARGET_SA not found yet. Will retry next cycle."
                exit 0
              fi

              # Check if imagePullSecrets already contains our secret
              EXISTING=$(kubectl get sa "$TARGET_SA" -n "$NAMESPACE" -o jsonpath='{.imagePullSecrets[*].name}')
              for s in $EXISTING; do
                if [ "$s" = "$PULL_SECRET" ]; then
                  echo "INFO: $PULL_SECRET already present on $TARGET_SA"
                  exit 0
                fi
              done

              # Additively patch imagePullSecrets (merge patch preserves existing entries)
              kubectl patch sa "$TARGET_SA" -n "$NAMESPACE" --type=merge -p \
                "{\"imagePullSecrets\": [$(echo "$EXISTING" | tr ' ' '\n' | awk '{printf "{\"name\":\"%s\"},", $0}'){\"name\":\"$PULL_SECRET\"}]}"
              echo "INFO: Added $PULL_SECRET to $TARGET_SA imagePullSecrets."
