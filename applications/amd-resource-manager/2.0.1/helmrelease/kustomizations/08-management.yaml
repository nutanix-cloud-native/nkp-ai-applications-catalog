# Stage 08-management. Static equivalent of the Kustomization the orchestration
# chart rendered for this stage in 2.0.0.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${releaseName}-08-management
  namespace: ${releaseNamespace}
  labels:
    app.kubernetes.io/name: amd-resource-manager
    airm.nutanix.com/stage: "08-management"
spec:
  interval: ${stagesInterval:=1m}
  retryInterval: ${stagesRetryInterval:=1m}
  timeout: ${stageManagementTimeout:=12m}
  prune: ${stagesPrune:=true}
  wait: ${stagesWait:=true}
  force: true
  path: ./helmrelease/stages/08-management
  sourceRef:
    kind: OCIRepository
    name: ${releaseName}-source
    namespace: ${releaseNamespace}
  postBuild:
    substitute:
      releaseName: ${releaseName}
      releaseNamespace: ${releaseNamespace}
    substituteFrom:
    - kind: ConfigMap
      name: ${releaseName}-${appVersion}-config-defaults
    - kind: ConfigMap
      name: airm-config-overrides
      optional: true
    - kind: ConfigMap
      name: airm-discovered
      optional: true
  dependsOn:
  - name: ${releaseName}-07-agent-crds
    namespace: ${releaseNamespace}
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: airm-management
    namespace: ${releaseNamespace}
  - apiVersion: apps/v1
    kind: Deployment
    name: airm-api
    namespace: airm
  - apiVersion: apps/v1
    kind: Deployment
    name: airm-ui
    namespace: airm
---
