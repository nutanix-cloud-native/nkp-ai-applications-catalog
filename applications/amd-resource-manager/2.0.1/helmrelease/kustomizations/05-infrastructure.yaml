# Stage 05-infrastructure. Static equivalent of the Kustomization the orchestration
# chart rendered for this stage in 2.0.0.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${releaseName}-05-infrastructure
  namespace: ${releaseNamespace}
  labels:
    app.kubernetes.io/name: amd-resource-manager
    airm.nutanix.com/stage: "05-infrastructure"
spec:
  interval: ${stagesInterval:=1m}
  retryInterval: ${stagesRetryInterval:=1m}
  timeout: ${stageInfrastructureTimeout:=12m}
  prune: ${stagesPrune:=true}
  wait: ${stagesWait:=true}
  force: true
  path: ./helmrelease/stages/05-infrastructure
  sourceRef:
    kind: OCIRepository
    name: ${releaseName}-source
    namespace: ${releaseNamespace}
  postBuild:
    substitute:
      releaseName: ${releaseName}
      releaseNamespace: ${releaseNamespace}
    substituteFrom:
    - kind: ConfigMap
      name: ${releaseName}-${appVersion}-config-defaults
    - kind: ConfigMap
      name: airm-config-overrides
      optional: true
    - kind: ConfigMap
      name: airm-discovered
      optional: true
  dependsOn:
  - name: ${releaseName}-05-operators
    namespace: ${releaseNamespace}
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: airm-infra-cnpg
    namespace: ${releaseNamespace}
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: airm-infra-rabbitmq
    namespace: ${releaseNamespace}
  - apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
    name: airm-infra-cnpg-cnpg
    namespace: airm
  - apiVersion: rabbitmq.com/v1beta1
    kind: RabbitmqCluster
    name: airm-infra-rabbitmq-rabbitmq
    namespace: airm
---
