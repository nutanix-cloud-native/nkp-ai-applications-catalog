# Stage 11-gateway-tls. Static equivalent of the Kustomization the orchestration
# chart rendered for this stage in 2.0.0.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${releaseName}-11-gateway-tls
  namespace: ${releaseNamespace}
  labels:
    app.kubernetes.io/name: amd-resource-manager
    airm.nutanix.com/stage: "11-gateway-tls"
spec:
  interval: ${stagesInterval:=1m}
  retryInterval: ${stagesRetryInterval:=1m}
  timeout: ${stageGatewayTlsTimeout:=20m}
  prune: ${stagesPrune:=true}
  wait: ${stagesWait:=true}
  force: true
  path: ./helmrelease/stages/11-gateway-tls
  sourceRef:
    kind: OCIRepository
    name: ${releaseName}-source
    namespace: ${releaseNamespace}
  postBuild:
    substitute:
      releaseName: ${releaseName}
      releaseNamespace: ${releaseNamespace}
    substituteFrom:
    - kind: ConfigMap
      name: ${releaseName}-${appVersion}-config-defaults
    - kind: ConfigMap
      name: airm-config-overrides
      optional: true
    - kind: ConfigMap
      name: airm-discovered
      optional: true
  dependsOn:
  - name: ${releaseName}-10-identity-sync
    namespace: ${releaseNamespace}
  healthChecks:
  - apiVersion: batch/v1
    kind: Job
    name: airm-gateway-tls
    namespace: ${releaseNamespace}
---
