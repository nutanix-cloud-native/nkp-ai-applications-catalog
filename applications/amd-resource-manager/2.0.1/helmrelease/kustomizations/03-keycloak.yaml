# Stage 03-keycloak. Static equivalent of the Kustomization the orchestration
# chart rendered for this stage in 2.0.0.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${releaseName}-03-keycloak
  namespace: ${releaseNamespace}
  labels:
    app.kubernetes.io/name: amd-resource-manager
    airm.nutanix.com/stage: "03-keycloak"
spec:
  interval: ${stagesInterval:=1m}
  retryInterval: ${stagesRetryInterval:=1m}
  timeout: ${stagesTimeout:=5m}
  prune: ${stagesPrune:=true}
  wait: ${stagesWait:=true}
  force: true
  path: ./helmrelease/stages/03-keycloak
  sourceRef:
    kind: OCIRepository
    name: ${releaseName}-source
    namespace: ${releaseNamespace}
  postBuild:
    substitute:
      releaseName: ${releaseName}
      releaseNamespace: ${releaseNamespace}
    substituteFrom:
    - kind: ConfigMap
      name: ${releaseName}-${appVersion}-config-defaults
    - kind: ConfigMap
      name: airm-config-overrides
      optional: true
    - kind: ConfigMap
      name: airm-discovered
      optional: true
  dependsOn:
  - name: ${releaseName}-01-secrets
    namespace: ${releaseNamespace}
  - name: ${releaseName}-02-gateway
    namespace: ${releaseNamespace}
  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: airm-keycloak
    namespace: ${releaseNamespace}
  - apiVersion: batch/v1
    kind: Job
    name: airm-keycloak-config
    namespace: ${releaseNamespace}
---
