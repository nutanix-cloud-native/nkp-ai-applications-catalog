apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ${releaseName}-helmrelease
  namespace: ${releaseNamespace}
spec:
  interval: 6h0m0s
  path: ./helmrelease
  postBuild:
    substitute:
      clusterName: ${clusterName}
      clusterUUID: ${clusterUUID}
      releaseName: ${releaseName}
      releaseNamespace: ${releaseNamespace}
      workspaceNamespace: ${workspaceNamespace}
  # prune true: if an object leaves this Kustomization, or the Kustomization is deleted,
  # Flux deletes it. Stateful objects are protected by the stages' own prune: false.
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: OCIRepository
    name: ${releaseName}-source
    namespace: ${releaseNamespace}
  timeout: 1m0s
  # wait true: this Kustomization reports Ready only after its applied objects are Ready.
  wait: true
---
