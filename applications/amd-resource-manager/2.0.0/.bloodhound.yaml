k8s_versions:
  - 1.36.0

# Orchestration chart emits resources owned by platform dependencies and
# operators installed by its staged deployment. Load their pinned CRD schemas
# so those resources are validated rather than skipped.
strict: false

skip_types: []

additional_crds:
  - https://raw.githubusercontent.com/kubernetes-sigs/gateway-api/v1.4.0/config/crd/standard/gateway.networking.k8s.io_httproutes.yaml
  # NKP 2.19 currently provides cert-manager v1.20.3. Because the bundled
  # cert-manager version can change between NKP releases, update these schema
  # URLs when needed; if cross-version validation becomes unreliable, add
  # cert-manager.io/v1/Certificate and cert-manager.io/v1/Issuer to skip_types.
  - https://raw.githubusercontent.com/cert-manager/cert-manager/v1.20.3/deploy/crds/cert-manager.io_certificates.yaml
  - https://raw.githubusercontent.com/cert-manager/cert-manager/v1.20.3/deploy/crds/cert-manager.io_issuers.yaml
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/v1.27.0/config/crd/bases/postgresql.cnpg.io_clusters.yaml
  - https://raw.githubusercontent.com/rabbitmq/cluster-operator/v2.22.5/config/crd/bases/rabbitmq.com_rabbitmqclusters.yaml
---
