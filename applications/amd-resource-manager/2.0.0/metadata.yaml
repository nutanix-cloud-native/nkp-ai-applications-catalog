  - artificial-intelligence
description: |
  AMD Resource Manager (AIRM) deploys the management plane and local agent in all mode
  for cluster registration, quotas, identity, and AI resource management on NKP.
icon: ""
licensing:
  - Pro
  - Ultimate
overview: |
  **Overview**

  AMD Resource Manager provides administrators with tools to oversee computational
  resources and user access across AI clusters. This catalog application packages
  AIRM `2.0.0` for NKP using Flux-managed stages.

  This release installs **all mode** only: management plane (API, UI, Keycloak,
  PostgreSQL, RabbitMQ) and the local agent on the same cluster. Management-only
  and remote agent modes are out of scope for this version.

  **Key capabilities**

  - Cluster registration and identity management
  - Quotas and team access control for AI compute
  - Local agent with Kaiwo and AIM Engine CRDs
  - Automatic discovery of domain, StorageClass, and Prometheus endpoints
  - Optional project External Secrets when External Secrets Operator and a
    ClusterSecretStore are available

  **Dependencies**

  Uses NKP's built-in cert-manager and requires the cloudnative-pg,
  kube-prometheus-stack, and traefik platform apps. Gateway API CRDs must also be
  installed; see Prerequisites. RabbitMQ
  Cluster Operator and Keycloak are installed by this application. Soft
  dependencies include amd-gpu-operator and external-secrets for optional
  GPU and project-secret workflows.

  **Prerequisites**

  - NKP workspace with the requiredDependencies enabled
  - Gateway API CRDs (`gateway.networking.k8s.io`) installed before this
    application. This application does not install or manage them. AIRM requires
    `BackendTLSPolicy/v1` served as storage. Install from exactly one source:
    - NKP `gateway-api-crds` platform app: standard channel, v1.4.0. NKP 2.20.0
      includes it, and it is sufficient for AIRM and Traefik.
    - Envoy Gateway NAI: experimental channel, v1.5.1. The `safe-upgrades` policy
      it ships prevents it from coexisting with the platform app.
  - Default StorageClass (or a discoverable StorageClass)
  - LoadBalancer VIP availability for Gateway HTTPS (for example MetalLB)
  - For project External Secrets: External Secrets Operator and a Ready
    ClusterSecretStore

  **Resources**

  [AMD Resource Manager docs](https://enterprise-ai.docs.amd.com/en/v2.2.2/resource-manager/overview.html) ·
  [Suite 2.2.2 release notes](https://enterprise-ai.docs.amd.com/en/v2.2.2/release-notes.html)
scope:
  - workspace
dependencies:
  - amd-gpu-operator
  - external-secrets
requiredDependencies:
  - cloudnative-pg
  - kube-prometheus-stack
  - traefik
