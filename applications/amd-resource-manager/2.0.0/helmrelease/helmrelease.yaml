apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${releaseName}-chart
  namespace: ${releaseNamespace}
spec:
  interval: 24h
  ref:
    tag: 2.0.0
  url: oci://ghcr.io/nutanix-cloud-native/charts/amd-resource-manager
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amd-resource-manager
  namespace: ${releaseNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: ${releaseName}-chart
    namespace: ${releaseNamespace}
  # The chart renders the stage Kustomizations. Restore any stage that is
  # manually deleted or modified instead of waiting for a chart/value change.
  driftDetection:
    mode: enabled
  install:
    createNamespace: true
    # The chart creates Flux Kustomizations whose readiness is managed by
    # dependsOn/healthChecks. Do not make Helm wait for those inner stages.
    # disableWait true: Helm does not wait for the rendered stage Kustomizations.
    # Readiness is checked through each stage's dependsOn and healthChecks.
    disableWait: true
    # install retries 30: after a failed install, Flux uninstalls the release and retries.
    # Uninstall deletes the stage Kustomizations. Stages with prune: true then delete the
    # objects they applied. Secrets that stage 01's Job creates at runtime are not applied
    # objects, so pruning does not delete them.
    remediation:
      retries: 30
  interval: 15s
  # Dedicated AIRM namespace. Downstream stages
  # create additional namespaces (for example keycloak) as needed.
  targetNamespace: airm
  upgrade:
    # disableWait true: same as install. Helm does not wait for the stage Kustomizations.
    disableWait: true
    # upgrade retries 30: after a failed upgrade, Flux rolls the release back to the
    # previous revision and retries.
    remediation:
      retries: 30
  valuesFrom:
  - kind: ConfigMap
    name: ${releaseName}-${appVersion}-config-defaults
---
