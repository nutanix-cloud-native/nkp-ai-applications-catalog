apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${releaseName}-chart
  namespace: ${releaseNamespace}
spec:
  interval: 24h
  ref:
    tag: 2.0.0
  url: oci://ghcr.io/nutanix-cloud-native/charts/amd-resource-manager
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amd-resource-manager
  namespace: ${releaseNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: ${releaseName}-chart
    namespace: ${releaseNamespace}
  install:
    createNamespace: true
    # The chart creates Flux Kustomizations whose readiness is managed by
    # dependsOn/healthChecks. Do not make Helm wait for those inner stages.
    disableWait: true
    remediation:
      retries: 30
  interval: 15s
  # Dedicated AIRM namespace (matches the shell installer). Downstream stages
  # create additional namespaces (for example keycloak) as needed.
  targetNamespace: airm
  upgrade:
    disableWait: true
    remediation:
      retries: 30
  valuesFrom:
  - kind: ConfigMap
    name: ${releaseName}-${appVersion}-config-defaults
---
