# Stage 08 — AIRM management plane (API and UI)
#
# These Flux resources install the AIRM API/UI management plane and adapt its
# HTTPRoutes for NKP's Traefik Gateway.
#
# The API chart is fetched from OCI by explicit version tag. Its runtime values wire
# AIRM to the domain discovered in stage 00, the Gateway from stage 02, Keycloak
# from stage 03, PostgreSQL/RabbitMQ from stage 05, and the discovered
# Prometheus endpoint. API and frontend image tags remain catalog-configurable.
#
# Notes:
# - This stage deploys only the version-pinned `airm-api-chart`. The agent is
#   deployed later, after registration and RabbitMQ identity synchronization.
# - `airm.includeDemoSetup` is false. The chart's configure Job is not run in
#   all mode. Stages 09-bootstrap and 10-identity-sync replace it, so the agent
#   never starts with the temporary `airm-user` credentials.
# - Flux continuously installs, upgrades, and remediates the release.
# - Route post-renderer patches remove the Host-header matches that Traefik does
#   not support and set explicit hostnames and the `websecure` listener binding.
#   The upstream chart artifact is not modified.
# - Readiness is enforced by parent Flux health checks for this HelmRelease and
#   the API/UI Deployments rather than solely by `helm --wait`.
#
# This stage contains no custom shell script or stage-specific RBAC. Flux
# source-controller and helm-controller own retrieval and reconciliation.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: airm-management-chart
  namespace: ${releaseNamespace}
  annotations:
    airm.nutanix.com/chart-version: ${airmApiChartVersion}
spec:
  interval: 24h
  ref:
    tag: ${airmApiChartVersion}
  url: ${airmApiChartUrl:=oci://registry-1.docker.io/amdenterpriseai/airm-api-chart}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airm-management
  namespace: ${releaseNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: airm-management-chart
    namespace: ${releaseNamespace}
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 15m
  releaseName: airm
  targetNamespace: ${airmNamespace:=airm}
  timeout: 10m
  upgrade:
    remediation:
      retries: 3
  values:
    gateway:
      namespace: ${releaseNamespace}
      gatewayName: ${gatewayName:=airm-https}
    airm:
      appDomain: ${airmDomain}
      # Stages 09 and 10 replace the chart's configure Job so the agent starts
      # only after bootstrap and RabbitMQ identity synchronization complete.
      # Not used as of now; kept in case demo setup is included later.
      # The chart's configure Job is not run in all mode; stages 09 and 10 replace it.
      includeDemoSetup: false
      keycloak:
        internalUrl: http://keycloak.${keycloakNamespace:=keycloak}.svc.cluster.local:80
        clientId: ${keycloakAdminClientId}
      postgresql:
        host: airm-infra-cnpg-cnpg-rw.${airmNamespace:=airm}.svc.cluster.local
      rabbitmq:
        host: airm-infra-rabbitmq-rabbitmq.${airmNamespace:=airm}.svc.cluster.local
      prometheus:
        url: ${airmPrometheusUrl}
      frontend:
        image:
          tag: ${airmImageTag}
      backend:
        image:
          tag: ${airmImageTag}
  postRenderers:
  - kustomize:
      # Removes unsupported Host-header regex matches. Explicit hostnames and
      # listener binding are set on the routes.
      patches:
      - target:
          group: gateway.networking.k8s.io
          version: v1
          kind: HTTPRoute
          name: airmapi-route
        patch: |
          - op: add
            path: /spec/hostnames
            value:
            - airmapi.${airmDomain:=airm.example.com}
          - op: add
            path: /spec/parentRefs/0/sectionName
            value: ${gatewayListenerName:=websecure}
          - op: remove
            path: /spec/rules/0/matches/0/headers
          - op: remove
            path: /spec/rules/1/matches/0/headers
      - target:
          group: gateway.networking.k8s.io
          version: v1
          kind: HTTPRoute
          name: airmui-route
        patch: |
          - op: add
            path: /spec/hostnames
            value:
            - airmui.${airmDomain:=airm.example.com}
          - op: add
            path: /spec/parentRefs/0/sectionName
            value: ${gatewayListenerName:=websecure}
          - op: remove
            path: /spec/rules/0/matches/0/headers
---
