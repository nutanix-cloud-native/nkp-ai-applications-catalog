# Stage 04 — StorageClass compatibility Job
#
# This Job runs storage.sh to ensure a StorageClass named `default` exists
# before AIRM's CNPG and RabbitMQ charts request persistent volumes. The source
# StorageClass was selected by stage 00 and is injected by Flux as
# `${airmStorageClass}`.
#
# The script is generated into `airm-storage-script` by kustomization.yaml and
# mounted read-only. Its dedicated ServiceAccount can only inspect and apply
# StorageClass resources. The five-minute deadline is sufficient for this
# API-only operation, and retries are safe because an existing `default` class
# is never changed.
#
# Flux health-checks this Job. Failure stops the infrastructure stages early
# instead of allowing unresolved PVCs to surface as a later Helm timeout.
apiVersion: batch/v1
kind: Job
metadata:
  name: airm-storage
  namespace: ${releaseNamespace}
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/component: storage
        airm.nutanix.com/stage: 04-storage
    spec:
      restartPolicy: Never
      serviceAccountName: airm-storage
      containers:
      - name: storage
        image: ${clusterToolImage:=docker.io/alpine/k8s@sha256:18bc02c1e0df04451f4f9194eb7b7341c1165da5495459b52f85f72fb9545032}
        imagePullPolicy: IfNotPresent
        env:
        - name: STORAGE_CLASS
          value: ${airmStorageClass}
        command:
        - /bin/sh
        - /scripts/storage.sh
        volumeMounts:
        - mountPath: /scripts
          name: storage-script
          readOnly: true
      volumes:
      - configMap:
          defaultMode: 0555
          name: airm-storage-script
        name: storage-script
---
