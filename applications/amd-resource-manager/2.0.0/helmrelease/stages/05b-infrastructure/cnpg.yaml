# Stage 05b — AIRM PostgreSQL infrastructure
#
# Installs AIRM's PostgreSQL cluster with the CloudNativePG operator.
#
# The OCIRepository retrieves AMD's AIRM CNPG chart using an explicit version
# tag. The HelmRelease deploys into the dedicated AIRM namespace
# and creates the CloudNativePG Cluster used by the AIRM management API.
#
# Notes:
# - The chart comes from a version-pinned OCI artifact.
# - Flux performs install, upgrade, and remediation, and reconciles drift
#   continuously.
# - Namespace creation and retry policy are expressed in the HelmRelease.
# - Both data and WAL storage use the `default` StorageClass, which stage 04
#   provides before this stage runs.
# - Readiness is enforced by the parent orchestration health checks for this
#   HelmRelease and its generated CNPG Cluster.
#
# No shell script or Kubernetes RBAC is required in this stage: Flux source and
# Helm controllers perform all chart retrieval and installation operations.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: airm-infra-cnpg
  namespace: ${releaseNamespace}
  annotations:
    airm.nutanix.com/chart-version: ${airmCnpgChartVersion}
spec:
  interval: 24h
  ref:
    tag: ${airmCnpgChartVersion}
  url: ${airmCnpgChartUrl:=oci://registry-1.docker.io/amdenterpriseai/airm-cnpg-chart}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airm-infra-cnpg
  namespace: ${releaseNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: airm-infra-cnpg
    namespace: ${releaseNamespace}
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 15m
  releaseName: airm-infra-cnpg
  targetNamespace: ${airmNamespace:=airm}
  timeout: 5m
  upgrade:
    remediation:
      retries: 3
  values:
    storage:
      storageClass: default
    walStorage:
      storageClass: default
---
