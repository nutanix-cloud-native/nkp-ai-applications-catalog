# Stage 05b — AIRM RabbitMQ infrastructure
#
# Installs AIRM's RabbitMQ cluster with the RabbitMQ Cluster Operator.
#
# The OCIRepository retrieves AMD's AIRM RabbitMQ chart by explicit version tag.
# The HelmRelease deploys the RabbitmqCluster into the dedicated AIRM namespace;
# stage 06 subsequently creates the application user, vhosts, permissions, and
# temporary consumer queue that the operator does not provision.
#
# Notes:
# - The chart comes from a version-pinned OCI artifact.
# - Flux owns install, upgrade, retry, and drift reconciliation.
# - Persistence uses the `default` StorageClass override, backed by the
#   compatibility class that stage 04 provides.
# - Readiness is checked by the parent orchestration against both this
#   HelmRelease and its RabbitmqCluster.
# - RabbitMQ application configuration is in stage 06. The external LoadBalancer
#   for remote agents is management-mode behavior and is outside this catalog
#   release's all-mode scope.
#
# No shell script or stage-specific RBAC is needed here because Flux controllers
# retrieve and install the chart.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: airm-infra-rabbitmq
  namespace: ${releaseNamespace}
  annotations:
    airm.nutanix.com/chart-version: ${airmRabbitmqChartVersion}
spec:
  interval: 24h
  ref:
    tag: ${airmRabbitmqChartVersion}
  url: ${airmRabbitmqChartUrl:=oci://registry-1.docker.io/amdenterpriseai/airm-rabbitmq-chart}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airm-infra-rabbitmq
  namespace: ${releaseNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: airm-infra-rabbitmq
    namespace: ${releaseNamespace}
  install:
    createNamespace: true
    remediation:
      retries: 3
  interval: 15m
  releaseName: airm-infra-rabbitmq
  targetNamespace: ${airmNamespace:=airm}
  timeout: 5m
  upgrade:
    remediation:
      retries: 3
  values:
    persistence:
      storageClassName: default
---
