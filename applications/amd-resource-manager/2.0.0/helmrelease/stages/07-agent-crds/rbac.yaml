# Stage 07 — Agent CRD installation permissions
#
# Both managed resource types are cluster-scoped, so the Job requires a
# ClusterRole:
#
# CustomResourceDefinitions:
# - `get` supports apply-state lookup and explicit verification.
# - `create`, `patch`, and `update` support server-side application of missing
#   or changed Kaiwo/AIM Engine definitions.
# - `watch` is required by `kubectl wait` while the CRDs become Established.
#
# KaiwoQueueConfigs:
# - `get` verifies the `kaiwo` seed object.
# - `create`, `patch`, and `update` support idempotent `kubectl apply`.
#
# Delete permission and access to Kaiwo/AIM workload custom resources are not
# granted. The ClusterRoleBinding targets only the short-lived stage
# ServiceAccount; the later AIRM agent receives its own separate permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airm-agent-crds
  namespace: ${releaseNamespace}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ${releaseName}-airm-agent-crds
rules:
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - create
  - patch
  - update
  - watch
- apiGroups:
  - kaiwo.silogen.ai
  resources:
  - kaiwoqueueconfigs
  verbs:
  - get
  - create
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${releaseName}-airm-agent-crds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ${releaseName}-airm-agent-crds
subjects:
- kind: ServiceAccount
  name: airm-agent-crds
  namespace: ${releaseNamespace}
---
