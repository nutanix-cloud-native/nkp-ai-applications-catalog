# Stage 10 — RabbitMQ identity synchronization Job
#
# This Job runs after local-cluster registration has persisted the cluster ID
# and one-time RabbitMQ secret. It configures the corresponding broker user,
# vhost, permissions, and queue, then verifies Kubernetes and RabbitMQ agree.
#
# Namespace, deterministic broker pod, and container name are supplied to
# identity-sync.sh. Kustomize packages the script into an executable ConfigMap
# mounted read-only. Credentials are read from the two named AIRM Secrets and
# are not copied into the Job specification.
#
# The dedicated ServiceAccount can read those Secrets, wait on the expected
# broker pod, and open pod exec sessions. The ten-minute deadline covers broker
# readiness and retries. Flux treats successful verification as the final gate
# before the agent stage.
apiVersion: batch/v1
kind: Job
metadata:
  name: airm-identity-sync
  namespace: ${releaseNamespace}
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/component: identity-sync
        airm.nutanix.com/stage: 10-identity-sync
    spec:
      restartPolicy: Never
      serviceAccountName: airm-identity-sync
      containers:
      - name: identity-sync
        image: ${clusterToolImage:=docker.io/alpine/k8s@sha256:18bc02c1e0df04451f4f9194eb7b7341c1165da5495459b52f85f72fb9545032}
        imagePullPolicy: IfNotPresent
        env:
        - name: AIRM_NAMESPACE
          value: ${airmNamespace:=airm}
        - name: RABBITMQ_POD
          value: airm-infra-rabbitmq-rabbitmq-server-0
        - name: RABBITMQ_CONTAINER
          value: rabbitmq
        command:
        - /bin/sh
        - /scripts/identity-sync.sh
        volumeMounts:
        - mountPath: /scripts
          name: identity-sync-script
          readOnly: true
      volumes:
      - configMap:
          defaultMode: 0555
          name: airm-identity-sync-script
        name: identity-sync-script
---
