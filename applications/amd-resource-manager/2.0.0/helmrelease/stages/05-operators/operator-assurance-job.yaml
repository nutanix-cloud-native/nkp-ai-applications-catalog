# Stage 05 — Operator assurance Job
#
# CloudNativePG is supplied as a required NKP dependency and verified by stage
# 00. This Job verifies that the RabbitMQ Cluster Operator is installed and
# Ready, installing its pinned fallback manifest only when it is absent. The
# version and expected SHA-256 digest come from the orchestration chart.
#
# operators.sh is generated into `airm-operator-assurance-script` by
# kustomization.yaml and mounted read-only. The Job's ServiceAccount currently
# receives cluster-admin because the complete upstream RabbitMQ operator
# manifest contains namespaces, CRDs, admission configuration, RBAC, Services,
# and workloads across multiple API groups and namespaces; see rbac.yaml.
#
# The ten-minute deadline covers download and rollout. Flux health-checks this
# Job and blocks infrastructure creation until the controller is operational.
apiVersion: batch/v1
kind: Job
metadata:
  name: airm-operator-assurance
  namespace: ${releaseNamespace}
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/component: operator-assurance
        airm.nutanix.com/stage: 05-operators
    spec:
      restartPolicy: Never
      serviceAccountName: airm-operator-assurance
      containers:
      - name: operator-assurance
        image: ${clusterToolImage:=docker.io/alpine/k8s:1.35.0}
        imagePullPolicy: IfNotPresent
        env:
        - name: RABBITMQ_VERSION
          value: ${rabbitmqOperatorVersion}
        - name: RABBITMQ_MANIFEST_DIGEST
          value: ${rabbitmqOperatorManifestDigest}
        command:
        - /bin/sh
        - /scripts/operators.sh
        volumeMounts:
        - mountPath: /scripts
          name: operator-assurance-script
          readOnly: true
      volumes:
      - configMap:
          defaultMode: 0555
          name: airm-operator-assurance-script
        name: operator-assurance-script
---
