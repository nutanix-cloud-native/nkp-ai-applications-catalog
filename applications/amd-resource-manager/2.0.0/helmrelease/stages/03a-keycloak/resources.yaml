# Stage 03 — Keycloak platform resources
#
# These resources install Keycloak and expose it through the AIRM Gateway:
#
# - Namespace: owns the isolated Keycloak workload.
# - OCIRepository: fetches the configured Keycloak chart by explicit version tag.
# - HelmRelease: installs Keycloak with its internal PostgreSQL database,
#   ClusterIP Service, proxy headers, public hostname, and explicitly pinned
#   image repositories/tags.
# - HTTPRoute: exposes the internal Keycloak Service as `kc.${airmDomain}` on
#   stage 02's HTTPS Gateway listener.
#
# The chart and images are pinned for reproducibility. The chart manages its
# bootstrap admin Secret, which keycloak-config.sh reads. The HTTPRoute below is
# applied declaratively with the rest of this stage.
#
# `KC_HOSTNAME` and forwarded proxy headers are required because Traefik
# terminates TLS. Without them Keycloak can emit internal HTTP URLs, breaking
# browser/OIDC redirects. The Service remains private; only the HTTPRoute is
# externally reachable.
apiVersion: v1
kind: Namespace
metadata:
  name: ${keycloakNamespace:=keycloak}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: airm-keycloak-chart
  namespace: ${releaseNamespace}
spec:
  interval: 24h
  ref:
    tag: ${keycloakChartVersion}
  url: ${keycloakChartUrl}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: airm-keycloak
  namespace: ${releaseNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: airm-keycloak-chart
    namespace: ${releaseNamespace}
  # Compare live objects with the release and repair drift. Without this, Helm reports
  # "in sync" when the Keycloak StatefulSet is missing, and it is not recreated.
  driftDetection:
    mode: enabled
  install:
    createNamespace: true
    # install retries 3: after a failed install, Flux uninstalls Keycloak and retries.
    # Helm does not delete the PVC created from the StatefulSet template, so the
    # database survives an uninstall.
    remediation:
      retries: 3
    timeout: 10m
  interval: 15m
  releaseName: keycloak
  targetNamespace: ${keycloakNamespace:=keycloak}
  upgrade:
    # force false (the default, set explicitly): a change that needs the Keycloak
    # StatefulSet replaced fails the upgrade. Helm does not delete and recreate it,
    # so the database stays in place.
    force: false
    # upgrade retries 3: after a failed upgrade, Flux rolls back to the previous revision.
    remediation:
      retries: 3
    timeout: 10m
  values:
    auth:
      adminUser: admin
    extraEnvVars:
    - name: KC_HOSTNAME
      value: https://kc.${airmDomain}
    - name: KC_PROXY_HEADERS
      value: xforwarded
    image:
      repository: ${keycloakImageRepository}
      tag: ${keycloakImageTag}
    keycloakConfigCli:
      image:
        repository: ${keycloakConfigCliRepository}
        tag: ${keycloakConfigCliTag}
    postgresql:
      enabled: true
      image:
        repository: ${keycloakPostgresqlRepository}
        tag: ${keycloakPostgresqlTag}
      metrics:
        image:
          repository: ${keycloakPostgresExporterRepository}
          tag: ${keycloakPostgresExporterTag}
      volumePermissions:
        image:
          repository: ${keycloakOsShellRepository}
          tag: ${keycloakOsShellTag}
    proxyHeaders: xforwarded
    service:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-route
  namespace: ${keycloakNamespace:=keycloak}
spec:
  parentRefs:
  - name: ${gatewayName:=airm-https}
    namespace: ${releaseNamespace}
    sectionName: ${gatewayListenerName:=websecure}
  hostnames:
  - kc.${airmDomain:=airm.example.com}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: keycloak
      port: 80
---
