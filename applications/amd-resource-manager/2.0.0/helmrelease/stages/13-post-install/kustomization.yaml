# Stage 13 — Post-install Kustomize assembly
#
# This file packages post-install.sh into an executable ConfigMap and applies
# two narrow Secret-read Roles before creating the final summary Job. The
# generated script is mounted read-only by post-install-job.yaml.
#
# Flux starts this stage only after the agent HelmRelease and Deployment are
# Ready. Successful completion confirms the expected credential Secrets remain
# readable and marks the end of the staged all-mode installation.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
- files:
  - post-install.sh
  name: airm-post-install-script
  namespace: ${releaseNamespace}
resources:
- rbac.yaml
- post-install-job.yaml
---
