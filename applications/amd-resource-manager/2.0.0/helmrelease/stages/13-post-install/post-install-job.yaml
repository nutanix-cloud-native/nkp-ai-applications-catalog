# Stage 13 — Installation summary Job
#
# This final Job runs only after the standalone AIRM agent is Ready. It validates
# that the expected login Secrets contain non-empty values and emits the access
# URLs and the commands that retrieve the login credentials.
#
# Domain, namespaces, and Gateway name come from catalog substitution.
# post-install.sh is packaged into an executable ConfigMap by kustomization.yaml
# and mounted read-only. Its dedicated ServiceAccount can read only the two
# specifically named credential Secrets needed by the summary.
#
# SECURITY: The script does not write usernames or passwords to the Job log. It
# prints the commands that read them from their Secrets, so Kubernetes log
# readers never see the values.
#
# Flux health-checks this Job, making missing final credentials visible as an
# installation failure rather than reporting a misleading successful summary.
apiVersion: batch/v1
kind: Job
metadata:
  name: airm-post-install
  namespace: ${releaseNamespace}
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/component: post-install
        airm.nutanix.com/stage: 13-post-install
    spec:
      restartPolicy: Never
      serviceAccountName: airm-post-install
      containers:
      - name: post-install
        image: ${clusterToolImage:=docker.io/alpine/k8s:1.35.0}
        imagePullPolicy: IfNotPresent
        env:
        - name: DOMAIN
          value: ${airmDomain}
        - name: AIRM_NAMESPACE
          value: ${airmNamespace:=airm}
        - name: KEYCLOAK_NAMESPACE
          value: ${keycloakNamespace:=keycloak}
        - name: GATEWAY_NAME
          value: ${gatewayName:=airm-https}
        command:
        - /bin/sh
        - /scripts/post-install.sh
        volumeMounts:
        - mountPath: /scripts
          name: post-install-script
          readOnly: true
      volumes:
      - configMap:
          defaultMode: 0555
          name: airm-post-install-script
        name: post-install-script
---
