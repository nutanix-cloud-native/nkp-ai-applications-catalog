# Stage 02 — Kustomize assembly
#
# This file packages gateway.sh into an executable ConfigMap and applies the
# dedicated ServiceAccount/RBAC before creating the Gateway setup Job. The
# generated script ConfigMap is mounted read-only by gateway-job.yaml.
#
# Flux starts this stage after 01-secrets and waits for the `airm-gateway` Job
# health check. Gateway API CRDs are not applied here; 00-preflight has already
# verified them. Successful completion guarantees that the shared Gateway has
# been applied before stage 03 creates the Keycloak HTTPRoute.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
- files:
  - gateway.sh
  name: airm-gateway-script
  namespace: ${releaseNamespace}
resources:
- rbac.yaml
- gateway-job.yaml
---
