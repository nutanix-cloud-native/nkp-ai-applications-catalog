# Stage 05a — RabbitMQ Cluster Operator
#
# Applies the vendored RabbitMQ Cluster Operator manifest directly. Flux
# server-side applies it and gates the stage on the operator Deployment
# (see the healthChecks entry for 05a-operators in the orchestration chart).
#
# CloudNativePG is a required NKP application dependency verified by stage 00.
# Stage 05b-infrastructure depends on this stage, so its RabbitmqCluster custom
# resource is not submitted before the operator is Ready.
#
# This stage uses prune: false (see the chart's allModeStages), so removing the
# stage never deletes the operator CRDs or the RabbitMQ clusters they hold.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- rabbitmq-cluster-operator.yaml
---
