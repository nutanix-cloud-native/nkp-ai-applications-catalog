# Stage 01 — Secret initialization Job
#
# This Job runs the GitOps adaptation of installer script step 8. It waits for
# the domain published by stage 00, then creates the credentials and endpoint
# Secrets required by PostgreSQL, RabbitMQ, Keycloak, and AIRM.
#
# The shell implementation is generated into `airm-secret-init-script` by
# kustomization.yaml and mounted read-only at /scripts. The release namespace
# identifies the `airm-discovered` ConfigMap; the dedicated AIRM namespace is
# where application Secrets are written. The Keycloak client ID defaults to the
# same value used by the tested installer.
#
# The Job uses the narrowly scoped ServiceAccount from rbac.yaml. Its extended
# deadline covers the discovery wait during asynchronous Flux reconciliation.
# Retries are safe: the script preserves established credentials except for the
# two Keycloak Secret representations, which it intentionally keeps aligned.
apiVersion: batch/v1
kind: Job
metadata:
  name: airm-secret-init
  namespace: ${releaseNamespace}
spec:
  activeDeadlineSeconds: 1800
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/component: secret-init
        airm.nutanix.com/stage: 01-secrets
    spec:
      restartPolicy: Never
      serviceAccountName: airm-secret-init
      containers:
      - name: secret-init
        image: ${clusterToolImage:=docker.io/alpine/k8s@sha256:18bc02c1e0df04451f4f9194eb7b7341c1165da5495459b52f85f72fb9545032}
        imagePullPolicy: IfNotPresent
        env:
        - name: RELEASE_NAMESPACE
          value: ${releaseNamespace}
        - name: AIRM_NAMESPACE
          value: ${airmNamespace:=airm}
        - name: KEYCLOAK_CLIENT_ID
          value: ${keycloakAdminClientId:=354a0fa1-35ac-4a6d-9c4d-d661129c2cd0}
        command:
        - /bin/sh
        - /scripts/secret-init.sh
        volumeMounts:
        - mountPath: /scripts
          name: secret-init-script
          readOnly: true
      volumes:
      - configMap:
          defaultMode: 0555
          name: airm-secret-init-script
        name: secret-init-script
---
