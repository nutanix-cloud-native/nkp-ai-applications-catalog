overview: |
  **Overview**

  Open WebUI is an extensible, self-hosted web interface for interacting with large language models. It provides a ChatGPT-like experience on your own infrastructure, with support for Ollama, OpenAI-compatible APIs, RAG, and user management.

  **Key capabilities**

  - **Multi-backend support** — Connect to Ollama or any OpenAI-compatible endpoint; multiple backends can be used side-by-side.
  - **NKP SSO integration** — authenticates users via Traefik Forward Auth and the NKP identity provider (Dex). Users log in with their NKP credentials.
  - **RAG** — Built-in Retrieval-Augmented Generation for document-grounded conversations.
  - **User management** — Role-based access (Admin, User, Pending) and conversation history.
  - **Extensibility** — Model presets, prompt templates, and a plugin/pipeline system.

  **Access**

  - Open Open WebUI from the cluster **Application Dashboards** tab, or via your NKP Dashboard URL at the path `/nkp/open-webui/`.
  - In-cluster: `http://open-webui.open-webui.svc.cluster.local:80` (same namespace: `http://open-webui:80`).

  **Authentication**

  Open WebUI uses NKP SSO by default. Users are authenticated via Traefik Forward Auth before reaching Open WebUI. The authenticated username is passed via the `X-Forwarded-User` header.

  The first user to sign in is created automatically. Grant admin privileges in the Open WebUI admin settings after the first login.

  **Dependencies (this catalog)**

  This entry declares a soft dependency on **Ollama**. Install it in the same workspace for a local LLM backend; Open WebUI is pre-configured to discover it:

  | Backend | Default in-cluster URL (override in Helm values if needed) |
  |---------|-------------------------------------------------------------|
  | Ollama  | `http://ollama-ollama.ollama.svc.cluster.local:11434`  |

  **Resources**

  [Documentation](https://docs.openwebui.com) · [Project](https://github.com/open-webui/open-webui) · [Helm chart](https://github.com/open-webui/helm-charts) · [Helm values](https://github.com/open-webui/helm-charts/blob/main/charts/open-webui/values.yaml)
