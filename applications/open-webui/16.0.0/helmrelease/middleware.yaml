# Strip /nkp/open-webui so Open WebUI (which does not support a URL prefix) is
# served at that path on the NKP dashboard host, same Launch-button pattern as JupyterHub.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: stripprefix
  namespace: open-webui
spec:
  stripPrefix:
    prefixes:
      - /nkp/open-webui
---
