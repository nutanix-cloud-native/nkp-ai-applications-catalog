apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-${appVersion}-defaults
  namespace: ${releaseNamespace}
data:
  values.yaml: |
    ---
    fullnameOverride: open-webui
    ollama:
      enabled: false
    ollamaUrls:
      - "http://ollama-ollama.ollama.svc.cluster.local:11434"
    pipelines:
      enabled: false
    websocket:
      enabled: false
    enableOpenaiApi: false
    # Open WebUI does not support a URL prefix, so it cannot share Traefik with
    # the NKP UI. LoadBalancer gives it / on its own address. disableWait on the
    # HelmRelease avoids hanging if the LB IP is slow (then use port-forward).
    service:
      type: LoadBalancer
    ingress:
      enabled: false
    route:
      enabled: false
---
