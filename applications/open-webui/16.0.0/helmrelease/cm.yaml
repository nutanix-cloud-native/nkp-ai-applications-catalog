apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-${appVersion}-defaults
  namespace: ${releaseNamespace}
data:
  values.yaml: |
    ---
    fullnameOverride: open-webui
    # Disable the chart's bundled Ollama subchart (upstream default is enabled).
    # This does not install or require the catalog Ollama app.
    ollama:
      enabled: false
    pipelines:
      enabled: false
    websocket:
      enabled: false
    enableOpenaiApi: false
    # Open WebUI does not support a URL prefix, so it cannot share Traefik with
    # the NKP UI. ClusterIP + port-forward (or in-cluster DNS) exposes it at /
    # on its own origin without taking over the NKP dashboard host.
    service:
      type: ClusterIP
    ingress:
      enabled: false
    route:
      enabled: false
---
