apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-${appVersion}-defaults
  namespace: ${releaseNamespace}
data:
  values.yaml: |
    ---
    fullnameOverride: open-webui
    ollama:
      enabled: false
    ollamaUrls:
      - "http://ollama-ollama.ollama.svc.cluster.local:11434"
    pipelines:
      enabled: false
    websocket:
      enabled: false
    enableOpenaiApi: false
    service:
      type: ClusterIP
    ingress:
      enabled: true
      class: kommander-traefik
      # Override this in Kommander (Enable Application → Helm values) with an
      # FQDN that resolves to this cluster's kommander-traefik LoadBalancer.
      host: open-webui.${clusterName}
      tls: false
      annotations:
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.middlewares: "${releaseNamespace}-forwardauth@kubernetescrd"
    sso:
      enabled: true
      enableSignup: true
      trustedHeader:
        enabled: true
        emailHeader: X-Forwarded-User
        nameHeader: X-Forwarded-User
---
