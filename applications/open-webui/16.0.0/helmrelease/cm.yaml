apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-${appVersion}-defaults
  namespace: ${releaseNamespace}
data:
  values.yaml: |
    ---
    fullnameOverride: open-webui
    ollama:
      enabled: false
    ollamaUrls:
      - "http://ollama-ollama.ollama.svc.cluster.local:11434"
    pipelines:
      enabled: false
    websocket:
      enabled: false
    enableOpenaiApi: false
    service:
      type: ClusterIP
    # Chart Ingress is unused: a host-based / rule never matches Traefik's IP
    # (Forward Auth redirects sslip.io there). Routing is helmrelease/ingress.yaml.
    ingress:
      enabled: false
    sso:
      enabled: true
      enableSignup: true
      trustedHeader:
        enabled: true
        emailHeader: X-Forwarded-User
        nameHeader: X-Forwarded-User
---
