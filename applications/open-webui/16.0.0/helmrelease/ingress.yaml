# Path-based Ingress on the NKP Traefik dashboard host. The chart Ingress is
# hardcoded to path / (which would steal dashboard traffic), so this resource
# is used instead. Open WebUI does not support a URL prefix; stripPrefix plus
# Forward Auth match the JupyterHub Launch-button pattern.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: open-webui
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: "${releaseNamespace}-forwardauth@kubernetescrd,open-webui-stripprefix@kubernetescrd"
spec:
  ingressClassName: kommander-traefik
  rules:
    - http:
        paths:
          - path: /nkp/open-webui
            pathType: Prefix
            backend:
              service:
                name: open-webui
                port:
                  name: http
---
