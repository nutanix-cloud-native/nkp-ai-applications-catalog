# Traefik catch-all for this cluster origin (same host as the NKP UI).
#
# Open WebUI cannot use a URL prefix. NKP Forward Auth's authHost is the Traefik
# address (often a raw IP), so a second hostname (sslip.io) is redirected here
# and 404s unless something is routed at / for that Host header.
#
# spec.defaultBackend is Traefik's global default router (lowest priority), so
# /dkp/..., /nkp/jupyter/, /dex, and /_oauth_kommander keep winning.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui-nkp
  namespace: open-webui
  annotations:
    kubernetes.io/ingress.class: kommander-traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.priority: "1"
    traefik.ingress.kubernetes.io/router.middlewares: "${releaseNamespace}-forwardauth@kubernetescrd"
spec:
  ingressClassName: kommander-traefik
  defaultBackend:
    service:
      name: open-webui
      port:
        name: http
---
