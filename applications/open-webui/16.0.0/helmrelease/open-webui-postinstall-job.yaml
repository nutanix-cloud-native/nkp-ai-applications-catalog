# Post-install Job: copies the Open WebUI Ingress host into the Launch
# ConfigMap as https://<host>/ (Open WebUI cannot use a URL prefix).
apiVersion: batch/v1
kind: Job
metadata:
  name: ${releaseName}-postinstall-${appVersion}
  namespace: ${workspaceNamespace}
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: ${releaseName}-postinstall
      restartPolicy: OnFailure
      containers:
        - name: patch-dashboard-link
          image: docker.io/mesosphere/kubectl:v1.35.2-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: UI_NAMESPACE
              value: ${workspaceNamespace}
            - name: UI_CONFIGMAP
              value: ${releaseName}-ui
            - name: APP_NAMESPACE
              value: open-webui
            - name: APP_INGRESS
              value: open-webui
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Starting post-install (ui=$UI_CONFIGMAP in $UI_NAMESPACE, ingress=$APP_INGRESS in $APP_NAMESPACE)"
              sleep 15

              echo "Waiting for $UI_CONFIGMAP ConfigMap..."
              for i in $(seq 1 60); do
                if kubectl get configmap "$UI_CONFIGMAP" -n "$UI_NAMESPACE" >/dev/null 2>&1; then
                  echo "ConfigMap $UI_CONFIGMAP found."
                  break
                fi
                echo "Waiting for ConfigMap... ($i/60)"; sleep 5
              done
              if ! kubectl get configmap "$UI_CONFIGMAP" -n "$UI_NAMESPACE" >/dev/null 2>&1; then
                echo "ERROR: $UI_CONFIGMAP ConfigMap not found after 5min"; exit 1
              fi

              echo "Waiting for Ingress $APP_INGRESS host in $APP_NAMESPACE..."
              HOST=""
              for i in $(seq 1 60); do
                HOST=$(kubectl get ingress -n "$APP_NAMESPACE" "$APP_INGRESS" -o jsonpath='{.spec.rules[0].host}' 2>/dev/null || true)
                if [ -n "$HOST" ]; then
                  break
                fi
                echo "Waiting... ($i/60)"; sleep 5
              done

              if [ -z "$HOST" ]; then
                echo "ERROR: Ingress host not found"
                kubectl get ingress -n "$APP_NAMESPACE" "$APP_INGRESS" -o yaml 2>/dev/null || true
                exit 1
              fi

              ENDPOINT="https://$HOST/"
              PAYLOAD=$(printf '{"data": {"dashboardLink": "%s"}}' "$ENDPOINT")
              kubectl patch configmap "$UI_CONFIGMAP" -n "$UI_NAMESPACE" --type=merge -p "$PAYLOAD"
              echo "Dashboard link updated: $ENDPOINT"
---
