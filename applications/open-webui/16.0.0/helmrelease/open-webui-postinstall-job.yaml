# Post-install Job: discovers the Open WebUI LoadBalancer address and patches
# ${releaseName}-ui dashboardLink so Launch opens the UI at /.
apiVersion: batch/v1
kind: Job
metadata:
  name: ${releaseName}-postinstall-${appVersion}
  namespace: ${workspaceNamespace}
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 300
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: ${releaseName}-postinstall
      restartPolicy: OnFailure
      containers:
        - name: patch-dashboard-link
          image: docker.io/mesosphere/kubectl:v1.35.2-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: WORKSPACE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APP_NAMESPACE
              value: "open-webui"
            - name: APP_SERVICE
              value: "open-webui"
            - name: APP_PORT
              value: "80"
            - name: CONFIGMAP_NAME
              value: "${releaseName}-ui"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Starting post-install (ns=$WORKSPACE_NAMESPACE, app=$APP_SERVICE in $APP_NAMESPACE)"
              sleep 15
              echo "Waiting for $CONFIGMAP_NAME ConfigMap..."
              for i in $(seq 1 60); do
                if kubectl get configmap "$CONFIGMAP_NAME" -n "$WORKSPACE_NAMESPACE" 2>/dev/null; then
                  echo "ConfigMap $CONFIGMAP_NAME found."
                  break
                fi
                echo "Waiting for ConfigMap... ($i/60)"; sleep 5
              done
              if ! kubectl get configmap "$CONFIGMAP_NAME" -n "$WORKSPACE_NAMESPACE" 2>/dev/null; then
                echo "ERROR: $CONFIGMAP_NAME ConfigMap not found after 5min"; exit 1
              fi

              echo "Waiting for $APP_SERVICE LoadBalancer in $APP_NAMESPACE..."
              IP=""; HOSTNAME=""
              for i in $(seq 1 60); do
                IP=$(kubectl get svc -n "$APP_NAMESPACE" "$APP_SERVICE" -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
                HOSTNAME=$(kubectl get svc -n "$APP_NAMESPACE" "$APP_SERVICE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
                if [ -n "$IP" ] || [ -n "$HOSTNAME" ]; then
                  break
                fi
                echo "Waiting... ($i/60)"; sleep 5
              done

              if [ -z "$IP" ] && [ -z "$HOSTNAME" ]; then
                echo "LoadBalancer address not assigned (common without MetalLB/cloud LB)."
                echo "Launch stays unused. Port-forward instead:"
                echo "  kubectl -n $APP_NAMESPACE port-forward svc/$APP_SERVICE 8080:$APP_PORT"
                echo "Then open http://127.0.0.1:8080/"
                kubectl get svc -n "$APP_NAMESPACE" "$APP_SERVICE" -o yaml 2>/dev/null || true
                exit 0
              fi

              if [ -n "$IP" ]; then
                ENDPOINT="http://$IP:$APP_PORT/"
              else
                ENDPOINT="http://$HOSTNAME:$APP_PORT/"
              fi

              PAYLOAD=$(printf '{"data": {"dashboardLink": "%s"}}' "$ENDPOINT")
              kubectl patch configmap "$CONFIGMAP_NAME" -n "$WORKSPACE_NAMESPACE" --type=merge -p "$PAYLOAD"
              echo "Dashboard link updated: $ENDPOINT"
---
