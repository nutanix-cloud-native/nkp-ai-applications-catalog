# ConfigMap for NKP Launch button. Post-install Job patches dashboardLink with
# the LoadBalancer URL; Flux SSA Merge keeps that patch on reconcile.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${releaseName}-ui
  namespace: ${workspaceNamespace}
  labels:
    kommander.d2iq.io/application: ${releaseName}
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
data:
  name: Open WebUI
  dashboardLink: "#"
  docsLink: "https://docs.openwebui.com/"
  version: "16.0.0"
---
