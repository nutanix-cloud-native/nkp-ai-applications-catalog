apiVersion: v1
data:
  values.yaml: |
    fullnameOverride: "open-webui"
    # Expose UI via LoadBalancer so postinstall job can set dashboardLink to its external IP (same pattern as kagent).
    service.type: LoadBalancer
    ingress.enabled: false
    route.enabled: false

    # Disable bundled Ollama subchart — use the standalone Ollama from the catalog
    ollama:
      enabled: false

    # Point to the catalog's Ollama service in the ollama namespace
    ollamaUrls:
      - "http://ollama-ollama.ollama.svc.cluster.local:11434"

    # Connect to the catalog's vLLM service via OpenAI-compatible API
    # ref: https://docs.openwebui.com/getting-started/quick-start/connect-a-provider/starting-with-vllm
    openaiBaseApiUrls:
      - "http://vllm-vllm.vllm.svc.cluster.local:8000/v1"

    # vLLM does not require an API key by default; use a placeholder
    openaiApiKeys:
      - "none"

    # Disable bundled Pipelines subchart (not needed for base deployment)
    pipelines:
      enabled: false

    # Disable websocket/Redis (single-replica default; enable for multi-replica)
    websocket:
      enabled: false
kind: ConfigMap
metadata:
  name: ${releaseName}-${appVersion}-defaults
  namespace: ${releaseNamespace}
---
