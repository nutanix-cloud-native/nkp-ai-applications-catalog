apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ${releaseName}-chart
  namespace: ${releaseNamespace}
spec:
  interval: 6h0m0s
  ref:
    tag: 1.6.2
  url: oci://ghcr.io/nutanix-cloud-native/nkp-ai-applications-catalog/charts/clearml-serving
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clearml-serving
  namespace: ${releaseNamespace}
spec:
  chartRef:
    kind: OCIRepository
    name: ${releaseName}-chart
    namespace: ${releaseNamespace}
  install:
    createNamespace: true
    remediation:
      retries: 30
    timeout: 10m
  interval: 15s
  targetNamespace: clearml-serving
  upgrade:
    remediation:
      retries: 30
    timeout: 10m
  valuesFrom:
    - kind: ConfigMap
      name: ${releaseName}-${appVersion}-defaults
---
