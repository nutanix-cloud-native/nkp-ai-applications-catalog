overview: |
  **Overview**

  ClearML Serving is a scalable model serving solution that enables automatic model
  deployment, A/B testing, canary rollouts, and model performance monitoring. It integrates
  with the ClearML Server for model registry and supports multiple serving engines including
  NVIDIA Triton for GPU-optimized inference.

  This catalog entry deploys the ClearML serving stack, including:

  - **Statistics service** - Collects and exports serving metrics to Prometheus
  - **Inference service** - Handles model preprocessing and postprocessing logic
  - **Inference engine** - Supports CPU-based and NVIDIA Triton-accelerated inference
  - **Kafka** - Message queue for inter-service communication
  - **Prometheus & Grafana** - Monitoring and dashboarding (via subcharts)

  **Key capabilities**

  - Serve any model from the ClearML model registry (scikit-learn, PyTorch, TensorFlow, ONNX)
  - Automatic model deployment on publish/tag with configurable polling
  - Canary and A/B testing with weighted traffic splitting
  - Multi-model endpoints with hot-swapping
  - Built-in monitoring with Prometheus metrics and Grafana dashboards
  - Auto-batching and GPU optimization via NVIDIA Triton
  - Out-of-the-box node auto-scaling based on load

  **Dependencies**

  This app requires the ClearML Server application to be installed first at the workspace level.

  **Access**

  ClearML Serving exposes its inference endpoints through the NKP Traefik route
  at `/nkp/clearml-serving/`. Models are deployed via the ClearML CLI or SDK after
  registering them in the ClearML model repository.

  **Resources**

  [Documentation](https://clear.ml/docs/latest/docs/serving/) , [Project](https://github.com/clearml/clearml-serving) , [Helm chart](https://github.com/clearml/clearml-helm-charts)
