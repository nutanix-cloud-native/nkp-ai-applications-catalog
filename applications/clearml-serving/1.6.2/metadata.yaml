overview: |
  **Overview**

  ClearML Serving is a scalable model serving solution that enables automatic model
  deployment, A/B testing, canary rollouts, and model performance monitoring. It integrates
  with the ClearML Server for model registry.

  This catalog entry deploys the ClearML serving stack, including:

  - **Inference service** - Handles model preprocessing and postprocessing logic
  - **Kafka** - Message queue for inter-service communication
  - **Statistics service** - Aggregates serving metrics and exposes them on port 9999

  **Key capabilities**

  - Serve any model from the ClearML model registry (scikit-learn, PyTorch, TensorFlow, ONNX)
  - Automatic model deployment on publish/tag with configurable polling
  - Canary and A/B testing with weighted traffic splitting
  - Out-of-the-box node auto-scaling based on load

  **Dependencies**

  This app requires the ClearML Server application to be installed first at the workspace level.

  **Access**

  The inference service is ClusterIP only, because its `/serve/<model>` routes cannot be served under an NKP Traefik subpath. In-cluster, use `http://clearml-serving-clearml-serving-inference.clearml-serving.svc.cluster.local:8080/serve/<model>/<version>`.

  Deploy a model with the ClearML CLI or SDK after registering it in the ClearML model repository.

  To reach it from your workstation, port-forward the service:

  ```bash
  kubectl port-forward -n clearml-serving svc/clearml-serving-clearml-serving-inference 8082:8080
  ```

  Then query a model endpoint, for example one deployed as `classifier` version `1`:

  ```bash
  curl -X POST "http://127.0.0.1:8082/serve/classifier/1" \
    -H "Content-Type: application/json" \
    -d '{"x0": 1, "x1": 2}'
  ```

  **Required configuration**

  - Create an API key pair in the ClearML UI, under Settings -> Workspace.
  - Create the serving task with clearml-serving create.
  - Set clearml.apiAccessKey, clearml.apiSecretKey and clearml.servingTaskId through NKP UI cluster config overrides.

  **Important:** the catalog defaults point the serving pods at the in-cluster ClearML Server
  services. The credentials and Serving Service ID are placeholders, so you must override them.
  Override these configs in the NKP UI, disable ClearML Serving, wait 2-3 minutes for the pods
  to terminate, and re-enable the app.

  ```yaml
  clearml:
    apiAccessKey: "<access key>"
    apiSecretKey: "<secret key>"
    servingTaskId: "<serving service id>"
  ```

  **Notes**

  - The statistics service exposes Prometheus metrics on port 9999 of clearml-serving-statistics in the clearml-serving namespace
  - Enabling Triton in an airgapped cluster needs its image mirrored.

  **Resources**

  [Documentation](https://clear.ml/docs/latest/docs/serving/) , [Project](https://github.com/clearml/clearml-serving) , [Helm chart](https://github.com/clearml/clearml-helm-charts)
