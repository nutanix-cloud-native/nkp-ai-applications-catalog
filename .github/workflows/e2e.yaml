name: E2E Tests

on:
  pull_request:
    branches: [main]
    paths: ["applications/**", "apptests/**"]
    types: [opened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      app:
        description: "Application name (blank = all)"
        required: false
        type: string
      version:
        description: "Version (blank = latest)"
        required: false
        type: string
  push:
    branches: [main]
    paths: ["applications/**", "apptests/**"]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-apps:
    name: Detect Applications
    if: >-
      github.event.action != 'labeled'
      || startsWith(github.event.label.name, 'e2e-')
      || github.event.label.name == 'run-e2e-all'
    runs-on: self-hosted-nutanix-xsmall
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_entries: ${{ steps.matrix.outputs.has_entries }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build test matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABEL: ${{ github.event.label.name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          latest() { find "applications/$1" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort -V | tail -1; }

          if [[ -n "${INPUT_APP}" ]]; then
            pairs="${INPUT_APP}/${INPUT_VERSION:-$(latest "$INPUT_APP")}"
          elif [[ "${LABEL}" == "run-e2e-all" ]]; then
            pairs=$(find applications -mindepth 2 -maxdepth 2 -type d | sed 's|^applications/||')
          elif [[ "${LABEL}" == e2e-* ]]; then
            app="${LABEL#e2e-}"
            pairs="$app/$(latest "$app")"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            pairs=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- applications/ \
              | sed -n 's|^applications/\([^/]*\)/\([^/]*\)/.*|\1/\2|p' | sort -u)
          else
            pairs=$(find applications -mindepth 2 -maxdepth 2 -type d | sed 's|^applications/||')
          fi

          entries=$(echo "$pairs" \
            | awk -F/ 'NF==2 {printf "{\"app\":\"%s\",\"version\":\"%s\"}\n",$1,$2}' \
            | jq -sc '.')

          echo "matrix={\"include\":${entries}}" >> "$GITHUB_OUTPUT"
          echo "has_entries=$([[ "$entries" != "[]" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  e2e:
    name: "${{ matrix.app }} @ ${{ matrix.version }}"
    needs: detect-apps
    if: needs.detect-apps.outputs.has_entries == 'true'
    runs-on: self-hosted-ncn-docker-large
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-apps.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true
          skip-nix-installation: true

      - name: Run E2E tests
        env:
          SKIP_CLUSTER_TEARDOWN: "true"
        run: devbox run -- just e2e-test "${{ matrix.app }}" "${{ matrix.version }}"

      - name: Collect diagnostic bundle
        if: failure()
        run: |
          devbox run -- kind export kubeconfig --name kommanderapptest --kubeconfig "$RUNNER_TEMP/kind-kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kind-kubeconfig"
          devbox run -- nkp diagnose --bundle-name-prefix=e2e- || true

      - name: Upload diagnostic bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.app }}-${{ matrix.version }}
          path: e2e-*.tar.gz
