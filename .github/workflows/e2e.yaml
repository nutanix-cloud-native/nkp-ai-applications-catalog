name: E2E Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      app:
        description: "Application name (blank = all enabled)"
        required: false
        type: string
      version:
        description: "Version (blank = latest)"
        required: false
        type: string
  push:
    branches: [main]
    paths: ["apptests/**"]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-apps:
    name: Detect Applications
    if: >-
      github.event.action != 'labeled'
      || startsWith(github.event.label.name, 'e2e-')
      || github.event.label.name == 'run-e2e-all'
    runs-on: self-hosted-nutanix-xsmall
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_entries: ${{ steps.matrix.outputs.has_entries }}
    steps:
      - uses: actions/checkout@v4

      - name: Build test matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABEL: ${{ github.event.label.name }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          latest() { find "applications/$1" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort -V | tail -1; }

          # Source of truth: the app-list slices in suites_test.go. enabledApps are
          # HelmRelease apps; customTestApps are Flux-Kustomize apps. Both run e2e.
          generic=$(sed -n '/enabledApps.*\[\]string{/,/}/{s/.*"\([^"]*\)".*/\1/p}' apptests/suites/suites_test.go)
          custom=$(sed -n '/customTestApps.*\[\]string{/,/}/{s/.*"\([^"]*\)".*/\1/p}' apptests/suites/suites_test.go)
          enabled=$(printf '%s\n%s\n' "$generic" "$custom" | sed '/^$/d')

          # HelmRelease apps are airgap-bundlable by default. Custom apps are
          # evaluated per-version below to decide if they can be bundled.
          airgapped_apps=$(printf '%s\n' "$generic" | sed '/^$/d')

          if [[ -n "${INPUT_APP}" ]]; then
            apps="${INPUT_APP}"
          elif [[ " ${LABEL} ${PR_LABELS} " == *" run-e2e-all "* ]]; then
            apps="$enabled"
          elif [[ -n "${LABEL}${PR_LABELS}" ]]; then
            apps=""
            for l in $PR_LABELS ${LABEL}; do
              [[ "$l" == e2e-* ]] && apps="${apps} ${l#e2e-}"
            done
          elif [[ "${EVENT_NAME}" != "pull_request" ]]; then
            # push to main or workflow_dispatch with no app: run all enabled
            apps="$enabled"
          else
            # PR with no e2e labels: skip
            apps=""
          fi

          # remove duplicates
          apps=$(echo "$apps" | tr ' ' '\n' | sort -u | tr '\n' ' ')

          pairs=""
          for app in $apps; do
            # Only include if the app is in the enabled list
            echo "$enabled" | grep -qw "$app" || continue
            ver="${INPUT_VERSION:-$(latest "$app")}"
            [[ -n "$ver" ]] && pairs=$(printf '%s\n%s/%s' "$pairs" "$app" "$ver")
          done

          entries=$(echo "$pairs" | awk -F/ 'NF==2 {print $1"/"$2}' | while IFS=/ read -r app ver; do
            airgapped=false
            bundle_source="ghcr"
            chart_yaml_path="charts/${app}/Chart.yaml"
            gitrepo_yaml_path="applications/${app}/${ver}/helmrelease/gitrepository.yaml"

            # Check if an app is airgapped and where to get its bundle based on whether it's generic or baked locally
            is_generic_helm_app=$(echo "$airgapped_apps" | grep -qw "$app" && echo "true" || echo "false")
            has_local_baked_chart=$([[ -f "$chart_yaml_path" ]] && echo "true" || echo "false")
            relies_on_upstream_gitrepo=$([[ -f "$gitrepo_yaml_path" ]] && echo "true" || echo "false")

            if [[ "$is_generic_helm_app" == "true" ]]; then
              airgapped=true
              # bundle_source remains "ghcr"
            elif [[ "$has_local_baked_chart" == "true" && "$relies_on_upstream_gitrepo" == "false" ]]; then
              airgapped=true
              bundle_source="repo"
            fi
            printf '{"app":"%s","version":"%s","airgapped":%s,"bundle_source":"%s"}\n' "$app" "$ver" "$airgapped" "$bundle_source"
          done | jq -sc '.')
          echo "matrix={\"include\":${entries}}" >> "$GITHUB_OUTPUT"
          echo "has_entries=$([[ "$entries" != "[]" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  e2e:
    name: "${{ matrix.app }} @ ${{ matrix.version }}"
    needs: detect-apps
    if: needs.detect-apps.outputs.has_entries == 'true'
    runs-on: self-hosted-ncn-docker-large
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-apps.outputs.matrix) }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true
          skip-nix-installation: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run E2E tests
        env:
          SKIP_CLUSTER_TEARDOWN: "true"
        run: devbox run -- just e2e-test "${{ matrix.app }}" "${{ matrix.version }}"

      # Only airgap-bundlable apps (matrix.airgapped=true) build a bundle.
      - name: Build airgapped bundle
        if: success() && matrix.airgapped
        run: |
          if [[ "${{ matrix.bundle_source }}" == "repo" ]]; then
            # Repo-state bundling keeps PR validation deterministic for baked apps.
            devbox run -- ./.local/bin/nkp create catalog-bundle \
              --repo-dir . \
              --collection-tag "e2e-${{ matrix.app }}-${{ matrix.version }}" \
              --apps "${{ matrix.app }}=${{ matrix.version }}" \
              --airgapped \
              --output-file "${{ matrix.app }}-${{ matrix.version }}-full.tar"
          else
            devbox run -- just create-application-airgapped-bundle "${{ matrix.app }}" "${{ matrix.version }}"
          fi

      - name: Upload airgapped bundle
        if: success() && matrix.airgapped
        uses: actions/upload-artifact@v4
        with:
          name: airgapped-bundle-${{ matrix.app }}-${{ matrix.version }}
          path: ${{ matrix.app }}-${{ matrix.version }}-full.tar

      - name: Collect diagnostic bundle
        if: failure()
        run: |
          devbox run -- kind export kubeconfig --name kommanderapptest --kubeconfig "$RUNNER_TEMP/kind-kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kind-kubeconfig"
          devbox run -- nkp diagnose --bundle-name-prefix=e2e- || true

      - name: Upload diagnostic bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.app }}-${{ matrix.version }}
          path: e2e-*.tar.gz
