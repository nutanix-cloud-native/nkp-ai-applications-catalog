name: Publish Baked Charts to GHCR

on:
  workflow_dispatch:
    inputs:
      baked_chart_apps:
        description: "Optional comma-separated baked chart app names to publish (for example: kubeflow-pipelines). If empty, detect changed charts from compare refs."
        type: string
        required: false
      compare_base_ref:
        description: "Base ref used for changed-chart detection when baked_chart_apps is empty."
        type: string
        default: "origin/main"
        required: true
      compare_head_ref:
        description: "Head ref used for changed-chart detection when baked_chart_apps is empty."
        type: string
        default: "HEAD"
        required: true
      chart_version:
        description: "Optional single chart version to bake and publish for the selected app (for example: 2.15.0). Must be configured in scripts/bake-apps.yaml. If empty, publish every configured version."
        type: string
        required: false

jobs:
  publish-baked-charts:
    name: Bake and publish selected baked charts
    runs-on:
      - self-hosted-nutanix-medium
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix on self-hosted ARC runners
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.13.0
        with:
          skip-nix-installation: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve baked chart apps to publish
        id: resolve-apps
        shell: bash
        env:
          BAKED_CHART_APPS: ${{ inputs.baked_chart_apps }}
          COMPARE_BASE_REF: ${{ inputs.compare_base_ref }}
          COMPARE_HEAD_REF: ${{ inputs.compare_head_ref }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin main

          if [[ -n "${BAKED_CHART_APPS// /}" ]]; then
            apps_list="$(printf '%s' "$BAKED_CHART_APPS" | tr ',' '\n' | xargs -n1 | awk '!seen[$0]++' || true)"
            selection_source="manual_input"
          else
            base_ref="${COMPARE_BASE_REF:-origin/main}"
            head_ref="${COMPARE_HEAD_REF:-HEAD}"
            apps_list="$(
              git diff --name-only "${base_ref}...${head_ref}" \
                | grep '^charts/' \
                | cut -d/ -f2 \
                | sort -u || true
            )"
            selection_source="changed_charts"
          fi

          apps_list="$(printf '%s\n' "$apps_list" | grep -E '^kubeflow-pipelines$' || true)"

          if [[ -z "$apps_list" ]]; then
            apps_count=0
          else
            apps_count="$(echo "$apps_list" | wc -l | xargs)"
          fi
          {
            echo "apps_list<<EOF"
            printf '%s\n' "$apps_list"
            echo "EOF"
            echo "apps_count=${apps_count}"
            echo "selection_source=${selection_source}"
          } >> "$GITHUB_OUTPUT"

      - name: Show selected apps
        run: |
          echo "Selection source: ${{ steps.resolve-apps.outputs.selection_source }}"
          echo "Apps:"
          echo "${{ steps.resolve-apps.outputs.apps_list }}"
          echo "Count: ${{ steps.resolve-apps.outputs.apps_count }}"

      - name: Bake and publish charts
        if: ${{ steps.resolve-apps.outputs.apps_count != '0' }}
        shell: bash
        env:
          APPS_LIST: ${{ steps.resolve-apps.outputs.apps_list }}
          SELECTED_VERSION: ${{ inputs.chart_version }}
        run: |
          set -euo pipefail

          published=()
          while IFS= read -r app; do
            [[ -n "$app" ]] || continue

            # Chart versions this app bakes, from scripts/bake-apps.yaml
            # (chart.version, falling back to the catalog version).
            chart_versions="$(APP="$app" devbox run -- yq -r '.apps[env(APP)].versions[] | (.chart.version // .version)' scripts/bake-apps.yaml)"
            if [[ -z "$chart_versions" ]]; then
              echo "::error::No versions for ${app} in scripts/bake-apps.yaml"
              exit 1
            fi

            # Optional single-version run: only that version is baked and published.
            if [[ -n "$SELECTED_VERSION" ]]; then
              if ! grep -qxF "$SELECTED_VERSION" <<< "$chart_versions"; then
                echo "::error::Version ${SELECTED_VERSION} is not configured for ${app} in scripts/bake-apps.yaml"
                exit 1
              fi
              chart_versions="$SELECTED_VERSION"
            fi

            while IFS= read -r chart_version; do
              chart_path="charts/${app}/${chart_version}/Chart.yaml"
              if [[ ! -f "$chart_path" ]]; then
                echo "::error::No baked chart found for ${app} at ${chart_path}"
                exit 1
              fi
            done <<< "$chart_versions"

            echo "==> Baking ${app}"
            devbox run -- just bake "${app}" "${SELECTED_VERSION}"

            while IFS= read -r chart_version; do
              chart_path="charts/${app}/${chart_version}/Chart.yaml"
              if ! grep -q 'https://github.com/nutanix-cloud-native/nkp-ai-applications-catalog' "$chart_path"; then
                echo "::error::${chart_path} is missing catalog source link required for package-to-repo linkage after bake"
                exit 1
              fi
            done <<< "$chart_versions"

            echo "==> Checking bake drift for ${app}"
            if [[ -d "applications/${app}" ]]; then
              git diff --exit-code -- "charts/${app}" "applications/${app}"
            else
              git diff --exit-code -- "charts/${app}"
            fi

            while IFS= read -r chart_version; do
              chart_path="charts/${app}/${chart_version}/Chart.yaml"
              echo "==> Publishing baked chart ${app} ${chart_version}"
              devbox run -- just push-baked-chart "${app}" "${chart_version}"

              version="$(awk -F': *' '/^version:/{print $2; exit}' "$chart_path")"
              published+=("${app}:${version}")
            done <<< "$chart_versions"
          done <<< "$APPS_LIST"

          {
            echo "## Published baked charts"
            echo ""
            echo "| Chart | Version |"
            echo "|---|---|"
            for item in "${published[@]}"; do
              chart="${item%%:*}"
              version="${item##*:}"
              echo "| ${chart} | ${version} |"
            done
            echo ""
            echo "> Visibility: this workflow only publishes packages. If a package is not public, update visibility in GHCR package settings."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No baked chart changes found
        if: ${{ steps.resolve-apps.outputs.apps_count == '0' }}
        run: |
          echo "No baked chart changes detected between '${{ inputs.compare_base_ref }}' and '${{ inputs.compare_head_ref }}'."
          echo "Use baked_chart_apps to force publishing specific charts."
