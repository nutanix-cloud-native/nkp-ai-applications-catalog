name: Publish OCI Artifacts

on:
  workflow_dispatch:
    inputs:
      COLLECTION_TAG:
        description: "Tag for the collection to publish"
        required: true
        type: choice
        options:
          - v2.16.0
          - v2.17.0
          - v2.18.0
          - v2.19.0
          - custom
      CUSTOM_TAG:
        description: "Use when 'custom' is selected above. Enter the tag (e.g. v2.20.0)"
        required: false
        type: string
      REGISTRY:
        description: "OCI registry URL (e.g. oci://ghcr.io/nutanix-cloud-native/nkp-ai-applications-catalog)"
        required: false
        type: string
        default: "oci://ghcr.io/nutanix-cloud-native/nkp-ai-applications-catalog"

jobs:
  publish-oci-artifacts:
    name: Publish OCI Artifacts
    runs-on:
      - self-hosted-nutanix-medium
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NIX
        uses: cachix/install-nix-action@v31

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: true
          skip-nix-installation: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and publish catalog bundle
        env:
          CHART_REGISTRY: oci://ghcr.io/nutanix-cloud-native/charts
        run: |
          if [ "${{ inputs.COLLECTION_TAG }}" = "custom" ]; then
            if [ -z "${{ inputs.CUSTOM_TAG }}" ]; then
              echo "::error::CUSTOM_TAG is required when COLLECTION_TAG is 'custom'"
              exit 1
            fi
            TAG="${{ inputs.CUSTOM_TAG }}"
          else
            TAG="${{ inputs.COLLECTION_TAG }}"
          fi

          # Skip validate — it runs separately via Manifest validation workflow.
          # Kubeflow apps use cross-directory kustomize refs that fail with
          # nkp validate's LoadRestrictionsRootOnly policy in CI.
          devbox run -- just create-bundle "$TAG"
          devbox run -- just push-bundle "$TAG" "${{ inputs.REGISTRY }}"
