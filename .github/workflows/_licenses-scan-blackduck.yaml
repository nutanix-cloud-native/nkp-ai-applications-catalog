# Reusable workflow: runs BlackDuck source code and container image scans
# against all scan definition YAMLs in a directory using the pre-built
# dkp-licenses-cli container image.
#
# Scan definitions must be uploaded as a GHA artifact named "scan-definitions"
# by the calling workflow (or a prior job). Each YAML file in the directory
# represents one application and is scanned independently.

name: licenses/scan-blackduck

on:
  workflow_call:
    inputs:
      scan_definitions_dir:
        description: 'Directory containing scan definition YAML files'
        type: string
        default: 'scans'
      parallel_scans:
        description: 'Number of concurrent scans'
        type: number
        default: 4
      timeout:
        description: 'Total scan timeout'
        type: string
        default: '4h'
      source_code_scan:
        description: 'Enable source code scanning'
        type: boolean
        default: true
      container_image_scan:
        description: 'Enable container image scanning'
        type: boolean
        default: true
      force_rescan:
        description: 'Force Black Duck scans to ignore existing cached project versions'
        type: boolean
        default: false
      verbosity:
        description: 'Logging verbosity level'
        type: number
        default: 1
      cli_image:
        description: 'dkp-licenses-cli container image'
        type: string
        default: 'docker.io/mesosphere/dkp-licenses-cli:licenses-v0.0.17-dev'
      scanner_image:
        description: 'dkp-licenses-scanner container image'
        type: string
        default: 'harbor.eng.nutanix.com/dkp-infra-tools/license-scanner-blackduck:9.5.0'
    secrets:
      BLACKDUCK_API_TOKEN:
        required: true

env:
  BLACKDUCK_URL: "https://nutanix.app.blackduck.com"

jobs:
  scan:
    runs-on:
      - self-hosted-nutanix-docker-large
    permissions:
      contents: read
    steps:
      - name: Download scan definitions
        uses: actions/download-artifact@v4
        with:
          name: scan-definitions
          path: scans/

      - name: Verify scan definitions exist
        run: |
          count=$(find scans -maxdepth 1 -type f -name '*.yaml' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No scan definition YAML files found in scans/"
            exit 1
          fi
          echo "Found $count scan definition(s):"
          find scans -maxdepth 1 -type f -name '*.yaml' -print

      - name: Pull scanner image
        run: |
          docker pull "${{ inputs.scanner_image }}"
          docker tag "${{ inputs.scanner_image }}" "mesosphere/license-scanner-blackduck:9.5.0"

      - name: Restore scan cache
        uses: actions/cache@v4
        with:
          path: /tmp/bd-cache
          key: bd-scan-cache-${{ hashFiles('scans/*.yaml') }}
          restore-keys: bd-scan-cache-

      - name: Run BlackDuck scans
        env:
          BLACKDUCK_API_TOKEN: ${{ secrets.BLACKDUCK_API_TOKEN }}
        run: |
          set -euo pipefail
          # The CLI launches scanner containers through the host Docker socket,
          # so temp paths must exist on the host for nested bind mounts.
          TMPDIR="$(mktemp -d)"
          trap 'rm -rf "$TMPDIR"' EXIT
          export TMPDIR
          mkdir -p "$TMPDIR/go/pkg/mod"

          any_failed=false
          {
            echo "### Black Duck scan results"
            echo
            echo "| Result | Scan definition |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          force_args=()
          if [ "${{ inputs.force_rescan }}" = "true" ]; then
            force_args+=(--force)
          fi

          for scan_file in "${GITHUB_WORKSPACE}"/scans/*.yaml; do
            scan_name="$(basename "$scan_file")"
            echo "::group::Scanning $scan_name"
            if docker run --rm \
              -v "${GITHUB_WORKSPACE}/scans:/scans:ro" \
              -v "${TMPDIR}:${TMPDIR}" \
              -v /tmp/bd-cache:/cache \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -e BLACKDUCK_API_TOKEN \
              -e TMPDIR \
              "${{ inputs.cli_image }}" \
              scan bd "/scans/${scan_name}" \
                --blackduck-url "$BLACKDUCK_URL" \
                --parallel-scans ${{ inputs.parallel_scans }} \
                --cache-local-storage-path /cache \
                --blackduck-dockerless-container-scan \
                --source-code-scan=${{ inputs.source_code_scan }} \
                --container-image-scan=${{ inputs.container_image_scan }} \
                --timeout ${{ inputs.timeout }} \
                "${force_args[@]}" \
                -v ${{ inputs.verbosity }}; then
              echo "| ✅ PASS | \`$scan_name\` |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error title=Scan failed::$scan_name"
              echo "| ❌ FAIL | \`$scan_name\` |" >> "$GITHUB_STEP_SUMMARY"
              any_failed=true
            fi
            echo "::endgroup::"
          done

          if [ "$any_failed" = true ]; then
            echo "::error::One or more scan definition(s) failed"
            exit 1
          fi
