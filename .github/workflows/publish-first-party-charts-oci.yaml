name: Publish First-Party Charts to GHCR

on:
  workflow_dispatch:
    inputs:
      chart:
        description: "Versioned chart path under charts/ (e.g. amd-resource-manager/2.0.0)."
        type: string
        required: true

jobs:
  publish-first-party-chart:
    name: Lint and publish ${{ inputs.chart }}
    runs-on:
      - self-hosted-nutanix-medium
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Nix on self-hosted ARC runners
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.13.0
        with:
          skip-nix-installation: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and publish chart
        shell: bash
        env:
          CHART: ${{ inputs.chart }}
        run: |
          set -euo pipefail

          # Only hand-authored charts: charts/<name>/<version>/ (e.g. amd-resource-manager/2.0.0).
          name_re='[a-z0-9][a-z0-9-]*'
          num_re='(0|[1-9][0-9]*)'

          chart_path_re="^${name_re}/${num_re}\.${num_re}\.${num_re}$"

          if [[ ! "$CHART" =~ $chart_path_re ]]; then
            echo "::error::Invalid chart path. Expected <name>/<major>.<minor>.<patch> (stable versions only): ${CHART}"
            exit 1
          fi

          chart_path="charts/${CHART}/Chart.yaml"

          if [[ ! -f "$chart_path" ]]; then
            echo "::error::No chart found at ${chart_path}"
            exit 1
          fi

          if ! grep -q 'https://github.com/nutanix-cloud-native/nkp-ai-applications-catalog' "$chart_path"; then
            echo "::error::${chart_path} is missing catalog source link required for package-to-repo linkage"
            exit 1
          fi

          name="$(awk -F': *' '/^name:/{print $2; exit}' "$chart_path")"
          version="$(awk -F': *' '/^version:/{print $2; exit}' "$chart_path")"
          input_name="${CHART%%/*}"
          if [[ "$name" != "$input_name" ]]; then
            echo "::error::Path chart name ${input_name} does not match Chart.yaml name ${name}"
            exit 1
          fi
          input_version="${CHART##*/}"
          if [[ "$version" != "$input_version" ]]; then
            echo "::error::Path version ${input_version} does not match Chart.yaml version ${version}"
            exit 1
          fi
          tgz="${RUNNER_TEMP}/${name}-${version}.tgz"

          echo "==> Linting ${CHART}"
          devbox run -- helm lint "charts/${CHART}"

          echo "==> Publishing ${CHART}"
          devbox run -- helm package "charts/${CHART}" -d "${RUNNER_TEMP}"
          if [[ ! -f "$tgz" ]]; then
            echo "::error::Expected package not found at ${tgz}"
            exit 1
          fi
          devbox run -- helm push "$tgz" oci://ghcr.io/nutanix-cloud-native/charts
          {
            echo "## Published first-party chart"
            echo ""
            echo "| Chart | Version | Path |"
            echo "|---|---|---|"
            echo "| ${name} | ${version} | charts/${CHART} |"
            echo ""
            echo "> This workflow only publishes packages. If a package is not public, update visibility in GHCR package settings."
          } >> "$GITHUB_STEP_SUMMARY"
