name: Black Duck Scans

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Catalog version for parent project'
        type: string
        required: false
        default: 'dev'
      source_code_scan:
        description: 'Enable source code scanning'
        type: boolean
        default: true
      container_image_scan:
        description: 'Enable container image scanning'
        type: boolean
        default: true
      parallel_scans:
        description: 'Number of concurrent scans'
        type: number
        default: 4
      timeout:
        description: 'Total scan timeout'
        type: string
        default: '4h'
      verbosity:
        description: 'Logging verbosity level'
        type: number
        default: 1

permissions:
  contents: read

jobs:
  source-code-scan:
    if: github.repository == 'nutanix-cloud-native/nkp-ai-applications-catalog'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Black Duck Full Scan
        uses: blackduck-inc/black-duck-security-scan@v2.8.0
        with:
          blackducksca_url: ${{ secrets.BLACKDUCK_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCK_API_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          blackducksca_scan_full: true
          blackducksca_scan_failure_severities: 'BLOCKER,CRITICAL'

  full-scan:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_licenses-scan.yaml
    with:
      version: ${{ inputs.version || 'dev' }}
      parent_project: "NKP AI Applications Catalog"
      source_code_scan: ${{ inputs.source_code_scan == '' && true || inputs.source_code_scan }}
      container_image_scan: ${{ inputs.container_image_scan == '' && true || inputs.container_image_scan }}
      parallel_scans: ${{ inputs.parallel_scans || 4 }}
      timeout: ${{ inputs.timeout || '4h' }}
      verbosity: ${{ inputs.verbosity || 1 }}
    secrets: inherit
