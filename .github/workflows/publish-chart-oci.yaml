name: Publish Chart to GHCR

on:
  workflow_dispatch:
    inputs:
      chart_repo:
        description: 'Source Helm repository URL (e.g., https://weaviate.github.io/weaviate-helm/)'
        type: string
        required: true
      chart_name:
        description: 'Helm chart name in the upstream repo (e.g., weaviate)'
        type: string
        required: true
      chart_version:
        description: 'Helm chart version'
        type: string
        required: true

jobs:
  push-chart:
    name: Publish Chart to GHCR
    runs-on:
      - self-hosted-nutanix-medium
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Nix on self-hosted ARC runners
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.13.0
        with:
          skip-nix-installation: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart using just/script
        run: |
          devbox run -- just push-helm-to-oci \
            "${{ github.event.inputs.chart_repo }}" \
            "${{ github.event.inputs.chart_name }}" \
            "${{ github.event.inputs.chart_version }}"
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
