name: Publish Chart to GHCR

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'Source type: "helm-repo" for traditional Helm repos, "oci" for upstream OCI registries'
        type: choice
        options:
          - helm-repo
          - oci
        default: helm-repo
        required: true
      upstream_url:
        description: 'Upstream URL — Helm repo (e.g., https://otwld.github.io/ollama-helm/) or OCI (e.g., oci://registry-1.docker.io/bitnamicharts/nginx)'
        type: string
        required: true
      chart_name:
        description: 'Chart name in the Helm repo (helm-repo only, e.g., ollama)'
        type: string
        required: false
      chart_version:
        description: 'Chart version to mirror'
        type: string
        required: true

jobs:
  push-chart:
    name: Publish Chart to GHCR
    runs-on:
      - self-hosted-nutanix-medium
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Nix on self-hosted ARC runners
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.13.0
        with:
          skip-nix-installation: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror chart from Helm repo
        if: inputs.source_type == 'helm-repo'
        run: |
          devbox run -- just mirror-chart-from-repo \
            "${{ inputs.upstream_url }}" \
            "${{ inputs.chart_name }}" \
            "${{ inputs.chart_version }}"
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror chart from upstream OCI registry
        if: inputs.source_type == 'oci'
        run: |
          devbox run -- just mirror-chart-from-oci \
            "${{ inputs.upstream_url }}" \
            "${{ inputs.chart_version }}"
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
