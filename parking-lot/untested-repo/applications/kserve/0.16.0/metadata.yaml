overview: |
  **What it is** — KServe provides a standard, Kubernetes-native way to deploy and serve ML models with autoscaling, canary rollouts, and multi-framework support (PyTorch, TensorFlow, scikit-learn, XGBoost, etc.) behind a single InferenceService API. Turns trained models into scalable, production-ready inference services.

  **Highlights**
  - Single InferenceService CRD for multiple frameworks (PyTorch, TensorFlow, SKLearn, XGBoost, etc.)
  - Serverless scaling to zero and canary/blue-green deployments
  - Integrates with Kubeflow, MLflow, and S3/GCS model storage
  - Part of the Kubeflow project; supports vLLM and custom runtimes

  **In-cluster usage**

  Each InferenceService gets a predictable URL: `http://<name>.<namespace>.svc.cluster.local` or the KServe virtual service host. Use `kubectl get inferenceservice -n <namespace>` to list services. Clients call the predictor endpoint; see [KServe docs](https://kserve.github.io/website/) for the request format.

  **Documentation:** [KServe docs](https://kserve.github.io/website/) | **Project:** [GitHub](https://github.com/kserve/kserve)
