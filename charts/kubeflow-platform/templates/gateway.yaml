# Binds kubeflow-gateway to the dedicated Kubeflow ingress pods.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: kubeflow-gateway
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    istio: {{ .Values.dedicatedIngress.gatewayLabel }}
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - {{ .Values.config.kubeflowIngressHost | default "*" | quote }}
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: kubeflow-oauth2-proxy
  namespace: {{ .Release.Namespace }}
spec:
  gateways:
    - kubeflow-gateway
  hosts:
    - "*"
  http:
    - route:
        - destination:
            host: oauth2-proxy.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 80
