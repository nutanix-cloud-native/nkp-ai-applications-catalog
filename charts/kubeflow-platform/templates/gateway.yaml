# Binds kubeflow-gateway to the dedicated Kubeflow ingress pods.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: kubeflow-gateway
  namespace: kubeflow
spec:
  selector:
    istio: {{ .Values.dedicatedIngress.gatewayLabel }}
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - {{ .Values.config.kubeflowIngressHost | default "*" | quote }}
{{- if and .Values.tls.enabled .Values.tls.redirectHttpToHttps }}
      tls:
        httpsRedirect: true
{{- end }}
{{- if .Values.tls.enabled }}
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: {{ required "kubeflow-platform: tls.secretName is required when tls.enabled is true" .Values.tls.secretName | quote }}
      hosts:
        - {{ .Values.config.kubeflowIngressHost | default "*" | quote }}
{{- end }}
---


apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: kubeflow-oauth2-proxy
  namespace: kubeflow
spec:
  gateways:
    - kubeflow-gateway
  hosts:
    - "*"
  http:
    - route:
        - destination:
            host: oauth2-proxy.kubeflow.svc.cluster.local
            port:
              number: 80
