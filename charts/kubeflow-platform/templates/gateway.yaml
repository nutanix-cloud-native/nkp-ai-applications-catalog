# Binds kubeflow-gateway to NKP's istio-helm-ingressgateway and routes all ingress
# to oauth2-proxy. This is the gateway the app-shipped VirtualServices assume.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: kubeflow-gateway
  namespace: kubeflow
spec:
  selector:
    istio: istio-helm-ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: kubeflow-oauth2-proxy
  namespace: kubeflow
spec:
  gateways:
    - kubeflow-gateway
  hosts:
    - "*"
  http:
    - route:
        - destination:
            host: oauth2-proxy.kubeflow.svc.cluster.local
            port:
              number: 80
