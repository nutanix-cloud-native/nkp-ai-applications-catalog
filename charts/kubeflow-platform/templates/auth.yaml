{{- $c := include "kubeflow-platform.derived" . | fromYaml -}}
{{- if lookup "v1" "Namespace" "" "kube-system" -}}
{{- /* Empty kubeflowIngressHost is tolerated at install time; secret-syncer fills oauth2/Dex once the LoadBalancer has an address. */ -}}
{{- if not $c.dexIssuerURL -}}
{{- fail "kubeflow-platform: could not derive Dex issuer from kommander-vars.ingressAddress - set config.dexIssuerURL." -}}
{{- end -}}
{{- end -}}
# Persists the generated secrets so upgrades reuse them (no login churn).
# Note: We use Helm lookups to preserve these secrets. If this Secret is
# deleted, Helm regenerates values on the next reconciliation. This is safe,
# but it invalidates active sessions and users must sign in again.
apiVersion: v1
kind: Secret
metadata:
  name: kubeflow-platform-generated
  namespace: kubeflow
type: Opaque
stringData:
  oauth2ClientSecret: {{ $c.oauth2ClientSecret | quote }}
  oauth2CookieSecret: {{ $c.oauth2CookieSecret | quote }}
  kubeflowIngressHost: {{ $c.kubeflowIngressHost | quote }}
---
# Single sign-on entry point: authenticates against NKP Dex, injects
# kubeflow-userid/-groups, and path-routes to each UI.
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-config
  namespace: kubeflow
type: Opaque
stringData:
  oauth2_proxy.cfg: |
    reverse_proxy = true
    email_domains = ["*"]
    cookie_secret = "{{ $c.oauth2CookieSecret }}"
    cookie_name = "oauth2_proxy_kubeflow"
    cookie_secure = {{ .Values.tls.enabled }}
    ssl_insecure_skip_verify = true

    skip_provider_button = false
    redirect_url = "{{ if $c.kubeflowIngressURL }}{{ $c.kubeflowIngressURL }}{{ else }}http://127.0.0.1{{ end }}/oauth2/callback"
    whitelist_domains = ["{{ if $c.kubeflowIngressHost }}{{ $c.kubeflowIngressHost }}{{ else }}127.0.0.1{{ end }}"]

  alpha.yaml: |
    server:
      bindAddress: "0.0.0.0:4180"
    upstreamConfig:
      upstreams:
{{- range .Values.routes }}
        - id: {{ .id }}
          path: {{ .path }}
          uri: {{ .uri }}
{{- end }}
    injectRequestHeaders:
      - name: kubeflow-userid
        values:
          - claim: {{ default "email" .Values.config.userIDClaim }}
      - name: kubeflow-groups
        values:
          - claim: groups
    providers:
      - id: dex
        provider: oidc
        clientID: dex-controller-kubeflow-oauth2-proxy
        clientSecret: "{{ $c.oauth2ClientSecret }}"
        scope: "openid profile email groups"
        oidcConfig:
          issuerURL: "{{ $c.dexIssuerURL }}"
          emailClaim: email
          groupsClaim: groups
          userIDClaim: {{ default "email" .Values.config.userIDClaim | quote }}
          audienceClaims: ["aud"]
          insecureAllowUnverifiedEmail: true
---
apiVersion: v1
kind: Secret
metadata:
  name: kubeflow-oauth2-client-secret
  namespace: kommander
type: Opaque
stringData:
  client-secret: "{{ $c.oauth2ClientSecret }}"
---
apiVersion: dex.mesosphere.io/v1alpha1
kind: Client
metadata:
  name: kubeflow-oauth2-proxy
  namespace: kommander
spec:
  clientSecretRef:
    name: kubeflow-oauth2-client-secret
  displayName: Kubeflow
{{- if $c.kubeflowIngressURL }}
  redirectURIs:
    - "{{ $c.kubeflowIngressURL }}/oauth2/callback"
{{- else }}
  redirectURIs: []
{{- end }}
