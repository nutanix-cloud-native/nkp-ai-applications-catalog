apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-syncer
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeflow-platform.fullname" . }}-secret-syncer-role
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "patch", "update"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeflow-platform.fullname" . }}-secret-syncer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeflow-platform.fullname" . }}-secret-syncer-role
subjects:
- kind: ServiceAccount
  name: secret-syncer
  namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-syncer
  namespace: {{ .Release.Namespace }}
  labels:
    app: secret-syncer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-syncer
  template:
    metadata:
      labels:
        app: secret-syncer
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: secret-syncer
      containers:
      - name: syncer
        image: {{ .Values.workloads.secretsyncer.image | quote }}
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - |
          set +e
          echo "secret-syncer started (profiles + pipelines secret sync)"
          ISTIO_REV="{{ .Values.dedicatedIngress.istioRevision | default "istio-helm" }}"
          RELEASE_NS="{{ .Release.Namespace }}"
          INJECT_NS="{{ .Release.Namespace }} kubeflow-central-dashboard katib"

          while true; do
            for ns in $INJECT_NS; do
              if ! kubectl get ns "$ns" >/dev/null 2>&1; then
                continue
              fi
              current=$(kubectl get ns "$ns" -o jsonpath='{.metadata.labels.istio\.io/rev}' 2>/dev/null)
              if [ "$current" != "$ISTIO_REV" ]; then
                echo "Labeling namespace $ns istio.io/rev=$ISTIO_REV and rolling workloads"
                kubectl label ns "$ns" "istio.io/rev=$ISTIO_REV" --overwrite
                kubectl -n "$ns" rollout restart deploy,statefulset 2>/dev/null
              fi
            done

            if ! kubectl get secret mlpipeline-minio-artifact -n "$RELEASE_NS" >/dev/null 2>&1; then
              echo "Waiting for mlpipeline-minio-artifact in $RELEASE_NS (created by kubeflow-pipelines, not this chart)"
              sleep 15
              continue
            fi

            TARGETS=$(kubectl get ns -l pipelines.kubeflow.org/enabled=true -o jsonpath='{.items[*].metadata.name}')
            for ns in $TARGETS; do
              if [ "$ns" = "$RELEASE_NS" ]; then
                continue
              fi
              # Profile namespaces need revision-based labels for predictable sidecar
              # injection; remove legacy istio-injection to avoid webhook selector conflicts.
              kubectl label ns "$ns" istio-injection- >/dev/null 2>&1 || true
              current=$(kubectl get ns "$ns" -o jsonpath='{.metadata.labels.istio\.io/rev}' 2>/dev/null)
              if [ "$current" != "$ISTIO_REV" ]; then
                kubectl label ns "$ns" "istio.io/rev=$ISTIO_REV" --overwrite >/dev/null
                kubectl -n "$ns" rollout restart deploy,statefulset 2>/dev/null
              fi
              kubectl get secret mlpipeline-minio-artifact -n "$RELEASE_NS" -o yaml | \
                grep -vE "uid:|resourceVersion:|creationTimestamp:|managedFields:|namespace: ${RELEASE_NS}" | \
                kubectl apply -n "$ns" -f - >/dev/null
            done
            sleep 30
          done
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
