apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-syncer
  namespace: kubeflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-syncer-role
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secret-syncer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secret-syncer-role
subjects:
- kind: ServiceAccount
  name: secret-syncer
  namespace: kubeflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-syncer
  namespace: kubeflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-syncer
  template:
    metadata:
      labels:
        app: secret-syncer
        sidecar.istio.io/inject: "false" # No need for mTLS overhead here
    spec:
      serviceAccountName: secret-syncer
      containers:
      - name: syncer
        image: bitnami/kubectl:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Starting lightweight secret syncer..."
          while true; do
            # Find all namespaces that Kubeflow created
            for ns in $(kubectl get ns -l pipelines.kubeflow.org/enabled=true -o jsonpath='{.items[*].metadata.name}'); do
              # If the secret doesn't exist in the namespace yet, copy it!
              if ! kubectl get secret mlpipeline-minio-artifact -n "$ns" >/dev/null 2>&1; then
                echo "Copying storage secret to $ns"
                kubectl get secret mlpipeline-minio-artifact -n kubeflow -o yaml | sed "s/namespace: kubeflow/namespace: $ns/" | grep -v 'uid:' | grep -v 'resourceVersion:' | grep -v 'creationTimestamp:' | kubectl apply -n "$ns" -f -
              fi
            done
            sleep 10
          done
