{{- $tlsName := .Values.tls.name | default (include "kubeflow-platform.fullname" .) -}}
{{- $caSecretName := .Values.tls.selfSigned.caSecretName | default (printf "%s-ca" $tlsName) -}}
{{- $tlsSecretName := .Values.tls.secretName | default "kubeflow-tls" -}}
{{- $caIssuerName := .Values.tls.selfSigned.caIssuerName | default (printf "%s-ca-issuer" $tlsName) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-syncer
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeflow-platform.fullname" . }}-secret-syncer-role
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "patch"]
- apiGroups: [""]
  resources: ["services"]
  resourceNames: [{{ .Values.dedicatedIngress.serviceName | quote }}]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
  - oauth2-proxy-config
  - kubeflow-platform-generated
  - mlpipeline-minio-artifact
{{- if .Values.tls.enabled }}
  - {{ $caSecretName | quote }}
  - {{ $tlsSecretName | quote }}
{{- end }}
  verbs: ["get", "patch", "update"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
# get/create needed for `kubectl apply` of the CA ConfigMap; patch covers dashboard updates.
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "patch"]
- apiGroups: ["dex.mesosphere.io"]
  resources: ["clients"]
  resourceNames: ["kubeflow-oauth2-proxy"]
  verbs: ["get", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeflow-platform.fullname" . }}-secret-syncer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeflow-platform.fullname" . }}-secret-syncer-role
subjects:
- kind: ServiceAccount
  name: secret-syncer
  namespace: {{ .Release.Namespace }}
{{- if and .Values.tls.enabled (ne .Values.tls.mode "existingSecret") }}
---
# Namespace-scoped: only the leaf Certificate this chart owns (not cluster-wide).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubeflow-platform.fullname" . }}-secret-syncer-certs
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: ["cert-manager.io"]
  resources: ["certificates"]
  verbs: ["create"]
- apiGroups: ["cert-manager.io"]
  resources: ["certificates"]
  resourceNames: [{{ $tlsName | quote }}]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeflow-platform.fullname" . }}-secret-syncer-certs
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubeflow-platform.fullname" . }}-secret-syncer-certs
subjects:
- kind: ServiceAccount
  name: secret-syncer
  namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-syncer
  namespace: {{ .Release.Namespace }}
  labels:
    app: secret-syncer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-syncer
  template:
    metadata:
      labels:
        app: secret-syncer
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: secret-syncer
      containers:
      - name: syncer
        image: {{ .Values.workloads.secretsyncer.image | quote }}
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - |
          set +e
          echo "secret-syncer started (ingress + dashboard + profiles + pipelines secret sync)"
          ISTIO_REV="{{ .Values.dedicatedIngress.istioRevision | default "istio-helm" }}"
          RELEASE_NS="{{ .Release.Namespace }}"
          INJECT_NS="{{ .Release.Namespace }} kubeflow-central-dashboard katib"
          INGRESS_SVC="{{ .Values.dedicatedIngress.serviceName }}"
          CONFIGURED_HOST="{{ .Values.config.kubeflowIngressHost }}"
          CONFIGURED_URL="{{ .Values.config.kubeflowIngressURL }}"
          TLS_ENABLED="{{ .Values.tls.enabled }}"
          TLS_MODE="{{ .Values.tls.mode }}"
          TLS_NAME="{{ $tlsName }}"
          TLS_SECRET="{{ $tlsSecretName }}"
          TLS_CA_SECRET="{{ $caSecretName }}"
          TLS_CA_ISSUER="{{ $caIssuerName }}"
          TLS_ISSUER_NAME="{{ .Values.tls.issuerRef.name }}"
          TLS_ISSUER_KIND="{{ .Values.tls.issuerRef.kind | default "ClusterIssuer" }}"
          TLS_ISSUER_GROUP="{{ .Values.tls.issuerRef.group | default "cert-manager.io" }}"
          TLS_LEAF_DURATION="{{ .Values.tls.selfSigned.leafDuration | default "2160h" }}"
          TLS_LEAF_RENEW_BEFORE="{{ .Values.tls.selfSigned.leafRenewBefore | default "360h" }}"
          DASHBOARD_NS="{{ .Values.dashboard.namespace }}"
          DASHBOARD_CM="{{ .Values.dashboard.configMapName }}"
          APPLIED_STATE=""
          CA_APPLIED_STATE=""
          echo "ingress config: host=${CONFIGURED_HOST:-auto} url=${CONFIGURED_URL:-derive} dashboard=${DASHBOARD_NS}/${DASHBOARD_CM}"

          b64_decode() { base64 -d 2>/dev/null || base64 --decode; }
          b64_encode() { base64 | tr -d '\n'; }

          is_ipv4() {
            printf '%s' "$1" | grep -qE '^[0-9]+(\.[0-9]+){3}$'
          }

          read_oauth2_cfg() {
            kubectl get secret oauth2-proxy-config -n kubeflow \
              -o jsonpath='{.data.oauth2_proxy\.cfg}' 2>/dev/null | b64_decode
          }

          rewrite_oauth2_cfg() {
            _cfg=$1
            printf '%s\n' "$_cfg" | while IFS= read -r _line || [ -n "$_line" ]; do
              case "$_line" in
                redirect_url\ =*)
                  _line="redirect_url = \"$INGRESS_URL/oauth2/callback\"" ;;
                whitelist_domains\ =*)
                  _line="whitelist_domains = [\"$INGRESS_HOST\"]" ;;
              esac
              printf '%s\n' "$_line"
            done
          }

          copy_secret_data() {
            _src_ns=$1; _name=$2; _dst_ns=$3
            _o='{{ printf "{{" }}'; _c='{{ printf "}}" }}'
            _gt="apiVersion: v1\nkind: Secret\nmetadata:\n  name: ${_o}.metadata.name${_c}\ntype: ${_o}.type${_c}\ndata:\n${_o}range \$k, \$v := .data${_c}  ${_o}\$k${_c}: ${_o}\$v${_c}\n${_o}end${_c}"
            kubectl get secret "$_name" -n "$_src_ns" -o "go-template=$(printf '%b' "$_gt")" 2>/dev/null \
              | kubectl apply -n "$_dst_ns" -f - >/dev/null
          }

          ensure_istio_rev() {
            _ns=$1
            _quiet=${2:-}
            _cur=$(kubectl get ns "$_ns" -o jsonpath='{.metadata.labels.istio\.io/rev}' 2>/dev/null)
            [ "$_cur" = "$ISTIO_REV" ] && return 0
            [ -z "$_quiet" ] && echo "Labeling namespace $_ns istio.io/rev=$ISTIO_REV and rolling workloads"
            if [ -n "$_quiet" ]; then
              kubectl label ns "$_ns" "istio.io/rev=$ISTIO_REV" --overwrite >/dev/null
            else
              kubectl label ns "$_ns" "istio.io/rev=$ISTIO_REV" --overwrite
            fi
            kubectl -n "$_ns" rollout restart deploy,statefulset 2>/dev/null
          }

          resolve_ingress() {
            INGRESS_HOST="$CONFIGURED_HOST"
            if [ -z "$INGRESS_HOST" ]; then
              INGRESS_HOST=$(kubectl get svc "$INGRESS_SVC" -n kubeflow \
                -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
              [ -z "$INGRESS_HOST" ] && INGRESS_HOST=$(kubectl get svc "$INGRESS_SVC" -n kubeflow \
                -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            fi
            INGRESS_URL=""
            if [ -n "$INGRESS_HOST" ]; then
              if [ -n "$CONFIGURED_HOST" ] && [ -n "$CONFIGURED_URL" ]; then
                INGRESS_URL="$CONFIGURED_URL"
              elif [ "$TLS_ENABLED" = "true" ]; then
                INGRESS_URL="https://$INGRESS_HOST"
              else
                INGRESS_URL="http://$INGRESS_HOST"
              fi
            fi
            CURRENT_STATE="$INGRESS_HOST|$INGRESS_URL"
          }

          ingress_needs_sync() {
            [ "$CURRENT_STATE" != "$APPLIED_STATE" ] && return 0
            _live=$(read_oauth2_cfg)
            case "$_live" in
              *"redirect_url = \"$INGRESS_URL/oauth2/callback\""*) return 1 ;;
              *) return 0 ;;
            esac
          }

          # Create or patch the leaf Certificate with the discovered host as SAN.
          # Empty-host Helm installs omit the leaf; admission cannot store a cert without SANs.
          ensure_leaf_certificate() {
            [ "$TLS_ENABLED" = "true" ] || return 0
            [ "$TLS_MODE" = "existingSecret" ] && return 0
            [ -n "$INGRESS_HOST" ] || return 0

            if is_ipv4 "$INGRESS_HOST"; then
              _san_key="ipAddresses"
            else
              _san_key="dnsNames"
            fi

            if kubectl get certificate "$TLS_NAME" -n "$RELEASE_NS" >/dev/null 2>&1; then
              kubectl patch certificate "$TLS_NAME" -n "$RELEASE_NS" --type merge \
                -p "{\"spec\":{\"${_san_key}\":[\"$INGRESS_HOST\"]}}" >/dev/null 2>&1 \
                || { echo "warn: patch Certificate $TLS_NAME SAN failed"; return 1; }
              return 0
            fi

            if [ "$TLS_MODE" = "selfSigned" ]; then
              _issuer_name="$TLS_CA_ISSUER"
              _issuer_kind="Issuer"
              _issuer_group="cert-manager.io"
              _selfsigned_fields=",\"duration\":\"$TLS_LEAF_DURATION\",\"renewBefore\":\"$TLS_LEAF_RENEW_BEFORE\",\"privateKey\":{\"algorithm\":\"ECDSA\",\"size\":256,\"rotationPolicy\":\"Always\"},\"usages\":[\"server auth\"]"
            elif [ "$TLS_MODE" = "certManager" ]; then
              [ -n "$TLS_ISSUER_NAME" ] || { echo "warn: tls.issuerRef.name required for certManager leaf create"; return 1; }
              _issuer_name="$TLS_ISSUER_NAME"
              _issuer_kind="$TLS_ISSUER_KIND"
              _issuer_group="$TLS_ISSUER_GROUP"
              _selfsigned_fields=""
            else
              return 0
            fi

            echo "creating leaf Certificate $TLS_NAME with $_san_key=$INGRESS_HOST"
            # One-line JSON avoids heredoc indentation issues inside the Helm script block.
            printf '%s\n' "{\"apiVersion\":\"cert-manager.io/v1\",\"kind\":\"Certificate\",\"metadata\":{\"name\":\"$TLS_NAME\",\"namespace\":\"$RELEASE_NS\",\"labels\":{\"app.kubernetes.io/part-of\":\"kubeflow-platform-tls\",\"app.kubernetes.io/component\":\"tls\"}},\"spec\":{\"secretName\":\"$TLS_SECRET\",\"${_san_key}\":[\"$INGRESS_HOST\"],\"issuerRef\":{\"name\":\"$_issuer_name\",\"kind\":\"$_issuer_kind\",\"group\":\"$_issuer_group\"}${_selfsigned_fields}}}" \
              | kubectl apply -f - >/dev/null 2>&1 \
              || { echo "warn: create Certificate $TLS_NAME failed"; return 1; }
          }

          # Block https URL rewrite / oauth2 restart until material is Ready.
          wait_tls_material() {
            [ "$TLS_ENABLED" = "true" ] || return 0
            if [ "$TLS_MODE" != "existingSecret" ]; then
              _ready=$(kubectl get certificate "$TLS_NAME" -n "$RELEASE_NS" \
                -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)
              [ "$_ready" = "True" ] || {
                echo "waiting for Certificate $TLS_NAME Ready=True"
                return 1
              }
            fi
            _crt=$(kubectl get secret "$TLS_SECRET" -n "$RELEASE_NS" \
              -o jsonpath='{.data.tls\.crt}' 2>/dev/null)
            _key=$(kubectl get secret "$TLS_SECRET" -n "$RELEASE_NS" \
              -o jsonpath='{.data.tls\.key}' 2>/dev/null)
            [ -n "$_crt" ] && [ -n "$_key" ] || {
              echo "waiting for TLS Secret $TLS_SECRET tls.crt/tls.key"
              return 1
            }
            return 0
          }

          patch_oauth2_cfg() {
            _cfg=$(read_oauth2_cfg)
            if [ -z "$_cfg" ]; then
              echo "warn: oauth2-proxy-config missing or empty; will retry"
              return 1
            fi
            _encoded=$(rewrite_oauth2_cfg "$_cfg" | b64_encode)
            kubectl patch secret oauth2-proxy-config -n kubeflow --type merge \
              -p "{\"data\":{\"oauth2_proxy.cfg\":\"$_encoded\"}}" >/dev/null 2>&1 \
              || { echo "warn: patch oauth2-proxy-config failed"; return 1; }
          }

          patch_ingress_dependents() {
            _ok=0
            kubectl patch secret kubeflow-platform-generated -n kubeflow --type merge \
              -p "{\"stringData\":{\"kubeflowIngressHost\":\"$INGRESS_HOST\"}}" >/dev/null 2>&1 \
              || { echo "warn: patch kubeflow-platform-generated failed"; _ok=1; }
            kubectl patch client kubeflow-oauth2-proxy -n kommander --type merge \
              -p "{\"spec\":{\"redirectURIs\":[\"$INGRESS_URL/oauth2/callback\"]}}" >/dev/null 2>&1 \
              || { echo "warn: patch Dex Client redirectURIs failed"; _ok=1; }
            if [ -n "$DASHBOARD_NS" ] && [ -n "$DASHBOARD_CM" ]; then
              kubectl patch configmap "$DASHBOARD_CM" -n "$DASHBOARD_NS" --type merge \
                -p "{\"data\":{\"dashboardLink\":\"$INGRESS_URL/\"}}" >/dev/null 2>&1 \
                || { echo "warn: patch dashboard ConfigMap $DASHBOARD_NS/$DASHBOARD_CM failed"; _ok=1; }
            fi
            return "$_ok"
          }

          # CA ConfigMap publish — independent of ingress APPLIED_STATE.
          reconcile_ca_configmap() {
            [ "$TLS_ENABLED" = "true" ] || return 0
            case "$TLS_MODE" in
              selfSigned) ;;
              *) return 0 ;;
            esac
            [ "$CA_APPLIED_STATE" = "$TLS_CA_SECRET" ] && return 0

            _ca_data=$(kubectl get secret "$TLS_CA_SECRET" -n "$RELEASE_NS" \
              -o jsonpath='{.data.ca\.crt}' 2>/dev/null | b64_decode)
            if [ -z "$_ca_data" ]; then
              echo "waiting for CA Secret $TLS_CA_SECRET"
              return 1
            fi
            printf '%s' "$_ca_data" | kubectl create configmap "${TLS_NAME}-ca" \
              -n "$RELEASE_NS" --from-file=ca.crt=/dev/stdin \
              --dry-run=client -o yaml | kubectl apply -f - >/dev/null 2>&1 \
              || { echo "warn: reconcile CA ConfigMap ${TLS_NAME}-ca failed"; return 1; }
            CA_APPLIED_STATE="$TLS_CA_SECRET"
            echo "Published CA ConfigMap ${TLS_NAME}-ca"
            return 0
          }

          restart_oauth2() {
            if kubectl rollout restart deployment/oauth2-proxy -n kubeflow >/dev/null 2>&1; then
              APPLIED_STATE="$CURRENT_STATE"
              echo "Applied Kubeflow ingress host=$INGRESS_HOST url=$INGRESS_URL"
              return 0
            fi
            echo "warn: patched ingress config but oauth2-proxy restart failed; will retry"
            return 1
          }

          reconcile_ingress() {
            if [ -z "$INGRESS_HOST" ] || [ -z "$INGRESS_URL" ]; then
              echo "waiting for kubeflow ingress address (LoadBalancer or config.kubeflowIngressHost)"
              return
            fi

            # Ensure leaf exists/SAN is set before gating on Ready.
            ensure_leaf_certificate || true

            ingress_needs_sync || return

            if [ "$TLS_ENABLED" = "true" ]; then
              wait_tls_material || return
            fi

            echo "reconciling ingress host=$INGRESS_HOST url=$INGRESS_URL"
            _sync_ok=1
            patch_oauth2_cfg || _sync_ok=0
            patch_ingress_dependents || _sync_ok=0
            if [ "$_sync_ok" -eq 1 ]; then
              restart_oauth2 || true
            else
              echo "ingress reconcile incomplete; will retry"
            fi
          }

          label_inject_namespaces() {
            for _ns in $INJECT_NS; do
              kubectl get ns "$_ns" >/dev/null 2>&1 || continue
              ensure_istio_rev "$_ns"
            done
          }

          sync_pipeline_secrets() {
            kubectl get secret mlpipeline-minio-artifact -n "$RELEASE_NS" >/dev/null 2>&1 || return
            _targets=$(kubectl get ns -l pipelines.kubeflow.org/enabled=true \
              -o jsonpath='{.items[*].metadata.name}')
            for _ns in $_targets; do
              [ "$_ns" = "$RELEASE_NS" ] && continue
              kubectl label ns "$_ns" istio-injection- >/dev/null 2>&1 || true
              ensure_istio_rev "$_ns" quiet
              copy_secret_data "$RELEASE_NS" mlpipeline-minio-artifact "$_ns" || true
            done
          }

          while true; do
            resolve_ingress
            reconcile_ingress
            reconcile_ca_configmap || true
            label_inject_namespaces
            sync_pipeline_secrets
            sleep 30
          done
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
