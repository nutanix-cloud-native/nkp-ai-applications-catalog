apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-syncer
  namespace: {{ .Release.Namespace }}
{{- if .Values.tls.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeflow-platform.fullname" . }}-istio-tls-reader
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeflow-platform.fullname" . }}-istio-tls-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeflow-platform.fullname" . }}-istio-tls-reader
subjects:
- kind: ServiceAccount
  name: {{ .Values.dedicatedIngress.serviceName }}
  namespace: kubeflow
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeflow-platform.fullname" . }}-secret-syncer-role
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "patch"]
- apiGroups: [""]
  resources: ["services"]
  resourceNames: [{{ .Values.dedicatedIngress.serviceName | quote }}]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
  - oauth2-proxy-config
  - kubeflow-platform-generated
  - mlpipeline-minio-artifact
  verbs: ["get", "patch", "update"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["patch"]
- apiGroups: ["dex.mesosphere.io"]
  resources: ["clients"]
  resourceNames: ["kubeflow-oauth2-proxy"]
  verbs: ["get", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeflow-platform.fullname" . }}-secret-syncer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeflow-platform.fullname" . }}-secret-syncer-role
subjects:
- kind: ServiceAccount
  name: secret-syncer
  namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-syncer
  namespace: {{ .Release.Namespace }}
  labels:
    app: secret-syncer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-syncer
  template:
    metadata:
      labels:
        app: secret-syncer
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: secret-syncer
      containers:
      - name: syncer
        image: {{ .Values.workloads.secretsyncer.image | quote }}
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - |
          set +e
          echo "secret-syncer started (ingress + dashboard + profiles + pipelines secret sync)"
          ISTIO_REV="{{ .Values.dedicatedIngress.istioRevision | default "istio-helm" }}"
          RELEASE_NS="{{ .Release.Namespace }}"
          INJECT_NS="{{ .Release.Namespace }} kubeflow-central-dashboard katib"
          INGRESS_SVC="{{ .Values.dedicatedIngress.serviceName }}"
          CONFIGURED_HOST="{{ .Values.config.kubeflowIngressHost }}"
           CONFIGURED_URL="{{ .Values.config.kubeflowIngressURL }}"
           TLS_ENABLED="{{ .Values.tls.enabled }}"
           DASHBOARD_NS="{{ .Values.dashboard.namespace }}"

          DASHBOARD_CM="{{ .Values.dashboard.configMapName }}"
          APPLIED_STATE=""
          echo "ingress config: host=${CONFIGURED_HOST:-auto} url=${CONFIGURED_URL:-derive} dashboard=${DASHBOARD_NS}/${DASHBOARD_CM}"

          # Decode base64 data with either supported flag.
          b64_decode() { base64 -d 2>/dev/null || base64 --decode; }
          # Encode data as a single-line base64 value.
          b64_encode() { base64 | tr -d '\n'; }

          # Read the oauth2-proxy configuration from its Secret.
          read_oauth2_cfg() {
            kubectl get secret oauth2-proxy-config -n kubeflow \
              -o jsonpath='{.data.oauth2_proxy\.cfg}' 2>/dev/null | b64_decode
          }

          # Rewrite ingress-dependent oauth2-proxy settings.
          rewrite_oauth2_cfg() {
            _cfg=$1
            _out=
            # Pipe keeps every source line indented (heredoc EOF would break the YAML | block).
            printf '%s\n' "$_cfg" | while IFS= read -r _line || [ -n "$_line" ]; do
              case "$_line" in
                redirect_url\ =*)
                  _line="redirect_url = \"$INGRESS_URL/oauth2/callback\"" ;;
                whitelist_domains\ =*)
                  _line="whitelist_domains = [\"$INGRESS_HOST\"]" ;;
              esac
              printf '%s\n' "$_line"
            done
          }

          # Rebuild Secret YAML from .data only — no grep over live metadata.
          # Copy only Secret data into the destination namespace.
          copy_secret_data() {
            _src_ns=$1; _name=$2; _dst_ns=$3
            _o='{{ printf "{{" }}'; _c='{{ printf "}}" }}'
            # Keep this on one YAML-indented line (\n escapes) so the | block stays valid.
            _gt="apiVersion: v1\nkind: Secret\nmetadata:\n  name: ${_o}.metadata.name${_c}\ntype: ${_o}.type${_c}\ndata:\n${_o}range \$k, \$v := .data${_c}  ${_o}\$k${_c}: ${_o}\$v${_c}\n${_o}end${_c}"
            kubectl get secret "$_name" -n "$_src_ns" -o "go-template=$(printf '%b' "$_gt")" 2>/dev/null \
              | kubectl apply -n "$_dst_ns" -f - >/dev/null
          }

          # Apply the Istio revision label and restart namespace workloads.
          ensure_istio_rev() {
            _ns=$1
            _quiet=${2:-}
            _cur=$(kubectl get ns "$_ns" -o jsonpath='{.metadata.labels.istio\.io/rev}' 2>/dev/null)
            [ "$_cur" = "$ISTIO_REV" ] && return 0
            [ -z "$_quiet" ] && echo "Labeling namespace $_ns istio.io/rev=$ISTIO_REV and rolling workloads"
            if [ -n "$_quiet" ]; then
              kubectl label ns "$_ns" "istio.io/rev=$ISTIO_REV" --overwrite >/dev/null
            else
              kubectl label ns "$_ns" "istio.io/rev=$ISTIO_REV" --overwrite
            fi
            kubectl -n "$_ns" rollout restart deploy,statefulset 2>/dev/null
          }

          # Resolve the ingress host and URL from configuration or the LoadBalancer.
          resolve_ingress() {
            INGRESS_HOST="$CONFIGURED_HOST"
            if [ -z "$INGRESS_HOST" ]; then
              INGRESS_HOST=$(kubectl get svc "$INGRESS_SVC" -n kubeflow \
                -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
              [ -z "$INGRESS_HOST" ] && INGRESS_HOST=$(kubectl get svc "$INGRESS_SVC" -n kubeflow \
                -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            fi
                        INGRESS_URL=""
             if [ -n "$INGRESS_HOST" ]; then
               if [ -n "$CONFIGURED_HOST" ] && [ -n "$CONFIGURED_URL" ]; then
                 INGRESS_URL="$CONFIGURED_URL"
               elif [ "$TLS_ENABLED" = "true" ]; then
                 INGRESS_URL="https://$INGRESS_HOST"
               else
                 INGRESS_URL="http://$INGRESS_HOST"
               fi
             fi

            CURRENT_STATE="$INGRESS_HOST|$INGRESS_URL"
          }

          # Check whether ingress configuration needs to be applied.
          ingress_needs_sync() {
            [ "$CURRENT_STATE" != "$APPLIED_STATE" ] && return 0
            _live=$(read_oauth2_cfg)
            case "$_live" in
              *"redirect_url = \"$INGRESS_URL/oauth2/callback\""*) return 1 ;;
              *) return 0 ;;
            esac
          }

          # Patch oauth2-proxy with the resolved ingress settings.
          patch_oauth2_cfg() {
            _cfg=$(read_oauth2_cfg)
            if [ -z "$_cfg" ]; then
              echo "warn: oauth2-proxy-config missing or empty; will retry"
              return 1
            fi
            _encoded=$(rewrite_oauth2_cfg "$_cfg" | b64_encode)
            kubectl patch secret oauth2-proxy-config -n kubeflow --type merge \
              -p "{\"data\":{\"oauth2_proxy.cfg\":\"$_encoded\"}}" >/dev/null 2>&1 \
              || { echo "warn: patch oauth2-proxy-config failed"; return 1; }
          }

          # Patch dependent secrets, Dex client, and dashboard URL.
          patch_ingress_dependents() {
            _ok=0
            kubectl patch secret kubeflow-platform-generated -n kubeflow --type merge \
              -p "{\"stringData\":{\"kubeflowIngressHost\":\"$INGRESS_HOST\"}}" >/dev/null 2>&1 \
              || { echo "warn: patch kubeflow-platform-generated failed"; _ok=1; }
            kubectl patch client kubeflow-oauth2-proxy -n kommander --type merge \
              -p "{\"spec\":{\"redirectURIs\":[\"$INGRESS_URL/oauth2/callback\"]}}" >/dev/null 2>&1 \
              || { echo "warn: patch Dex Client redirectURIs failed"; _ok=1; }
            if [ -n "$DASHBOARD_NS" ] && [ -n "$DASHBOARD_CM" ]; then
              kubectl patch configmap "$DASHBOARD_CM" -n "$DASHBOARD_NS" --type merge \
                -p "{\"data\":{\"dashboardLink\":\"$INGRESS_URL/\"}}" >/dev/null 2>&1 \
                || { echo "warn: patch dashboard ConfigMap $DASHBOARD_NS/$DASHBOARD_CM failed"; _ok=1; }
            fi
            return "$_ok"
          }

          # Restart oauth2-proxy after all ingress updates succeed.
          restart_oauth2() {
            if kubectl rollout restart deployment/oauth2-proxy -n kubeflow >/dev/null 2>&1; then
              APPLIED_STATE="$CURRENT_STATE"
              echo "Applied Kubeflow ingress host=$INGRESS_HOST url=$INGRESS_URL"
              return 0
            fi
            echo "warn: patched ingress config but oauth2-proxy restart failed; will retry"
            return 1
          }

          # Reconcile ingress configuration and dependent resources.
          reconcile_ingress() {
            if [ -z "$INGRESS_HOST" ] || [ -z "$INGRESS_URL" ]; then
              echo "waiting for kubeflow ingress address (LoadBalancer or config.kubeflowIngressHost)"
              return
            fi
            ingress_needs_sync || return

            echo "reconciling ingress host=$INGRESS_HOST url=$INGRESS_URL"
            _sync_ok=1
            patch_oauth2_cfg || _sync_ok=0
            patch_ingress_dependents || _sync_ok=0
            if [ "$_sync_ok" -eq 1 ]; then
              restart_oauth2 || true
            else
              echo "ingress reconcile incomplete; will retry"
            fi
          }

          # Label known component namespaces for Istio sidecar injection.
          label_inject_namespaces() {
            for _ns in $INJECT_NS; do
              kubectl get ns "$_ns" >/dev/null 2>&1 || continue
              ensure_istio_rev "$_ns"
            done
          }

          # Copy the pipeline artifact Secret into enabled profile namespaces.
          sync_pipeline_secrets() {
            kubectl get secret mlpipeline-minio-artifact -n "$RELEASE_NS" >/dev/null 2>&1 || return
            _targets=$(kubectl get ns -l pipelines.kubeflow.org/enabled=true \
              -o jsonpath='{.items[*].metadata.name}')
            for _ns in $_targets; do
              [ "$_ns" = "$RELEASE_NS" ] && continue
              # Prefer istio.io/rev; drop legacy istio-injection on profile namespaces.
              kubectl label ns "$_ns" istio-injection- >/dev/null 2>&1 || true
              ensure_istio_rev "$_ns" quiet
              copy_secret_data "$RELEASE_NS" mlpipeline-minio-artifact "$_ns" || true
            done
          }

          while true; do
            resolve_ingress
            reconcile_ingress
            label_inject_namespaces
            sync_pipeline_secrets
            sleep 30
          done
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
