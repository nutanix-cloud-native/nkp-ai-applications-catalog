# Host is optional; other fields are derived or generated unless explicitly
# overridden. Empty host: secret-syncer discovers the dedicated LB address.
config:
  # Empty -> https://<kommander-vars.ingressAddress>/dex
  dexIssuerURL: ""
  # Optional override; defaults to http://<kubeflowIngressHost>, or https://<host> when tls.enabled. Set only with a host.
  # URL alone (without host) is not supported.
  kubeflowIngressURL: ""
  # Optional. DNS name or IP; empty uses the allocated kubeflow-ingressgateway LB.
  # Primary ingress knob — do not rely on URL-only configuration.
  kubeflowIngressHost: ""
  # Empty -> generated once, then preserved across upgrades
  oauth2ClientSecret: ""
  oauth2CookieSecret: ""
  # Dex OIDC claim copied into kubeflow-userid. Profile.owner must equal this
  # value. Default email matches typical customer SSO; username-only Dex can
  # set preferred_username. Changing this after users have Profiles orphans them.
  userIDClaim: email
  # Where to read the Kubeflow ingress LoadBalancer address from
  ingressGatewayNamespace: istio-helm-gateway-ns
  ingressGatewayService: istio-helm-ingressgateway
  ingressGatewayPrincipal: ""
namespace: kubeflow

tls:
  enabled: true
  name: ""
  mode: selfSigned
  secretName: kubeflow-tls
  redirectHttpToHttps: true
  issuerRef:
    name: ""
    kind: ClusterIssuer
    group: cert-manager.io
  selfSigned:
    issuerName: ""
    caIssuerName: ""
    caCertificateName: ""
    caSecretName: ""
    duration: 87600h
    leafDuration: 2160h
    leafRenewBefore: 360h

# Dedicated Kubeflow edge: new gateway pods in this release namespace plus a
# LoadBalancer Service. Does not reuse istio-helm-ingressgateway pods.
dedicatedIngress:
  enabled: true
  serviceName: kubeflow-ingressgateway
  gatewayLabel: kubeflow-ingressgateway
  gatewayName: kubeflow-gateway
  istioRevision: istio-helm
  # Real image so airgap can pull it. Do not use Istio's "auto" — nkp tries
  # to download docker.io/library/auto:latest. istiod still swaps this at runtime.
  proxyImage: docker.io/istio/proxyv2:1.29.0
  replicas: 2
  annotations: {}
  loadBalancerIP: ""
  externalTrafficPolicy: Cluster
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# oauth2-proxy's route table: it logs users in once against Dex, then path-routes to
# each component UI. Add a component by appending {id, path, uri} here or via
# configOverrides - no template edit. Keep the catch-all "/" last. OIDC-capable apps
# (e.g. JupyterHub) don't belong here; they use their own Dex client + ingress.
dashboard:
  namespace: ""
  configMapName: ""

routes:
  - id: katib
    path: /katib/
    uri: http://katib-ui.katib.svc.cluster.local
  - id: pipeline-apis
    path: /apis/
    uri: http://ml-pipeline-ui.kubeflow.svc.cluster.local
  # gRPC-Web MLMD. Trailing slash is required: a non-slash path is an exact match,
  # so it misses and falls through to the dashboard ("Unknown Content-type").
  - id: pipeline-mlmd
    path: /ml_metadata.MetadataStoreService/
    uri: http://metadata-envoy-service.kubeflow.svc.cluster.local:9090
  - id: pipeline-artifacts
    path: /artifacts/
    uri: http://ml-pipeline-ui.kubeflow.svc.cluster.local
  - id: pipeline
    path: /pipeline/
    uri: http://ml-pipeline-ui.kubeflow.svc.cluster.local
  # Browser KFAM must pass oauth2-proxy. A VirtualService that sends /kfam/
  # straight to profiles-kfam makes Istio deny the ingress principal
  # (RBAC: access denied) or, if that principal is allowed, lets anyone
  # spoof kubeflow-userid. We do not use Istio ext_authz.
  - id: kfam
    path: /kfam/
    uri: http://profiles-kfam.kubeflow.svc.cluster.local:8081
  - id: dashboard
    path: /
    uri: http://centraldashboard.kubeflow-central-dashboard.svc.cluster.local

# Labels stamped on every user Profile namespace so component controllers/webhooks
# act on it. Add a component's required label here when you onboard it.
profileNamespaceLabels:
  # Use revision-based injection labels for profile namespaces. The Istio injector
  # webhook in this cluster ignores namespaces that set both istio.io/rev and
  # istio-injection, so we standardize on istio.io/rev only.
  istio.io/rev: "istio-helm"
  katib.kubeflow.org/metrics-collector-injection: "enabled"
  serving.kubeflow.org/inferenceservice: "enabled"
  pipelines.kubeflow.org/enabled: "true"
  app.kubernetes.io/part-of: "kubeflow-profile"

# Per-user workspaces. Each entry renders a Kubeflow Profile (isolated namespace +
# RBAC); owner must equal kubeflow-userid (config.userIDClaim, default email).
# Removing an entry prunes that namespace, so edit with care.
profiles: []
#  - name: alice
#    owner: alice@example.com

workloads:
  oauth2proxy:
    replicas: 1
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  profiles:
    replicas: 1
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  secretsyncer:
    image: alpine/k8s:1.31.2
