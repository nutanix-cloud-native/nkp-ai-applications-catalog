apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.airm.namespace }}
  annotations:
    # Keep the namespace on Helm uninstall. Its PVCs, the CNPG cluster, and the
    # RabbitMQ cluster live in this namespace, so deleting it destroys the data.
    helm.sh/resource-policy: keep
  labels:
    {{- include "amd-resource-manager.labels" . | nindent 4 }}
---
