# AMD Resource Manager orchestration chart values.
# Current implementation scope: all mode only.
#
# Source of truth for airm / gateway / versions pins.
# applications/.../helmrelease/cm.yaml only injects Flux-substituted catalog.*
# wiring. Omit overrides there so these defaults apply; configOverrides/--set win.

airm:
  # Allowed values: all | management | agent
  # Only "all" is implemented in this chart version.
  mode: all
  imageTag: "2.0.0"
  # Empty by default; catalog cm.yaml substitutes NKP ${clusterName}.
  clusterName: ""
  # Initial AIRM UI user. Used as the login name, so the UI email is
  # <username>@<domain>. 1-64 lowercase letters, digits, dots, dashes, or underscores.
  username: devuser
  # Not used as of now. The upstream configure Job is not run as part of
  # all-mode installation; stages 09-bootstrap and 10-identity-sync replace its
  # registration and RabbitMQ identity work. Kept in case demo setup is included later.
  includeDemoSetup: false
  namespace: airm

catalog:
  # Filled at deploy by applications/.../helmrelease/cm.yaml (Flux postBuild).
  # Empty here so local helm template/lint still works with --set.
  sourceName: ""
  sourceNamespace: ""
  releaseName: ""
  releaseNamespace: ""

gateway:
  name: airm-https
  # Empty → use catalog.releaseNamespace (release namespace), not hardcoded kommander.
  namespace: ""
  tlsSecretName: airm-gateway-tls
  gatewayClassName: traefik
  listenerName: websecure

# Optional cluster-specific overrides. Empty values are discovered by 00-preflight.
# The discovery Job name is hashed from job settings, overrides, discovery.sh,
# and the rendered RBAC template so relevant changes create a new Job.
discovery:
  domain: ""
  storageClass: ""
  prometheusUrl: ""

keycloak:
  namespace: keycloak
  # Keycloak client ID for the AIRM admin client. Intentionally empty: the catalog
  # supplies the cluster UUID through cm.yaml (keycloak.adminClientId: ${clusterUUID}).
  # Stage 01 rejects any value that is not a UUID.
  adminClientId: ""
  chartUrl: oci://registry-1.docker.io/bitnamicharts/keycloak
  images:
    keycloak:
      repository: bitnamilegacy/keycloak
      tag: 26.3.3-debian-12-r0
    configCli:
      repository: bitnamilegacy/keycloak-config-cli
      tag: 6.4.0-debian-12-r11
    postgresql:
      repository: bitnamilegacy/postgresql
      tag: 17.6.0-debian-12-r0
    postgresExporter:
      repository: bitnamilegacy/postgres-exporter
      tag: 0.17.1-debian-12-r15
    osShell:
      repository: bitnamilegacy/os-shell
      tag: 12-debian-12-r50

toolImages:
  cluster: docker.io/alpine/k8s:1.35.0
  openssl: docker.io/alpine/openssl:3.5.4

chartSources:
  airmApi: oci://registry-1.docker.io/amdenterpriseai/airm-api-chart
  airmAgent: oci://registry-1.docker.io/amdenterpriseai/airm-agent-chart
  airmCnpg: oci://registry-1.docker.io/amdenterpriseai/airm-cnpg-chart
  airmRabbitmq: oci://registry-1.docker.io/amdenterpriseai/airm-rabbitmq-chart

# Pinned chart and image versions.
versions:
  airmChart: "2.0.0"
  airmApiChart: "2.0.0"
  airmAgentChart: "2.0.0"
  airmCnpgChart: "2.0.0"
  airmRabbitmqChart: "2.0.0"
  # Kaiwo and AIM Engine versions of the CRDs vendored in
  # applications/amd-resource-manager/2.0.0/helmrelease/stages/07a-agent-crd-definitions/.
  # Documentation only: changing these does not change the installed CRDs.
  # Re-vendor the files in that directory and update the provenance headers to upgrade.
  kaiwo: "v0.1.9"
  aimEngine: "v0.2.1"
  keycloakChart: "25.2.0"
  # RabbitMQ Cluster Operator version of the manifest vendored in
  # applications/amd-resource-manager/2.0.0/helmrelease/stages/05a-operators/.
  # Documentation only: changing this does not change the installed operator.
  # Re-vendor the manifest and update its provenance header to upgrade.
  rabbitmqOperator: "v2.22.5"

# Stage Flux Kustomizations reconcile paths under the catalog application OCI source.
stages:
  interval: 1m
  timeout: 5m
  retryInterval: 1m
  # Default prune for stages that do not set their own. Removing a stage, or an
  # object from a stage, makes Flux delete that object. Stateful stages override this.
  prune: true
  # Flux waits for every object in a stage to be Ready before dependent stages start.
  wait: true

# All-mode stage order and dependencies.
allModeStages:
  - name: 00-preflight
    dependsOn: []
    timeout: 25m
  - name: 01-secrets
    dependsOn:
      - 00-preflight
  - name: 02-gateway
    dependsOn:
      - 01-secrets
  - name: 03a-keycloak
    dependsOn:
      - 01-secrets
      - 02-gateway
    # Keycloak's HelmRelease, namespace, and PVC-backed database (stateful).
    # Renaming this stage removes its old Kustomization. That is only safe while
    # the old name also has prune false. Upgrades from the 2.0.0 chart (03-keycloak,
    # prune true) delete Keycloak.
    # prune false: removing or renaming this stage leaves Keycloak in the cluster.
    # Without it, Flux deletes these objects, including the database.
    prune: false
    # force false: if a change needs an immutable field replaced, the apply fails.
    # Flux does not delete and recreate the objects. The HelmRelease's own
    # upgrade.force (see resources.yaml) is a separate setting.
    force: false
    healthChecks:
      - apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        name: airm-keycloak
  - name: 03b-keycloak-config
    dependsOn:
      - 03a-keycloak
    # AIRM configuration Job. Keeps force true (the default), so a changed Job
    # template is recreated. Job templates are immutable.
    healthChecks:
      - apiVersion: batch/v1
        kind: Job
        name: airm-keycloak-config
  - name: 04-storage
    dependsOn:
      - 03b-keycloak-config
    healthChecks:
      - apiVersion: batch/v1
        kind: Job
        name: airm-storage
  - name: 05a-operators
    dependsOn:
      - 04-storage
    timeout: 12m
    # Prune disabled so removing this stage never deletes the RabbitMQ operator
    # CRDs or the RabbitmqCluster resources stored under them.
    prune: false
    # force false: without this, the stage inherits force: true. Replacing the CRD
    # would delete every RabbitmqCluster stored under it.
    force: false
    healthChecks:
      - apiVersion: apps/v1
        kind: Deployment
        name: rabbitmq-cluster-operator
        namespace: rabbitmq-system
  - name: 05b-infrastructure
    dependsOn:
      - 05a-operators
    timeout: 12m
    # Prune and force disabled so removing or regenerating this stage never
    # deletes the CNPG Cluster, RabbitMQ cluster, or their PVCs. Stages with
    # Jobs keep force: true, because Job specs are immutable.
    # prune false: removing this stage leaves the CNPG and RabbitMQ clusters and their PVCs.
    prune: false
    # force false: a change that needs the CNPG or RabbitMQ cluster replaced fails
    # instead of Flux deleting and recreating it.
    force: false
    healthChecks:
      - apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        name: airm-infra-cnpg
      - apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        name: airm-infra-rabbitmq
      - apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        name: airm-infra-cnpg-cnpg
        namespace: airm
      - apiVersion: rabbitmq.com/v1beta1
        kind: RabbitmqCluster
        name: airm-infra-rabbitmq-rabbitmq
        namespace: airm
  - name: 06-rabbitmq-config
    dependsOn:
      - 05b-infrastructure
    timeout: 12m
    healthChecks:
      - apiVersion: batch/v1
        kind: Job
        name: airm-rabbitmq-config
  - name: 07a-agent-crd-definitions
    dependsOn:
      - 06-rabbitmq-config
    # Prune disabled so removing this stage never deletes the CRDs or the
    # custom resources stored under them.
    prune: false
    # force false: without this, the stage inherits force: true. Replacing a CRD
    # would delete every custom resource stored under it.
    force: false
    timeout: 15m
  - name: 07b-kaiwo-queue-seed
    # Depends only on 07a: 07a already depends on 06, and 07a is Ready only
    # once every CRD is Established.
    dependsOn:
      - 07a-agent-crd-definitions
    timeout: 12m
    healthChecks:
      - apiVersion: batch/v1
        kind: Job
        name: airm-kaiwo-queue-seed
  - name: 08-management
    dependsOn:
      - 07b-kaiwo-queue-seed
    timeout: 12m
    healthChecks:
      - apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        name: airm-management
      - apiVersion: apps/v1
        kind: Deployment
        name: airm-api
        namespace: airm
      - apiVersion: apps/v1
        kind: Deployment
        name: airm-ui
        namespace: airm
  - name: 09-bootstrap
    dependsOn:
      - 08-management
    timeout: 15m
    healthChecks:
      - apiVersion: batch/v1
        kind: Job
        name: airm-registration
  - name: 10-identity-sync
    dependsOn:
      - 09-bootstrap
    timeout: 12m
    healthChecks:
      - apiVersion: batch/v1
        kind: Job
        name: airm-identity-sync
  - name: 11-gateway-tls
    dependsOn:
      - 10-identity-sync
    timeout: 20m
    healthChecks:
      - apiVersion: batch/v1
        kind: Job
        name: airm-gateway-tls
  - name: 12-agent
    dependsOn:
      - 11-gateway-tls
    timeout: 10m
    healthChecks:
      - apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        name: airm-agent
      - apiVersion: apps/v1
        kind: Deployment
        name: airm-agent-agent
        namespace: airm
  - name: 13-post-install
    dependsOn:
      - 12-agent
    timeout: 12m
    healthChecks:
      - apiVersion: batch/v1
        kind: Job
        name: airm-post-install
